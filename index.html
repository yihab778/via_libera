    if (!m.ready) return `<div class="panel mondo locked"><div class="row between"><h3>${m.icon} Mondo ${m.n} · ${esc(m.name)}</h3><span class="small muted">in arrivo</span></div></div>`;
    const b = S.boss[m.id], all = ATOMS.filter(a => m.units.includes(a.u));
    const bossBtn = b?.passed ? `<span class="tag fond">🏅 Boss superato (${b.best}/20)</span>` : mondoReadyForBoss(m) ? `<button class="btn" style="background:var(--accent);color:var(--accent-ink)" data-boss="${m.id}">⚔️ Affronta il Boss${b ? ` · record ${b.best}/20` : ''}</button>` : `<span class="small muted">⚔️ Boss: si sblocca dopo aver visto tutti i concetti del Mondo</span>`;
    return `<div class="panel stack mondo"><div class="row between"><h3>${m.icon} Mondo ${m.n} · ${esc(m.name)}</h3><b class="tnum small">${pct(all.reduce((t, a) => t + (peek(a.id)?.st || 0) / 4, 0) / all.length)}</b></div>
      ${m.partial ? `<p class="small muted">${esc(m.partial)}</p>` : ''}
      <div>${m.units.map(uid => { const u = UNIT[uid], as = ATOMS.filter(a => a.u === uid), seen = as.filter(a => peek(a.id)?.seen).length;
        return `<div class="unit"><div class="row between"><b>${u.lez}. ${esc(u.title)}</b><span class="small muted tnum">${seen}/${as.length}</span></div>${stageBar(as)}
        <div class="row"><button class="btn line small" style="flex:1" data-browse="${uid}">📖 Card</button><button class="btn line small" style="flex:1" data-uquiz="${uid}" ${seen ? '' : 'disabled'}>🎯 Quiz</button></div></div>`; }).join('')}</div>
      ${bossBtn}</div>`;
  }).join('')}</div>`;
}

function browseView() {
  const as = ATOMS.filter(a => a.u === BROWSE.u), a = as[BROWSE.i];
  return `<div class="stack"><div class="shead"><button class="x" data-act="closebrowse" aria-label="Chiudi">✕</button><div class="meter"><i style="width:${(BROWSE.i + 1) / as.length * 100}%"></i></div><span class="small muted tnum">${BROWSE.i + 1}/${as.length}</span></div>
    <span class="phase muted">📖 ${esc(UNIT[BROWSE.u].title)}</span><div class="panel stack">${cardBody(a)}</div>
    <div class="row"><button class="btn line" style="flex:.6" data-act="bprev" aria-label="Indietro" ${BROWSE.i ? '' : 'disabled'}>←</button><button class="btn line" style="flex:.6" data-act="tutor" aria-label="Non ho capito">🤷</button><button class="btn" style="flex:1.4;background:var(--accent);color:var(--accent-ink)" data-act="bnext">${BROWSE.i < as.length - 1 ? 'Avanti →' : 'Fine'}</button></div></div>`;
}

function statsView() {
  const { c, red } = stageCounts(), days = [];
  for (let d = today() - 6; d <= today(); d++) days.push({ d, ...(S.days[d] || { q: 0, ok: 0 }) });
  const maxQ = Math.max(10, ...days.map(x => x.q));
  const tot = Object.values(S.days).reduce((t, x) => t + x.q, 0), okT = Object.values(S.days).reduce((t, x) => t + x.ok, 0);
  const w7 = days.reduce((t, x) => t + x.q, 0), ok7 = days.reduce((t, x) => t + x.ok, 0);
  const traps = Object.entries(S.traps).sort((x, y) => y[1] - x[1]).slice(0, 5);
  const wd = ['D', 'L', 'M', 'M', 'G', 'V', 'S'];
  const examStr = new Date(S.exam * 86400000).toISOString().slice(0, 10);
  return `<div class="stack"><div class="top"><div><div class="eyebrow">Progressi</div><h1>Come stai andando</h1></div></div>
    <div class="panel stack"><div class="row between"><span>🔥 Streak</span><b class="tnum">${streakNow()} giorni</b></div>
      <div class="row between"><span>Domande risposte</span><b class="tnum">${tot}</b></div>
      <div class="row between"><span>Precisione ultimi 7 giorni</span><b class="tnum">${w7 ? pct(ok7 / w7) : '—'}</b></div>
      <div class="row between"><span>Precisione totale</span><b class="tnum">${tot ? pct(okT / tot) : '—'}</b></div></div>
    <div class="panel stack"><span class="eyebrow">🛣️ Livello</span>${(() => { const L = level(); return `<div class="row between"><b>${L.name}</b><span class="tnum">${L.km} km</span></div>${L.next ? `<div class="meter"><i style="width:${Math.min(100, L.km / L.next[0] * 100)}%;background:var(--accent)"></i></div><p class="small muted">Prossimo livello: ${L.next[1]} a ${L.next[0]} km. I km si guadagnano solo rispondendo bene (il doppio sui ripassi e sulle sfide).</p>` : ''}<p class="small muted">"Pronto per l'esame" si sblocca solo con 5 simulazioni di fila con al massimo 3 errori.</p>`; })()}</div>
    <div class="panel stack"><span class="eyebrow">🏁 Simulazioni d'esame</span>${(S.sims || []).length ? (S.sims || []).slice(-8).reverse().map(x => `<div class="row between"><span>${new Date(x.d * 86400000).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</span><b class="tnum" style="color:${x.err <= 3 ? 'var(--green)' : 'var(--red)'}">${x.err} errori · ${x.err <= 3 ? 'promosso' : 'bocciato'}</b></div>`).join('') : '<p class="small muted">Nessuna simulazione ancora. Consigliate dal giorno 15, poi una al giorno.</p>'}</div>
    <div class="panel stack"><span class="eyebrow">Ultimi 7 giorni</span>
      <svg viewBox="0 0 280 110" style="width:100%;height:auto" role="img" aria-label="Domande per giorno">
        ${days.map((x, i) => { const hq = x.q / maxQ * 80, ho = x.ok / maxQ * 80, X = 12 + i * 38; return `<rect x="${X}" y="${90 - hq}" width="26" height="${hq}" rx="4" fill="var(--red-soft)"/><rect x="${X}" y="${90 - ho}" width="26" height="${ho}" rx="4" fill="var(--green)"/><text x="${X + 13}" y="106" font-size="11" text-anchor="middle" fill="var(--muted)">${wd[new Date(x.d * 86400000).getUTCDay()]}</text>${x.q ? `<text x="${X + 13}" y="${86 - hq}" font-size="10" text-anchor="middle" fill="var(--muted)">${x.q}</text>` : ''}`; }).join('')}
      </svg><p class="small muted">Verde = risposte giuste, rosa = sbagliate.</p></div>
    <div class="panel stack"><span class="eyebrow">Stato dei ${ATOMS.length} concetti</span>${stageBar(ATOMS, 'meter')}
      <div class="legend"><span><i style="background:var(--green)"></i>${c[4]} padroneggiati</span><span><i style="background:var(--yellow)"></i>${c[2] + c[3]} consolidati</span><span><i style="background:var(--orange)"></i>${c[1]} in apprendimento</span><span><i style="background:var(--blue)"></i>${c[0]} nuovi</span><span><i style="background:var(--red)"></i>${red} da sicuro</span></div></div>
    <div class="panel stack"><span class="eyebrow">🪤 Profilo trappole</span>${traps.length ? traps.map(([w, n]) => `<div class="row between"><span>Parola «${esc(w)}» nelle frasi sbagliate</span><b class="tnum">${n}</b></div>`).join('') : '<p class="small muted">Ancora nessun dato. Qui vedrai su quali parole trappola cadi più spesso.</p>'}</div>
    <div class="panel stack"><span class="eyebrow">Impostazioni</span>
      <label class="row between" for="exam"><span>Data dell'esame</span><input type="date" id="exam" value="${examStr}"></label>
      <p class="small muted">I ripassi vengono programmati entro il giorno prima dell'esame.</p>
      <p class="small muted">Salvataggio: ${db ? '☁️ progressi salvati nel tuo account' : '📱 progressi salvati su questo dispositivo'}</p>
      <div class="stack" style="gap:8px"><span class="eyebrow">Trasferisci i progressi</span>
        <p class="small muted">Per spostare i progressi tra la versione su Claude e l'app installata sul telefono: copia il codice da una, incollalo nell'altra.</p>
        <div class="row"><button class="btn line small" style="flex:1" data-act="export">📤 Copia codice</button><button class="btn line small" style="flex:1" data-act="import">📥 Incolla codice</button></div>
        ${XFER === 'export' ? `<textarea id="expcode" readonly>${esc(exportCode())}</textarea><p class="small muted">Codice copiato (se il telefono lo permette). Altrimenti selezionalo e copialo a mano.</p>` : ''}
        ${XFER === 'import' ? `<textarea id="impcode" placeholder="Incolla qui il codice"></textarea><button class="btn" style="background:var(--accent);color:var(--accent-ink)" data-act="doimport">Importa (sostituisce i progressi attuali)</button>` : ''}
      </div>
      <button class="btn line small" data-act="askreset">Azzera i progressi</button>
    </div></div>`;
}

function errorsView() {
  const list = S.errors.filter(e => ATOM[e.id]).slice(0, 60);
  const pool = ATOMS.filter(a => { const s = peek(a.id); return s && s.w > 0 && s.st < 3; });
  return `<div class="stack"><div class="top"><div><div class="eyebrow">Diario degli errori</div><h1>Impara dagli sbagli</h1></div></div>
    ${pool.length ? `<button class="cta" data-act="marathon">🧹 Maratona errori (${Math.min(15, pool.length)})</button>` : ''}
    <div class="panel">${list.length ? list.map(e => { const a = ATOM[e.id], q = a.q[e.qi]; return `<div class="err"><span class="small muted">${esc(UNIT[a.u].title)} · ${e.sure ? '🔴 da sicuro' : '🤔'}</span><p>${esc(q.s)}</p><p><span class="ans ${q.v ? 'v' : 'f'}">${q.v ? 'VERO' : 'FALSO'}</span> · ${esc(q.why)}</p></div>`; }).join('') : '<p class="muted">Nessun errore finora. Quando sbagli, la domanda finisce qui con la spiegazione.</p>'}</div></div>`;
}

// ───────── tutor sheet ─────────
function openTutor() {
  let a;
  if (VIEW === 'browse') a = ATOMS.filter(x => x.u === BROWSE.u)[BROWSE.i];
  else a = ATOM[SES.steps[SES.i].a];
  SHEET = { a: a.id, tab: 'semplice', qi: VIEW === 'session' ? SES.qstate?.qi : null };
  renderSheet();
}
function renderSheet() {
  let el = document.getElementById('sheet');
  if (!SHEET || SHEET.reset || SHEET.exconfirm) {
    if (SHEET?.reset) {
      if (!el) { el = document.createElement('div'); el.id = 'sheet'; document.body.appendChild(el); }
      el.innerHTML = `<div class="scrim" data-act="closesheet"><div class="sheet" data-stop><h3>Azzerare tutti i progressi?</h3><p>Perderai padronanza, streak ed errori salvati. Non si può annullare.</p><div class="row"><button class="btn line" style="flex:1" data-act="closesheet">Annulla</button><button class="btn red" style="flex:1" data-act="doreset">Azzera</button></div></div></div>`;
      return;
    }
    if (el) el.remove(); return;
  }
  const a = ATOM[SHEET.a], alt = a.alt || { semplice: a.cos || a.signif || (a.twins && a.twins.diff), esempio: a.esempio };
  if (!el) { el = document.createElement('div'); el.id = 'sheet'; document.body.appendChild(el); }
  const tabs = [['semplice', '🟢 Più semplice'], ['esempio', '🚗 Esempio'], ['card', '📖 La card'], ['segnala', '🚩 Segnala']];
  let body = '';
  if (SHEET.tab === 'semplice') body = `<p style="font-size:18px">${esc(alt.semplice)}</p>${has(a.trucco) ? `<div class="box b-trucco"><h4>💡 Trucco</h4><p>${esc(a.trucco)}</p></div>` : ''}`;
  else if (SHEET.tab === 'esempio') body = `<p style="font-size:18px">${esc(has(alt.esempio) ? alt.esempio : alt.semplice)}</p>`;
  else if (SHEET.tab === 'card') body = cardBody(a);
  else body = SHEET.sent ? `<div class="box b-ricorda"><p>Grazie! Segnalazione salvata ${db ? 'nel tuo account: la leggerò e correggerò il contenuto.' : 'su questo dispositivo.'}</p></div>`
    : `<p class="small">Qualcosa non ti torna o ti sembra sbagliato? Scrivilo: verifico sulla fonte ufficiale e correggo.</p><textarea id="rep" placeholder="Es. «La lezione dice il contrario…»"></textarea><button class="btn" style="background:var(--accent);color:var(--accent-ink)" data-act="sendrep">Invia segnalazione</button>`;
  el.innerHTML = `<div class="scrim" data-act="closesheet"><div class="sheet" data-stop role="dialog" aria-label="Tutor"><div class="row between"><h3>🤷 ${esc(a.title)}</h3><button class="x" data-act="closesheet" aria-label="Chiudi">✕</button></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${SHEET.tab === k}">${l}</button>`).join('')}</div><div class="stack">${body}</div></div></div>`;
}
async function sendReport() {
  const t = (document.getElementById('rep')?.value || '').trim();
  if (!t) return;
  const rep = { atom: SHEET.a, qi: SHEET.qi ?? null, text: t.slice(0, 2000), at: new Date().toISOString() };
  let ok = false;
  if (db) { try { await db.collection('reports').add(rep); ok = true; } catch (e) {} }
  if (!ok) { S.reports.push(rep); save(); }
  SHEET.sent = true; renderSheet();
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ───────── eventi ─────────
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act],[data-veh]');
  if (!t) return;
  if (t.classList.contains('scrim') && e.target !== t) return;
  const d = t.dataset;
  if (d.v) { VIEW = d.v; render(); window.scrollTo(0, 0); return; }
  if (d.min) { SEL_MIN = +d.min; render(); return; }
  if (d.ans) { answer(d.ans === '1'); return; }
  if (d.veh) { crossTap(d.veh); return; }
  if (d.tr) { toggleTr(d.tr); return; }
  if (d.exgo) { EX.i = +d.exgo; SHEET = null; render(); return; }
  if (d.exans) { EX.ans[EX.i] = d.exans === '1'; if (EX.i < 29) EX.i++; render(); return; }
  if (d.conf) { commit(d.conf === '1'); return; }
  if (d.tab) { SHEET.tab = d.tab; renderSheet(); return; }
  if (d.browse) { BROWSE = { u: d.browse, i: 0 }; VIEW = 'browse'; render(); window.scrollTo(0, 0); return; }
  if (d.uquiz) { const as = ATOMS.filter(a => a.u === d.uquiz && peek(a.id)?.seen); let list = []; while (list.length < 10) list = list.concat(weightedPick(as, Math.min(as.length, 10 - list.length), weakness)); startSession(list.map(a => ({ k: 'q', a: a.id, mode: 'quiz', ph: '🎯 ' + UNIT[d.uquiz].title })), 'unit'); return; }
  if (d.boss) { startSession([{ k: 'intro', boss: d.boss }].concat(bossSteps(d.boss)), 'boss'); return; }
  switch (d.act) {
    case 'crossreset': SES.cstate = { seq: [], res: null }; render(); break;
    case 'exam': startExam(); break;
    case 'exprev': EX.i = Math.max(0, EX.i - 1); render(); break;
    case 'exnext': EX.i = Math.min(29, EX.i + 1); render(); break;
    case 'exconfirm': SHEET = { exconfirm: true }; render(); break;
    case 'exnoconf': SHEET = null; render(); break;
    case 'exsubmit': SHEET = null; submitExam(); break;
    case 'exquit': clearInterval(EXT); EX = null; SHEET = null; VIEW = 'home'; render(); break;
    case 'exhome': EX = null; VIEW = 'home'; render(); window.scrollTo(0, 0); break;
    case 'crossonly': startSession(pickScenarios(5).map(sc => ({ k: 'cross', sc: sc.id, ph: '🚦 Simulatore incroci' })), 'cross'); break;
    case 'trap': startSession(trapSteps(10), 'trap'); break;
    case 'go': startSession(stepsFromMission(buildMission(SEL_MIN)), 'mission'); break;
    case 'next': next(); break;
    case 'quit': if (SES.res.length) finish(); else { SES = null; VIEW = 'home'; clearInterval(TIMER); render(); } break;
    case 'home': SES = null; VIEW = 'home'; render(); window.scrollTo(0, 0); break;
    case 'tutor': openTutor(); break;
    case 'closesheet': SHEET = null; renderSheet(); break;
    case 'sendrep': sendReport(); break;
    case 'fixred': { const as = ATOMS.filter(a => peek(a.id)?.red); startSession(as.map(a => ({ k: 'q', a: a.id, mode: 'quiz', ph: '🔴 Convinzioni da correggere' })), 'red'); break; }
    case 'marathon': { const as = ATOMS.filter(a => { const s = peek(a.id); return s && s.w > 0 && s.st < 3; }).sort((x, y) => weakness(y) - weakness(x)).slice(0, 15); if (!as.length) { toast('Nessun errore da ripassare 🎉'); break; } startSession(as.map(a => ({ k: 'q', a: a.id, mode: 'quiz', ph: '🧹 Maratona errori' })), 'marathon'); break; }
    case 'bprev': BROWSE.i = Math.max(0, BROWSE.i - 1); render(); window.scrollTo(0, 0); break;
    case 'bnext': { const n = ATOMS.filter(a => a.u === BROWSE.u).length; if (BROWSE.i < n - 1) { BROWSE.i++; render(); window.scrollTo(0, 0); } else { VIEW = 'path'; render(); } break; }
    case 'closebrowse': VIEW = 'path'; render(); break;
    case 'export': { XFER = 'export'; render(); const c = exportCode(); try { navigator.clipboard.writeText(c).then(() => toast('Codice copiato'), () => {}); } catch (e) {} setTimeout(() => { const el = document.getElementById('expcode'); if (el) el.select(); }, 50); break; }
    case 'import': XFER = 'import'; render(); break;
    case 'doimport': {
      const raw = (document.getElementById('impcode')?.value || '').trim().replace(/^VL1:/, '');
      try { const obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); if (!obj || typeof obj.atoms !== 'object') throw 0; S = Object.assign(blank(), obj); S.updated = Date.now(); save(); XFER = null; VIEW = 'home'; render(); toast('Progressi importati ✓'); }
      catch (e) { toast('Codice non valido'); }
      break; }
    case 'askreset': SHEET = { reset: true }; renderSheet(); break;
    case 'doreset': S = blank(); SHEET = null; save(); VIEW = 'home'; render(); toast('Progressi azzerati'); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'exam' && e.target.value) {
    const [y, m, dd] = e.target.value.split('-').map(Number);
    S.exam = dayNum(new Date(y, m - 1, dd, 12)); save(); toast('Data dell\'esame salvata');
  }
});
function afterRender() {
  if (VIEW !== 'session' || !SES) return;
  const step = SES.steps[SES.i];
  if (step.k === 'q' && SES.qstate?.phase === 'ask' && (step.mode === 'sfida' || step.mode === 'boss') && !SES.qstate.timerOn) { SES.qstate.timerOn = true; startTimer(); }
  const card = document.getElementById('qcard');
  if (card && SES.qstate?.phase === 'ask') {
    let x0 = null, dx = 0;
    card.addEventListener('pointerdown', ev => { if (ev.target.closest('button')) return; x0 = ev.clientX; dx = 0; });
    card.addEventListener('pointermove', ev => { if (x0 === null) return; dx = ev.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; card.style.boxShadow = dx > 40 ? '0 0 0 3px var(--green)' : dx < -40 ? '0 0 0 3px var(--red)' : ''; });
    const end = () => { if (x0 === null) return; x0 = null; if (Math.abs(dx) > 90) answer(dx > 0); else { card.style.transform = ''; card.style.boxShadow = ''; } };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end); card.addEventListener('pointerleave', end);
  }
}
window.addEventListener('keydown', e => {
  if (VIEW !== 'session' || !SES?.qstate) return;
  if (SES.qstate.phase === 'ask') { if (e.key === 'ArrowRight' || e.key === 'v') answer(true); if (e.key === 'ArrowLeft' || e.key === 'f') answer(false); }
});

render();
initDb();
initSample();
if (typeof IS_PWA !== 'undefined' && IS_PWA) {
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}

</script>
</body>
</html>
