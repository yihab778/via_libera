const AR_DATA = {"c|u1-strada":["الطريق (strada)","هو كل المكان العام الذي نتحرك فيه: سيارات ومشاة ودراجات وحيوانات. ويشمل أيضًا الأرصفة (marciapiedi) وأكتاف الطريق (banchine) ومسارات الدراجات.","مكان للاستخدام العام مخصص للمشاة والمركبات والحيوانات","يشمل الأرصفة وأكتاف الطريق ومسارات الدراجات","يمكن أن يحتوي على نهر طريق (carreggiata) واحد أو أكثر","الطريق = الوعاء الأكبر. كل شيء آخر بداخله.","كلمة «الطريق» (strada) و«نهر الطريق» (carreggiata) ليستا بنفس المعنى. الامتحان يلعب على هذا الفرق.","شارع في المدينة: الرصيف الذي تمشي عليه جزء من الطريق، لكنه ليس جزءًا من نهر الطريق."],"q|u1-strada|0":["الطريق هو المكان المخصص للاستخدام العام لسير المشاة والمركبات والحيوانات.","هذا هو تعريف قانون المرور: مشاة ومركبات وحيوانات."],"q|u1-strada|1":["الطريق يشمل أيضًا الأرصفة (marciapiedi) وأكتاف الطريق (banchine).","الأرصفة وأكتاف الطريق ومسارات الدراجات جزء من الطريق (لكن ليست جزءًا من نهر الطريق)."],"q|u1-strada|2":["الطريق مخصص حصريًا (esclusivamente) لسير المركبات.","هو أيضًا للمشاة والحيوانات. كلمة «حصريًا» هي الفخ."],"q|u1-strada|3":["الطريق مخصص حصريًا للمركبات ذات المحرك.","هو للمشاة والمركبات والحيوانات."],"c|u1-carreggiata":["نهر الطريق (carreggiata)","هو جزء الطريق الذي تسير عليه المركبات. أي «الأسفلت المخصص للسيارات».","جزء من الطريق مخصص للمركبات","يشمل الحارات (corsie) وممرات عبور المشاة والدراجات","لا يشمل الأرصفة ولا أكتاف الطريق ولا مسارات الدراجات","يمكن أن يكون باتجاه واحد أو باتجاهين","CARREggiata ← للعربات (CARRI) أي المركبات.","خطوط عبور المشاة جزء من نهر الطريق (لأنها مرسومة على أسفلت المركبات). أما الرصيف فلا.","الطريق الذي في وسطه فاصل (spartitraffico) له نهران للطريق، واحد لكل اتجاه."],"q|u1-carreggiata|0":["نهر الطريق (carreggiata) هو جزء الطريق المخصص لسير المركبات.","هذا هو التعريف الصحيح."],"q|u1-carreggiata|1":["نهر الطريق يشمل الأرصفة.","الرصيف خارج نهر الطريق (وهو للمشاة)."],"q|u1-carreggiata|2":["يمكن أن يكون نهر الطريق باتجاهين للسير.","نعم: باتجاه واحد أو باتجاهين."],"q|u1-carreggiata|3":["نهر الطريق يشمل أكتاف الطريق (banchine).","كتف الطريق يقع بعد خط الحافة: أي خارج نهر الطريق."],"q|u1-carreggiata|4":["يمكن أن يكون للطريق أكثر من نهر طريق يفصل بينها فاصل (spartitraffico).","هذا شائع في الطرق السريعة والطرق الرئيسية خارج المدن."],"c|u1-corsia":["الحارة (corsia)","هي «شريحة» من نهر الطريق، عرضها يكفي لصف واحد فقط من المركبات، ومحددة بخطوط.","جزء من نهر الطريق","لصف واحد فقط من المركبات","محددة بخطوط متصلة أو متقطعة","الحارة لا تكون أبدًا باتجاهين","حارة واحدة = صف واحد = اتجاه واحد.","إذا قال السؤال «حارة باتجاهين» فهو خطأ. نهر الطريق يمكن أن يكون باتجاهين، أما الحارة فلا.","في الطريق السريع ترى 3 حارات لكل اتجاه: أي 3 صفوف من السيارات جنبًا إلى جنب."],"q|u1-corsia|0":["الحارة (corsia) جزء من نهر الطريق يسمح بمرور صف واحد فقط من المركبات.","هذا هو التعريف الصحيح."],"q|u1-corsia|1":["يمكن أن تكون الحارة باتجاهين للسير.","الحارة لها دائمًا اتجاه واحد. نهر الطريق هو الذي يمكن أن يكون باتجاهين."],"q|u1-corsia|2":["الحارة محددة بخطوط طولية.","خطوط متصلة أو متقطعة."],"q|u1-corsia|3":["يمكن أن يسير في الحارة صفان من المركبات جنبًا إلى جنب.","حارة واحدة = صف واحد فقط."],"c|u1-matrioska":["الطريق ⊃ نهر الطريق ⊃ الحارة","الطريق (strada)","كل المكان العام","مشاة ومركبات وحيوانات","مع الأرصفة وأكتاف الطريق","نهر الطريق (carreggiata)","الجزء المخصص للمركبات فقط","يحتوي على الحارات","بدون الأرصفة وأكتاف الطريق","مثل الدمية الروسية (matrioska): الطريق يحتوي نهر الطريق، ونهر الطريق يحتوي الحارات.","الدمية الروسية: الطريق (كبير) ← نهر الطريق (متوسط) ← الحارة (صغيرة).","الامتحان كثيرًا ما يبدّل المصطلحات: اقرأ بانتباه أي كلمة يستخدم."],"q|u1-matrioska|0":["الحارة جزء من نهر الطريق.","نهر الطريق مقسّم إلى حارات."],"q|u1-matrioska|1":["نهر الطريق جزء من الطريق.","الطريق يحتوي نهر الطريق."],"q|u1-matrioska|2":["الطريق جزء من نهر الطريق.","العكس هو الصحيح: نهر الطريق جزء من الطريق."],"c|u1-accdec":["حارة التسارع مقابل حارة التباطؤ","التسارع (accelerazione)","للدخول","تزيد سرعتك قبل الاندماج في الطريق","في الطرق السريعة والطرق الرئيسية خارج المدن","التباطؤ (decelerazione)","للخروج","تخفف سرعتك دون أن تزعج من يبقى في الطريق","مثال: مدخل محطة الخدمة","في الحارتين: ممنوع الانتظار وممنوع التجاوز.","ACCelerazione = ACCedere (الدخول). DEcelerazione = DEviare (الخروج).","لا توجد عند أماكن التوقف الجانبية (piazzole di sosta)."],"q|u1-accdec|0":["حارة التسارع تُستخدم للدخول إلى الطريق السريع بعد الوصول إلى سرعة مناسبة.","تُستخدم للدخول بالسرعة المناسبة."],"q|u1-accdec|1":["حارة التباطؤ تُستخدم للخروج من نهر الطريق مع تخفيف السرعة.","تخفف سرعتك فيها، لا في حارة السير."],"q|u1-accdec|2":["يُسمح بالانتظار (sosta) في حارة التسارع.","لا انتظار ولا تجاوز."],"q|u1-accdec|3":["حارة التباطؤ تُستخدم للدخول إلى الطريق السريع.","للدخول نستخدم حارة التسارع."],"q|u1-accdec|4":["يُسمح بالتجاوز (sorpasso) في حارة التباطؤ.","لا تجاوز ولا انتظار."],"c|u1-margini":["الرصيف وكتف الطريق","هما جزآن من الطريق خارج نهر الطريق. الرصيف (marciapiede) للمشاة. كتف الطريق (banchina) هو الشريط الواقع بعد الخط الأبيض المتصل على حافة الطريق.","الرصيف: خارج نهر الطريق، للمشاة","كتف الطريق: بعد الخط الأبيض على الحافة","كلاهما جزء من الطريق، لا من نهر الطريق","بعد الخط الأبيض على الحافة = خارج نهر الطريق.","على الرصيف يُسمح بالانتظار فقط حيث توجد خطوط مخصصة للركن.","في طريق ريفي بلا رصيف، الشريط الترابي أو الأسفلتي بعد الخط الأبيض هو كتف الطريق."],"q|u1-margini|0":["كتف الطريق (banchina) جزء من نهر الطريق.","هو خارج نهر الطريق، بعد خط الحافة."],"q|u1-margini|1":["كتف الطريق جزء من الطريق.","نعم، الطريق يشمل أيضًا أكتاف الطريق."],"q|u1-margini|2":["الرصيف هو جزء الطريق المخصص عادةً للمشاة.","صحيح."],"q|u1-margini|3":["الرصيف جزء من نهر الطريق.","الرصيف خارج نهر الطريق."],"c|u1-intersezioni":["تقاطع على نفس المستوى مقابل تقاطع بمستويات مختلفة","على نفس المستوى (a raso)","طرق على نفس المستوى","المركبات تتقاطع فعلًا","تنظمه إشارة ضوئية أو قواعد الأولوية","بمستويات مختلفة (a livelli sfalsati)","طرق على ارتفاعات مختلفة","منحدرات وجسور علوية وأنفاق","المركبات لا تتقاطع أبدًا","على نفس المستوى = تلتقي المركبات. بمستويات مختلفة = طريق يمر فوق الآخر.","Raso = مستوٍ مع الأرض. Sfalsati = مستويات مختلفة.","الطرق السريعة والطرق الرئيسية خارج المدن فيها فقط تقاطعات بمستويات مختلفة."],"q|u1-intersezioni|0":["التقاطع على نفس المستوى (a raso) هو تقاطع بين طرق تقع على نفس المستوى.","نفس المستوى = a raso."],"q|u1-intersezioni|1":["في التقاطعات بمستويات مختلفة تتقاطع المركبات على نفس المستوى.","الطرق على ارتفاعات مختلفة وتربطها منحدرات."],"q|u1-intersezioni|2":["التقاطعات بمستويات مختلفة تمنع تقاطع حركة المرور بشكل مباشر.","هذا هو الغرض منها."],"q|u1-intersezioni|3":["في الطرق السريعة توجد تقاطعات على نفس المستوى تنظمها إشارات ضوئية.","في الطريق السريع توجد فقط تقاطعات بمستويات مختلفة."],"c|u1-larghezza":["عرض الحارة","عرض الحارة تقريبًا بقدر ما يكفي لصف واحد من السيارات.","من 2.75 م إلى 3.75 م (حسب المصدر)","حوالي 3 أمتار: طول سيارة صغيرة موضوعة بالعرض.","تفصيل ثانوي: يكفي أن تتذكر أنها لصف واحد."],"q|u1-larghezza|0":["عرض الحارة عادةً بين 2.75 و3.75 متر.","هذه هي القيم المذكورة في الدرس."],"c|u2-autostrada":["الطريق السريع (autostrada)","أسرع طريق وأكثرها حماية: نهرا طريق منفصلان، مسيّج، بلا تقاطعات على نفس المستوى، والدخول من بوابة الرسوم (casello).","نهرا طريق مستقلان يفصل بينهما فاصل","حارتان للسير على الأقل + حارة طوارئ (corsia di emergenza) لكل نهر طريق","مسيّج، بلا مداخل خاصة ولا تقاطعات على نفس المستوى","لافتات الإرشاد خضراء","الحد الأقصى للسرعة 130 كم/س","A = Autostrada = سرعة عالية = 130، أخضر مثل إشارة الطريق المفتوح.","ممنوع: الدوران للخلف (inversione di marcia)، وسحب المركبات المعطلة (إلا مركبات الإنقاذ)، وطلب التوصيل أو إعطاؤه. الدراجات النارية الصغيرة (ciclomotori) والدراجات والآلات الزراعية لا يُسمح لها بالدخول.","الطريق A4 فينيسيا-ميلانو: بوابة رسوم، لافتات خضراء، فاصل في الوسط، حارة طوارئ على اليمين."],"q|u2-autostrada|0":["في الطريق السريع لافتات الإرشاد لونها أخضر.","أخضر = طريق سريع. أزرق = طرق خارج المدن."],"q|u2-autostrada|1":["يمكن أن يحتوي الطريق السريع على تقاطعات على نفس المستوى.","فقط تقاطعات بمستويات مختلفة."],"q|u2-autostrada|2":["في الطريق السريع كل نهر طريق فيه حارتان للسير على الأقل.","بالإضافة إلى حارة الطوارئ."],"q|u2-autostrada|3":["في الطريق السريع يُسمح بالدوران للخلف (inversione di marcia).","غير مسموح أبدًا."],"q|u2-autostrada|4":["يُسمح للدراجات النارية الصغيرة (ciclomotori) بالسير في الطريق السريع.","ممنوعة، مثل الدراجات والآلات الزراعية."],"q|u2-autostrada|5":["الطريق السريع مسيّج وبلا مداخل خاصة.","صحيح."],"q|u2-autostrada|6":["في الطريق السريع يُسمح بطلب التوصيل (أوتوستوب).","ممنوع طلب التوصيل أو إعطاؤه."],"c|u2-extraurbana":["الطريق الرئيسي خارج المدن (strada extraurbana principale)","هو «شبه طريق سريع»: نهرا طريق منفصلان، حارتان على الأقل لكل اتجاه، بلا تقاطعات على نفس المستوى. لكن اللافتات زرقاء والحد الأقصى أقل.","نهرا طريق مستقلان أو يفصل بينهما فاصل","حارتان على الأقل لكل اتجاه","تقاطعات بمستويات مختلفة فقط","حارات تسارع وتباطؤ","لافتات الإرشاد زرقاء","الحد الأقصى للسرعة 110 كم/س","أزرق و110: درجة واحدة تحت الطريق السريع.","الدراجات والدراجات النارية الصغيرة لا يُسمح لها بالسير فيه.","كثير من «الطرق السريعة المجانية» (superstrade) أو الطرق الدائرية خارج المدن."],"q|u2-extraurbana|0":["في الطرق الرئيسية خارج المدن الحد الأقصى للسرعة 110 كم/س.","110 كم/س (و130 للطريق السريع)."],"q|u2-extraurbana|1":["الطرق الرئيسية خارج المدن لافتات الإرشاد فيها خضراء.","زرقاء. الأخضر للطريق السريع."],"q|u2-extraurbana|2":["الطرق الرئيسية خارج المدن فيها حارتان على الأقل لكل اتجاه.","صحيح."],"q|u2-extraurbana|3":["يُسمح للدراجات بالسير في الطرق الرئيسية خارج المدن.","ممنوعة، مثل الدراجات النارية الصغيرة."],"q|u2-extraurbana|4":["يمكن أن تحتوي الطرق الرئيسية خارج المدن على تقاطعات على نفس المستوى.","فقط بمستويات مختلفة، مثل الطرق السريعة."],"c|u2-autovsextra":["الطريق السريع مقابل الطريق الرئيسي خارج المدن","الطريق السريع","لافتات خضراء","أقصى سرعة 130 كم/س","مسيّج، بوابة رسوم","حارة طوارئ","الطريق الرئيسي خارج المدن","لافتات زرقاء","أقصى سرعة 110 كم/س","لا توجد بوابة رسوم إلزامية","حارتان على الأقل لكل اتجاه","متشابهان في الشكل: الفرق الأساسي هو اللون والحد الأقصى للسرعة.","أخضر 130 · أزرق 110.","كلاهما: بلا تقاطعات على نفس المستوى، وبلا دراجات نارية صغيرة."],"q|u2-autovsextra|0":["في الطريق السريع الحد الأقصى 130 كم/س، وفي الطرق الرئيسية خارج المدن 110 كم/س.","هذه هي الحدود العامة."],"q|u2-autovsextra|1":["لا توجد تقاطعات على نفس المستوى لا في الطريق السريع ولا في الطرق الرئيسية خارج المدن.","كلاهما فيه فقط تقاطعات بمستويات مختلفة."],"q|u2-autovsextra|2":["في الطرق الرئيسية خارج المدن الحد الأقصى 130 كم/س.","110 كم/س. و130 للطريق السريع."],"q|u2-autovsextra|3":["لافتات الإرشاد في الطريق السريع زرقاء.","خضراء."],"c|u2-attraversamento":["معبر المشاة (attraversamento pedonale)","«خطوط المشاة»: خطوط بيضاء متوازية على نهر الطريق، وللمشاة فيها أولوية المرور.","جزء من نهر الطريق","خطوط بيضاء موازية لاتجاه السير","للمشاة أولوية المرور (precedenza)","ممنوع التوقف والانتظار على الخطوط","على خطوط المشاة، الماشي هو صاحب الكلمة.","ممنوع الانتظار (sosta) وممنوع التوقف القصير (fermata) فوق الخطوط.","يضع أحد المشاة قدمه على الخطوط: يجب أن تتوقف وتتركه يعبر."],"q|u2-attraversamento|0":["معبر المشاة جزء من نهر الطريق.","لأنه مرسوم على الأسفلت المخصص للمركبات."],"q|u2-attraversamento|1":["في معابر المشاة للمشاة أولوية المرور على المركبات.","صحيح."],"q|u2-attraversamento|2":["يُسمح بالتوقف القصير (fermata) على معابر المشاة.","ممنوع الانتظار وممنوع التوقف القصير."],"q|u2-attraversamento|3":["يُسمح بالانتظار على خطوط المشاة ليلًا.","الانتظار والتوقف ممنوعان دائمًا."],"c|u2-isola":["جزيرة المرور وجزيرة الأمان","جزيرة المرور (isola di traffico) تفصل حركة السيارات وتوجّهها. جزيرة الأمان (salvagente) جزيرة تحمي المشاة عند مواقف الأتوبيس والترام.","جزيرة المرور: مرتفعة أو مرسومة بخطوط بيضاء مائلة","الجزيرة: ممنوع المرور عليها وممنوع الانتظار","جزيرة الأمان: تحمي المشاة عند موقف المواصلات العامة","جزيرة الأمان: أحيانًا بأعمدة صغيرة ذات ضوء أصفر","SALVAgente = تنقذ الماشي الذي ينتظر الترام.","حتى الجزيرة المرسومة فقط بخطوط لا يجوز المرور عليها.","في وسط الشارع، بجانب موقف الترام، يوجد رصيف مرتفع: هذه جزيرة الأمان."],"q|u2-isola|0":["يُسمح بالانتظار على جزيرة المرور.","هي خارج حركة المرور: لا انتظار ولا مرور."],"q|u2-isola|1":["جزيرة المرور تُستخدم لفصل حركة المرور وتوجيهها.","هذه وظيفتها."],"q|u2-isola|2":["جزيرة الأمان (salvagente) تحمي المشاة عند مواقف المواصلات العامة.","صحيح."],"q|u2-isola|3":["يمكن المرور على جزيرة المرور المرسومة بخطوط إذا كان الطريق خاليًا.","هي خارج حركة المرور."],"c|u2-zone":["منطقة المشاة مقابل منطقة المرور المحدود (ZTL)","منطقة المشاة (area pedonale)","للمشاة فقط","مسموح: مركبات الإسعاف في الطوارئ، الدراجات، مركبات ذوي الإعاقة","غيرها فقط إذا ذُكر ذلك في لوحة إضافية","ZTL","منطقة مرور محدود","تدخلها فقط المركبات المصرح لها","غالبًا في ساعات معينة","منطقة المشاة = تقريبًا بلا مركبات. ZTL = بعض المركبات نعم وبعضها لا.","ZTL: «محدود» وليس «ممنوع».","منطقة ZTL لا تمنع المشاة. وفي منطقة المشاة يُسمح بالدراجات."],"q|u2-zone|0":["في منطقة المرور المحدود (ZTL) الدخول مقصور على مركبات معينة أو أوقات معينة.","هذا هو تعريف ZTL."],"q|u2-zone|1":["في منطقة المشاة يُسمح بمركبات الإسعاف أثناء الطوارئ.","نعم، مع تشغيل أجهزة الطوارئ."],"q|u2-zone|2":["في منطقة المشاة يمكن لكل المركبات السير بسرعة منخفضة.","هي مخصصة للمشاة؛ مسموح فقط للإسعاف والدراجات ومركبات ذوي الإعاقة (أو غيرها إذا ذكرته لوحة)."],"q|u2-zone|3":["منطقة ZTL ممنوعة على المشاة.","المشاة غير مقيّدين."],"c|u2-passocarrabile":["مدخل مركبات (passo carrabile)","هو مدخل منطقة خاصة تُركن فيها المركبات (مثل جراج). عليه لافتة فيها الجهة المانحة ورقم التصريح.","أمام مدخل المركبات: الانتظار (sosta) ممنوع","التوقف القصير (fermata) مسموح","أن تتوقف لحظة نعم (لا تسد الطريق طويلًا)، أن تركن لا.","فخ شائع: «ممنوع التوقف القصير أمام مدخل المركبات» ← خطأ.","تنزل لحظة لتُركب صديقًا أمام جراج: هذا توقف قصير، مسموح."],"q|u2-passocarrabile|0":["أمام مدخل المركبات (passo carrabile) الانتظار ممنوع.","لأنك ستسد خروج الجراج."],"q|u2-passocarrabile|1":["أمام مدخل المركبات التوقف القصير (fermata) ممنوع.","التوقف القصير مسموح، الممنوع فقط هو الانتظار."],"c|u2-pl":["المزلقان (passaggio a livello)","هو المكان الذي يعبر فيه الطريق قضبان القطار على نفس المستوى.","تقاطع على نفس المستوى بين الطريق والسكة الحديد","قد يكون له حواجز كاملة أو نصف حواجز","أضواء حمراء، جرس، لوحات المسافة، صليب سانت أندريا","«a livello» = على نفس المستوى، مثل التقاطع a raso.","ستجده مرة أخرى في إشارات الخطر: بحواجز وبدون حواجز.","تنزل الحواجز ويرن الجرس: القطار قادم."],"q|u2-pl|0":["المزلقان عبور على نفس المستوى بين الطريق والسكة الحديد.","صحيح."],"q|u2-pl|1":["المزلقان تقاطع بمستويات مختلفة.","هو على نفس المستوى."],"q|u2-pl|2":["المزلقان له دائمًا حواجز.","توجد أيضًا مزلقانات بدون حواجز. كلمة «دائمًا» هي الفخ."],"c|u2-quattrocorsie":["نهر طريق باتجاهين وأربع حارات","نهر طريق واحد فيه حارتان لكل اتجاه. تسير في الحارة اليمنى، واليسرى (الداخلية) تُستخدم عادةً للتجاوز.","الحارات الخارجية (اليمين): للسير العادي","الحارات الداخلية: عادةً للتجاوز","الخطوط المتصلة في الوسط: لا تُعبر أبدًا","ممنوع الدوران للخلف (لأنك ستعبر الخط المتصل)","اليمين للسير، اليسار للتجاوز، الوسط أبدًا.","مع حارتين لكل اتجاه يُسمح بالتجاوز حتى في المنحنى أو على المرتفع (dosso): لأنك لا تدخل الاتجاه الآخر.","طريق دائري بأربع حارات بلا فاصل: تبقى يمينًا، تتجاوز من اليسار، ولا تلمس الخط المزدوج في الوسط."],"q|u2-quattrocorsie|0":["في نهر طريق باتجاهين بأربع حارات، الحارات اليمنى للسير العادي.","الداخلية تُستخدم عادةً للتجاوز."],"q|u2-quattrocorsie|1":["في نهر طريق باتجاهين بأربع حارات يُسمح بالدوران للخلف بعبور الخط المتصل في الوسط.","الخط المتصل لا يُعبر أبدًا."],"c|u2-ciclabile":["طريق حضري للدراجات (strada urbana ciclabile)","شارع في المدينة مصمم أساسًا للدراجات، ويمكن للسيارات أيضًا المرور فيه ببطء.","الحد الأقصى للسرعة 30 كم/س","الأولوية للدراجات","عليه إشارات عمودية وخطوط أرضية","دراجات = 30.","السيارات غير ممنوعة، لكن يجب أن تلتزم بالحد وبأولوية الدراجات."],"q|u2-ciclabile|0":["في الطريق الحضري للدراجات لا يجوز أن تتجاوز السرعة 30 كم/س.","الحد الأقصى 30 كم/س."],"q|u2-ciclabile|1":["في الطريق الحضري للدراجات يُمنع مرور السيارات.","يمكنها المرور مع الالتزام بالحد وبأولوية الدراجات."],"c|u10-forme":["خريطة الأشكال","قبل أن تقرأ الرسم، انظر إلى الشكل: فهو يخبرك بنوع الإشارة. إشارات التعليمات (prescrizione) «تأمر»: وهي إشارات المنع والإلزام والأولوية.","مثلث رأسه للأعلى وإطاره أحمر = خطر (تنبيه)","دائرة بإطار أحمر = منع (divieto)","دائرة زرقاء = إلزام (obbligo)","مثلث رأسه للأسفل = أعطِ الأولوية (dare precedenza)","مثمن أحمر = قف (STOP)","معين أصفر = حق الأولوية (diritto di precedenza)","أبيض/رمادي مشطوب بالأسود = نهاية تعليمات","أحمر حولها = «لا». أزرق ممتلئ = «يجب». مثلث = «انتبه». مشطوب = «انتهى».","إشارتا منع الانتظار ومنع التوقف دائرتان بإطار أحمر لكن خلفيتهما زرقاء: ومع ذلك تبقيان إشارتي منع.","ترى من بعيد دائرة زرقاء: قبل أن تقرأها تعرف أنها تلزمك بفعل شيء."],"q|u10-forme|0":["إشارات الإلزام دائرية الشكل بخلفية زرقاء.","دائرة زرقاء = إلزام."],"q|u10-forme|1":["إشارات المنع مثلثة الشكل.","المثلثة هي إشارات الخطر. إشارات المنع دائرية بإطار أحمر."],"q|u10-forme|2":["الإشارة ذات الشكل المثمن هي إشارة قف (STOP).","هي الوحيدة المثمنة."],"q|u10-forme|3":["إشارات نهاية التعليمات بيضاء (أو رمادية) مشطوبة بخطوط سوداء.","مثل نهاية حد السرعة، ونهاية منع التجاوز، و«الطريق مفتوح» (via libera)."],"q|u10-forme|4":["إشارات التعليمات تشمل إشارات الخطر.","التعليمات هي المنع والإلزام والأولوية. إشارات الخطر عائلة منفصلة."],"q|u10-forme|5":["إشارات التعليمات تشمل المنع والإلزام والأولوية.","هي الإشارات التي تعطي أوامر."],"c|u10-limiti":["الحد الأقصى مقابل الحد الأدنى للسرعة","الحد الأقصى","دائرة بيضاء بإطار أحمر","منع: لا تتجاوز هذه القيمة","الحد الأدنى","دائرة زرقاء","إلزام: لا تسِر أبطأ من هذه القيمة","نفس الرقم ومعنى معاكس: اللون يحدد هل هو سقف (أحمر) أم أرضية (أزرق).","أحمر = «لا أكثر من». أزرق = «لا أقل من».","مع الحد الأدنى، المركبات التي لا تستطيع الوصول إلى تلك السرعة لا يُسمح لها بالمرور."],"q|u10-limiti|0":["الإشارة المرسومة تفرض عدم تجاوز 50 كم/س.","دائرة بإطار أحمر = حد أقصى."],"q|u10-limiti|1":["الإشارة المرسومة تفرض عدم تجاوز 30 كم/س.","هي زرقاء: حد أدنى. يجب ألا تسير أقل من 30."],"q|u10-limiti|2":["الإشارة المرسومة تلزم بالحفاظ على سرعة لا تقل عن 30 كم/س.","حد أدنى للسرعة."],"q|u10-limiti|3":["الإشارة المرسومة إشارة إلزام.","الإطار الأحمر يجعلها إشارة منع (حد أقصى)."],"c|u11-regole":["كيف تعمل إشارات المنع","إشارات المنع عادةً دوائر بإطار أحمر. وتسري من المكان الذي وُضعت فيه.","الشكل: دائرة بإطار أحمر","تسري 24 ساعة، حتى ليلًا، إلا إذا وُجدت لوحة بمواعيد","يمكن للوحة إضافية أن تحدد صلاحيتها (ساعات، أيام، فئات)","أحمر = لا تفعل.","استثناء مهم: منع الانتظار داخل المدينة يسري عادةً من 8 إلى 20 فقط (ستراه قريبًا).","منع التجاوز الساعة 3 ليلًا والطريق فارغ: يسري أيضًا."],"q|u11-regole|0":["إشارات المنع تسري أيضًا في ساعات الليل.","تسري 24 ساعة، إلا إذا ذُكر غير ذلك."],"q|u11-regole|1":["إشارات المنع تسري نهارًا فقط.","تسري دائمًا، إلا إذا وُجدت لوحات إضافية بمواعيد."],"q|u11-regole|2":["يمكن للوحة إضافية أن تحدد سريان المنع في ساعات معينة.","مثل «8-20» أو «أيام العمل»."],"c|u11-transito":["منع المرور مقابل الاتجاه الممنوع","منع المرور (divieto di transito)","دائرة بيضاء فارغة بإطار أحمر","طريق مغلق أمام كل المركبات","في الاتجاهين","المشاة يمكنهم المرور","الاتجاه الممنوع (senso vietato)","دائرة حمراء بخط أبيض","لا يجوز الدخول من هذا الجانب","طريق باتجاه واحد: يُسلك من الجهة الأخرى","يسري على كل المركبات، حتى الدراجات","منع المرور: لا تمر أي مركبة من أي جهة. الاتجاه الممنوع: يمكن المرور، لكن فقط في الاتجاه الآخر.","دائرة فارغة = طريق فارغ (مغلق). الخط الأبيض = «حاجز» عند مدخل الطريق ذي الاتجاه الواحد.","منع المرور يسري على الدراجات أيضًا (لأنها مركبات)، لكن لا يسري على المشاة."],"q|u11-transito|0":["الإشارة المرسومة تمنع مرور كل المركبات في اتجاهي السير.","منع المرور."],"q|u11-transito|1":["الإشارة المرسومة تمنع مرور المشاة أيضًا.","المشاة يمكنهم المرور."],"q|u11-transito|2":["الإشارة المرسومة تمنع الدخول إلى طريق يُسلك فقط في الاتجاه المعاكس.","اتجاه ممنوع: هو مخرج طريق باتجاه واحد."],"q|u11-transito|3":["الإشارة المرسومة تمنع المرور في الاتجاهين.","تلك إشارة منع المرور (دائرة فارغة). هذه إشارة الاتجاه الممنوع."],"q|u11-transito|4":["الاتجاه الممنوع يسري أيضًا على الدراجات.","يسري على كل المركبات."],"q|u11-transito|5":["منع المرور يسمح بمرور الدراجات.","الدراجات مركبات: لا يُسمح لها بالمرور."],"c|u11-sorpasso":["منع التجاوز (divieto di sorpasso)","يمنع تجاوز المركبات ذات المحرك.","الرسم: سيارة حمراء على اليسار (التي تريد التجاوز) وسيارة سوداء","يمكن تجاوز المركبات بدون محرك (مثل الدراجات) مع البقاء في نصفك من نهر الطريق","ينتهي بإشارة «نهاية منع التجاوز» أو «الطريق مفتوح» (via libera)","السيارة الحمراء «معاقبة»: لا يمكنها تجاوز السوداء.","لا تخلطها مع منع التجاوز للشاحنات (هناك السيارة الحمراء شاحنة)."],"q|u11-sorpasso|0":["الإشارة المرسومة تمنع تجاوز المركبات ذات المحرك.","منع التجاوز."],"q|u11-sorpasso|1":["عند الإشارة المرسومة يُسمح بتجاوز دراجة دون الدخول في النصف الآخر من نهر الطريق.","المركبات بدون محرك يمكن تجاوزها."],"q|u11-sorpasso|2":["الإشارة المرسومة تمنع التجاوز على الشاحنات فقط.","تسري على الجميع. إشارة الشاحنات فيها شاحنة حمراء."],"q|u11-sorpasso|3":["الإشارة المرسومة تدل على نهاية منع التجاوز.","إشارة النهاية بيضاء/رمادية مشطوبة بالأسود."],"c|u11-sorpassocamion":["منع التجاوز للجميع مقابل للشاحنات فقط","للجميع","سيارة حمراء + سيارة سوداء","لا يجوز لأي مركبة بمحرك أن تتجاوز مركبات بمحرك","للشاحنات فوق 3.5 طن","شاحنة حمراء + سيارة سوداء","ممنوع فقط على مركبات البضائع فوق 3.5 طن","سيارات الركاب والأتوبيسات والكرفانات يمكنها التجاوز","انظر إلى المركبة الحمراء: هي الممنوعة من التجاوز.","المركبة الحمراء هي «المعاقبة».","الأتوبيس، حتى لو كان ثقيلًا، ينقل أشخاصًا: منع الشاحنات لا يشمله."],"q|u11-sorpassocamion|0":["الإشارة المرسومة تمنع التجاوز على الشاحنات التي يزيد وزنها بالحمولة الكاملة عن 3.5 طن.","الشاحنة الحمراء تبين الممنوع."],"q|u11-sorpassocamion|1":["الإشارة المرسومة تمنع التجاوز على سيارات الركاب.","تسري فقط على مركبات البضائع فوق 3.5 طن."],"q|u11-sorpassocamion|2":["الإشارة المرسومة تمنع التجاوز أيضًا على الأتوبيسات.","الأتوبيسات تنقل أشخاصًا: لا تشملها."],"c|u11-fine":["نهاية الحد مقابل نهاية منع التجاوز","نهاية حد السرعة","الرقم «50» يصبح رماديًا ومشطوبًا","يعود الحد العام لهذا الطريق","نهاية منع التجاوز","السيارات تصبح رمادية ومشطوبة","يمكن التجاوز من جديد (بحذر)","رمادي + خطوط سوداء = هذا المنع انتهى. الرسم يخبرك أي منع.","مشطوب = ملغى.","نهاية الحد لا تعني «سرعة حرة»: تعود إلى الحد العام (مثل 50 في المدينة و90 خارجها)."],"q|u11-fine|0":["الإشارة المرسومة تدل على نهاية الحد الأقصى للسرعة 50 كم/س.","رقم رمادي مشطوب."],"q|u11-fine|1":["بعد إشارة نهاية حد السرعة لا توجد حدود للسرعة.","يعود الحد العام لهذا الطريق."],"q|u11-fine|2":["الإشارة المرسومة تدل على نهاية منع التجاوز.","سيارات رمادية مشطوبة."],"c|u11-limite":["الحد الأقصى للسرعة","يمنع تجاوز السرعة المبيّنة (كم/س).","يسري ابتداءً من الإشارة","يسري على كل المركبات","ينتهي بإشارة نهاية الحد (أو «الطريق مفتوح»)","الرقم سقف، وليس هدفًا.","هو الحد الأقصى المسموح، وليس السرعة التي يجب أن تسير بها: إذا أمطرت أو وُجد ضباب يجب أن تسير أبطأ."],"q|u11-limite|0":["الإشارة المرسومة تمنع تجاوز سرعة 50 كم/س.","حد أقصى."],"q|u11-limite|1":["الإشارة المرسومة تلزم بالسير بسرعة 50 كم/س بالضبط.","هي حد أقصى: يمكنك (وأحيانًا يجب) أن تسير أبطأ."],"q|u11-limite|2":["الإشارة المرسومة تسمح بتجاوز 50 كم/س من أجل التجاوز.","الحد يسري دائمًا، حتى أثناء التجاوز."],"c|u11-clacson":["منع التنبيهات الصوتية (الكلاكس)","يمنع استخدام الكلاكس.","مسموح فقط في حالة خطر مباشر","الزحام ليس خطرًا مباشرًا","بوق مشطوب = هدوء، إلا في الطوارئ.","استثناء شائع في الامتحان: في حالة الخطر المباشر يمكن استخدام الكلاكس."],"q|u11-clacson|0":["الإشارة المرسومة تمنع استخدام الكلاكس، إلا في حالة خطر مباشر.","هذا هو الاستثناء الوحيد."],"q|u11-clacson|1":["عند الإشارة المرسومة يمكن استخدام الكلاكس في حالة الزحام.","الزحام ليس خطرًا مباشرًا."],"q|u11-clacson|2":["الإشارة المرسومة تمنع دائمًا استخدام الكلاكس، حتى في حالة خطر مباشر.","في حالة الخطر المباشر مسموح. كلمة «دائمًا» هي الفخ."],"c|u11-pedoni":["منع مرور المشاة مقابل ممر المشاة","منع مرور المشاة","إطار أحمر: منع","المشاة لا يمكنهم المرور","المركبات نعم","ممر المشاة (percorso pedonale)","كله أزرق: إلزام","ممر مخصص للمشاة","المركبات لا","نفس الرجل الصغير وتأثير معاكس: أحمر = المشاة ممنوعون، أزرق = المشاة فقط.","الأحمر يطرد، والأزرق يخصص.","ولا واحدة منهما معبر مشاة (ذلك مثلث أو مربع أزرق عليه خطوط)."],"q|u11-pedoni|0":["الإشارة المرسومة تمنع مرور المشاة.","إطار أحمر = منع."],"q|u11-pedoni|1":["الإشارة المرسومة تمنع مرور سيارات الركاب.","تمنع المشاة فقط؛ المركبات يمكنها المرور."],"q|u11-pedoni|2":["الإشارة المرسومة تدل على ممر مخصص للمشاة.","دائرة زرقاء = إلزام / مخصص."],"q|u11-pedoni|3":["الإشارة المرسومة تدل على معبر مشاة.","هي ممر مشاة، وليست خطوط العبور."],"c|u11-distanza70":["مسافة دنيا إلزامية بين المركبات","دائرة بإطار أحمر فيها مركبتان و«70 م»: تمنع الاقتراب أكثر من 70 مترًا من المركبة التي أمامك.","المسافة الدنيا المبيّنة (مثل 70 م)","يجب احترامها حتى لو كنت تسير ببطء","توجد غالبًا قبل الأنفاق أو الجسور."],"q|u11-distanza70|0":["إشارة المسافة الدنيا الإلزامية يجب احترامها حتى عند السرعة المنخفضة.","المسافة المبيّنة تسري دائمًا."],"q|u11-distanza70|1":["إشارة المسافة الدنيا تبيّن المسافة حتى التقاطع التالي.","تبيّن المسافة الدنيا عن المركبة التي أمامك."],"c|u12-categorie":["الرسم = من لا يمر","كثير من إشارات منع المرور فيها مركبة مرسومة: المنع يسري فقط على هذه الفئة. كل الآخرين يمرون.","دراجة مرسومة ← ممنوع على الدراجات (الدراجات النارية الصغيرة ciclomotori تمر)","دراجة نارية مرسومة ← ممنوع على الدراجات النارية motocicli (الـ ciclomotori فئة أخرى)","أتوبيس ← ممنوع على الأتوبيسات","شاحنة مع «3.5 t» ← ممنوع على مركبات البضائع فوق 3.5 طن (الأتوبيسات والكرفانات تمر)","جرار ← ممنوع على الآلات الزراعية","اسأل نفسك: «هل مركبتي هي بالضبط المرسومة؟» إذا لا، تمر.","الـ ciclomotore ليس motociclo، وليس دراجة عادية. هذا أكثر فخ شائع.","لافتة فيها دراجة نارية: بسكوترك 50 (ciclomotore) يمكنك المرور."],"q|u12-categorie|0":["إشارة منع مرور الدراجات النارية (motocicli) تسري أيضًا على الدراجات النارية الصغيرة (ciclomotori).","الـ motocicli والـ ciclomotori فئتان مختلفتان."],"q|u12-categorie|1":["الإشارة المرسومة تمنع مرور الدراجات النارية.","دراجة نارية في الدائرة الحمراء."],"q|u12-categorie|2":["الإشارة المرسومة تمنع مرور الدراجات.","دراجة في الدائرة الحمراء."],"q|u12-categorie|3":["الإشارة المرسومة تمنع أيضًا مرور الدراجات النارية الصغيرة (ciclomotori).","تسري فقط على الدراجات."],"q|u12-categorie|4":["الإشارة المرسومة تمنع أيضًا مرور الأتوبيسات.","تسري على مركبات البضائع فوق 3.5 طن. الأتوبيسات تنقل أشخاصًا."],"q|u12-categorie|5":["الإشارة المرسومة تمنع مرور مركبات نقل البضائع التي يزيد وزنها بالحمولة الكاملة عن 3.5 طن.","صحيح."],"q|u12-categorie|6":["الإشارة المرسومة تمنع مرور سيارات الركاب.","سيارة في الدائرة الحمراء: ممنوع على المركبات الآلية."],"c|u12-merci":["منع مرور البضائع الخطرة","يمنع مرور المركبات التي تنقل بضائع خطرة.","يتعلق بالحمولة المنقولة (صهاريج، مواد سامة أو أكّالة...)","لا يتعلق بالوقود الموجود في خزان المركبة","توجد إشارات مشابهة للمتفجرات/المواد القابلة للاشتعال وللمواد التي قد تلوث الماء","تتحدث عن الحمولة، لا عن الخزان.","منع المواد الملوثة للماء لا ينبه إلى وجود ماء على الطريق: بل يمنع مرور من ينقل هذه المواد."],"q|u12-merci|0":["الإشارة المرسومة تمنع مرور المركبات التي تنقل بضائع خطرة.","لوحة برتقالية في دائرة حمراء."],"q|u12-merci|1":["الإشارة المرسومة تمنع مرور سيارات الركاب التي خزانها مليء بالبنزين.","وقود الخزان لا يُحسب."],"q|u12-merci|2":["منع مرور المركبات التي تنقل مواد ملوثة للماء ينبه إلى وجود ماء على نهر الطريق.","هو منع لمن ينقل هذه المواد."],"c|u12-rimorchio":["منع مرور من يسحب مقطورة","يمنع مرور المركبات ذات المحرك التي تسحب مقطورة (مثل سيارة مع كرفان، أو قاطرة ومقطورة).","يسري على من يسحب مقطورة، بما في ذلك الكرفان","حسب الدرس لا يشمل العربة الصغيرة الملحقة (carrello-appendice) ولا الأتوبيس المفصلي","سيارة مع كرفان: يجب أن تغيّر طريقها."],"q|u12-rimorchio|0":["منع مرور المركبات التي تسحب مقطورة يسري أيضًا على سيارة ركاب تسحب كرفانًا.","الكرفان مقطورة."],"q|u12-rimorchio|1":["منع مرور المركبات التي تسحب مقطورة يسري على سيارة ركاب بدون مقطورة.","يسري فقط إذا كانت تسحب مقطورة."],"c|u13-misure":["منع حسب المقاسات والوزن","الرقم في الدائرة الحمراء هو الحد الأقصى المسموح: إذا تجاوزته مركبتك (مع الحمولة)، لا تمر.","العرض (مثل 2.30 م) — قبل التضيّقات","الارتفاع (مثل 3.50 م، مع الحمولة) — الجسور والأنفاق","الطول (مثل 10 م، مع المقطورة إن وُجدت)","الوزن (مثل 7 طن، الوزن الفعلي) — غالبًا قبل الجسور","الوزن لكل محور (مثل 2.5 طن لكل محور)","الأسهم تخبرك بالمقاس: ↔ عرض، ↕ ارتفاع.","العبرة بالمقاس الحقيقي في تلك اللحظة، مع الحمولة. من يساوي القيمة أو أقل يمر.","فان ارتفاعه 3.6 م مع الحمولة واللافتة 3.5 م: يجب أن تغيّر طريقك."],"q|u13-misure|0":["الإشارة المرسومة تمنع مرور المركبات التي يزيد عرضها عن 2.30 م.","أسهم أفقية = عرض."],"q|u13-misure|1":["الإشارة المرسومة تمنع مرور المركبات التي يزيد ارتفاعها عن 3.50 م، مع الحمولة.","أسهم عمودية = ارتفاع."],"q|u13-misure|2":["الإشارة المرسومة تبيّن عرض نهر الطريق.","هي منع: تمنع المركبات الأعرض من 2.30 م."],"q|u13-misure|3":["الإشارة المرسومة تمنع مرور المركبات (أو مجموعات المركبات) التي يزيد طولها عن 10 م.","الطول."],"q|u13-misure|4":["الإشارة المرسومة تمنع مرور المركبات التي يزيد وزنها الفعلي عن 7 طن.","حد الوزن."],"q|u13-misure|5":["الإشارة المرسومة تبيّن المسافة الدنيا عن المركبة التي أمامك.","هي حد للارتفاع."],"c|u13-vialibera":["الطريق مفتوح (via libera)","نهاية كل إشارات المنع السابقة (مثل منع التجاوز وحدود السرعة).","بيضاء بخطوط سوداء مائلة، بلا رسم","من هنا تعود القواعد العامة","أكثر إشارات النهاية «فراغًا» = تلغي كل شيء.","لا تعني «طريق خالٍ من العوائق» ولا «أولوية»: تعني أن المنع السابق انتهى."],"q|u13-vialibera|0":["الإشارة المرسومة تدل على نهاية كل إشارات المنع السابقة.","الطريق مفتوح (via libera)."],"q|u13-vialibera|1":["الإشارة المرسومة تدل على أن لك حق الأولوية.","تدل فقط على نهاية المنع."],"q|u13-vialibera|2":["الإشارة المرسومة تدل على نهاية حد السرعة فقط.","كل إشارات المنع، لا هذا فقط."],"c|u13-sostafermata":["منع الانتظار مقابل منع التوقف","منع الانتظار (divieto di sosta)","خط أحمر مائل واحد","الانتظار ممنوع، التوقف القصير مسموح","في المدينة: عادةً من 8 إلى 20","خارج المدينة: 24 ساعة","منع التوقف (divieto di fermata)","خطان أحمران على شكل X","ممنوع التوقف القصير والانتظار","24 ساعة","يسري أيضًا على التاكسي والأتوبيس (خارج مواقفها)","خط واحد = لا انتظار. خطان = لا شيء إطلاقًا.","خط واحد، منع واحد. خطان، منعان (انتظار + توقف).","التوقف بسبب الزحام أو الإشارة الحمراء ليس «توقفًا» ممنوعًا: هو ضرورة. المواعيد العادية تتغير إذا وُجدت لوحة."],"q|u13-sostafermata|0":["الإشارة المرسومة تمنع الانتظار لكن تسمح بالتوقف القصير.","خط واحد = منع الانتظار."],"q|u13-sostafermata|1":["الإشارة المرسومة تمنع أيضًا التوقف القصير.","خط واحد: الانتظار فقط ممنوع."],"q|u13-sostafermata|2":["الإشارة المرسومة تمنع التوقف القصير والانتظار معًا.","خطان على شكل X = منع التوقف."],"q|u13-sostafermata|3":["داخل المدن، منع الانتظار بدون لوحات يسري عادةً من 8 إلى 20.","خارج المدن يسري 24 ساعة."],"q|u13-sostafermata|4":["خارج المدن، منع الانتظار بدون لوحات يسري فقط من 8 إلى 20.","خارج المدن يسري 24 ساعة."],"q|u13-sostafermata|5":["عند الإشارة المرسومة يمكن التوقف لإركاب شخص.","منع التوقف: لا يجوز التوقف ولو للحظة."],"c|u13-passocarrabile":["إشارة مدخل المركبات (passo carrabile)","لافتة مستطيلة عليها رمز منع الانتظار، توضع على مدخل منطقة خاصة.","تمنع الانتظار أمام المدخل","التوقف القصير مسموح إذا لم تعرقل من يدخل أو يخرج","لكي تكون صالحة يجب أن تذكر الجهة التي أصدرت التصريح والرقم","بدون الجهة والرقم هي مجرد لافتة عادية.","هي مستطيلة لكنها مع ذلك إشارة منع."],"q|u13-passocarrabile|0":["إشارة مدخل المركبات يجب أن تذكر الجهة المالكة للطريق ورقم التصريح.","وإلا فهي غير صالحة."],"q|u13-passocarrabile|1":["إشارة مدخل المركبات تمنع التوقف القصير.","تمنع الانتظار؛ التوقف القصير مسموح إذا لم يعرقل."],"c|u13-parcheggio":["موقف السيارات (parcheggio)","منطقة منظمة لانتظار المركبات.","حرف P أبيض على خلفية زرقاء","قد تبيّن لوحات إضافية المواعيد أو الرسوم أو الفئات المسموحة أو الممنوعة","توجد أيضًا إشارة للانتظار المخصص لمركبات ذوي الإعاقة (بالتصريح)","المكان المخصص لذوي الإعاقة للمركبات التي معها تصريح فقط."],"q|u13-parcheggio|0":["الإشارة المرسومة تدل على منطقة مخصصة لركن المركبات.","موقف سيارات."],"q|u13-parcheggio|1":["الإشارة المرسومة تدل على مركز شرطة.","هي موقف سيارات."],"c|u14-direzioni":["اتجاهات إلزامية ومسموحة","دوائر زرقاء بأسهم بيضاء: يمكنك الذهاب فقط حيث تشير الأسهم. كل ما عدا ذلك ممنوع.","سهم واحد = اتجاه إلزامي (مستقيم، يمينًا أو يسارًا)","سهمان = يمكنك الاختيار بينهما","ما لم يُذكر ممنوع","الأسهم الزرقاء هي الأبواب الوحيدة المفتوحة.","«اتجاه إلزامي إلى اليمين» يمنع السير مستقيمًا ويمنع الانعطاف يسارًا. توجد أيضًا إشارة تنبيه مسبق للاتجاه الإلزامي، مع المسافة.","سهمان «مستقيم ويمين»: لا يمكنك الانعطاف يسارًا."],"q|u14-direzioni|0":["الإشارة المرسومة تلزم بالسير مستقيمًا.","سهم واحد إلى الأعلى."],"q|u14-direzioni|1":["الإشارة المرسومة تسمح بالانعطاف يمينًا.","تلزم بالسير مستقيمًا فقط."],"q|u14-direzioni|2":["الإشارة المرسومة تلزم بالانعطاف يمينًا.","اتجاه إلزامي إلى اليمين."],"q|u14-direzioni|3":["الإشارة المرسومة تسمح بالسير مستقيمًا.","تلزم بالانعطاف يسارًا."],"q|u14-direzioni|4":["الإشارة المرسومة تسمح بالسير مستقيمًا أو الانعطاف يمينًا.","سهمان: خياران."],"q|u14-direzioni|5":["الإشارة المرسومة تسمح بالانعطاف يسارًا.","الأسهم تشير فقط إلى الأمام واليمين."],"q|u14-direzioni|6":["الإشارة المرسومة تمنع السير مستقيمًا.","يمينًا أو يسارًا فقط."],"c|u14-passaggio":["اتجاه إلزامي مقابل مرور إلزامي","اتجاه إلزامي إلى اليمين","سهم ينعطف","يتعلق بالانعطاف عند التقاطع","مرور إلزامي من اليمين","سهم مائل إلى الأسفل","موضوع على العائق (جزيرة، فاصل، موقع أعمال)","يجب أن تلتف حول العائق مارًا من يمينه","سهم ينعطف = انعطاف. سهم مائل للأسفل = التف حول العائق.","المرور الإلزامي «يشير» إلى الجانب الذي يجب أن تمر منه، مثل إصبع نحو الأسفل.","توجد أيضًا «مرور مسموح من الجانبين»: سهمان مائلان، يمكنك المرور يمين العائق أو يساره."],"q|u14-passaggio|0":["الإشارة المرسومة تلزم بالمرور من يمين العائق.","سهم مائل نحو اليمين."],"q|u14-passaggio|1":["الإشارة المرسومة تلزم بالانعطاف يمينًا عند التقاطع التالي.","هي مرور إلزامي: الالتفاف حول العائق من اليمين."],"q|u14-passaggio|2":["الإشارة المرسومة تلزم بالمرور من يسار العائق.","سهم مائل نحو اليسار."],"q|u14-passaggio|3":["الإشارة المرسومة تسمح بالمرور من يمين العائق أو يساره.","مرور مسموح من الجانبين."],"q|u14-passaggio|4":["الإشارة المرسومة تمنع المرور من يسار العائق.","يمكن المرور من الجانبين."],"c|u14-rotatoria":["الدوّار: إلزام مقابل خطر","تنبيه مسبق (خطر)","مثلث","دوّار قادم (حوالي 150 م)","دوّار (إلزام)","دائرة زرقاء","أنت عند المدخل: دُر في اتجاه الأسهم","مثلث = قادم. دائرة زرقاء = أنت هنا، ملزم بالدوران.","نفس القاعدة دائمًا: المثلث ينبّه، والأزرق يُلزم.","حتى للذهاب يسارًا تدور حول المركز."],"q|u14-rotatoria|0":["الإشارة المرسومة تلزم بالسير في الاتجاه الذي تبينه الأسهم.","دوّار (إلزام)."],"q|u14-rotatoria|1":["الإشارة المرسومة إشارة خطر.","هي دائرية زرقاء: إلزام."],"c|u15-ciclabile":["الدراجات: مسار دراجات مقابل منع مقابل معبر","مسار دراجات (pista ciclabile)","دائرة زرقاء","مخصص للدراجات فقط","ممنوع على الدراجات النارية الصغيرة والدراجات النارية والسيارات والمشاة","منع الدراجات","دائرة بإطار أحمر","الدراجات لا يمكنها المرور","نفس الدراجة، ثلاث عائلات: أزرق = مخصص، أحمر = ممنوع، مثلث = معبر قادم.","الأزرق «يدعو»، الأحمر «يطرد»، المثلث «ينبّه».","يوجد أيضًا: مسار دراجات بجانب الرصيف (مساحات منفصلة) وممر مشترك للمشاة والدراجات (مساحة مشتركة). ولكل ممر إشارة نهاية."],"q|u15-ciclabile|0":["الإشارة المرسومة تدل على مسار مخصص للدراجات.","دائرة زرقاء فيها دراجة."],"q|u15-ciclabile|1":["يمكن للدراجات النارية الصغيرة (ciclomotori) السير في مسار الدراجات.","مخصص حصريًا للدراجات."],"q|u15-ciclabile|2":["الإشارة المرسومة تنبه إلى معبر دراجات.","هي إلزام (مسار دراجات). المعبر مثلث."],"q|u15-ciclabile|3":["الإشارة المرسومة تدل على ممر مشترك للمشاة وراكبي الدراجات.","ماشٍ في الأعلى ودراجة في الأسفل: ممر مشاة ودراجات."],"c|u15-catene":["سلاسل الثلج إلزامية","يُسمح بالسير فقط مع سلاسل مركبة أو إطارات شتوية.","يسري على كل المركبات التي تسلك هذا المقطع","بدون سلاسل أو إطارات شتوية لا تكمل","عجلة عليها «أحزمة» = سلاسل.","لا تعني أن الثلج يتساقط الآن: تعني إلزامًا بتجهيز المركبة."],"q|u15-catene|0":["الإشارة المرسومة تلزم بالسير بسلاسل ثلج أو إطارات شتوية.","سلاسل إلزامية."],"q|u15-catene|1":["الإشارة المرسومة تدل على ورشة لتركيب السلاسل.","هي إلزام بتجهيز المركبة."],"c|u15-alt":["قف (ALT): جمارك، شرطة، محطة","إشارات «ALT» تلزم بالتوقف.","ALT-DOGANA: التوقف عند الحدود للتفتيش الجمركي","ALT-POLIZIA: نقطة تفتيش، التوقف إلزامي","ALT-STAZIONE: التوقف عند بوابة رسوم الطريق السريع (casello) لدفع الرسوم","«Stazione» هنا تعني محطة الطريق السريع (بوابة الرسوم)، لا محطة القطار.","فخ: ALT-STAZIONE لا علاقة لها بالقطارات ولا بالمزلقانات.","عند مدخل الطريق السريع، قبل حواجز بوابة الرسوم."],"q|u15-alt|0":["إشارة ALT-STAZIONE تلزم بالتوقف عند بوابة رسوم الطريق السريع.","لدفع الرسوم."],"q|u15-alt|1":["إشارة ALT-STAZIONE تنبه إلى محطة قطار.","هي محطة الطريق السريع (بوابة الرسوم)."],"q|u15-alt|2":["إشارة ALT-POLIZIA تدل على نقطة تفتيش يجب التوقف عندها.","صحيح."],"c|u15-quadrupedi":["ممر لحيوانات الحمل والركوب","دائرة زرقاء فيها فارس: ممر مخصص للخيول وحيوانات الحمل أو الركوب.","مخصص لحيوانات الحمل والركوب","ممنوع على المشاة والمركبات"],"q|u15-quadrupedi|0":["الممر المخصص لحيوانات الحمل والركوب ممنوع على الدراجات.","هو مخصص للحيوانات."],"c|u16-darestop":["أعطِ الأولوية مقابل قف (STOP)","أعطِ الأولوية (dare precedenza)","مثلث رأسه للأسفل","تعطي الأولوية لليمين ولليسار","تتوقف فقط إذا جاء أحد","قف (STOP)","مثمن أحمر","تتوقف دائمًا عند خط التوقف","ثم تعطي الأولوية لليمين ولليسار","أعطِ الأولوية = «خفف وتوقف إذا لزم». STOP = «توقف على أي حال».","STOP = العجلات تتوقف تمامًا، حتى لو كان الطريق فارغًا.","في الحالتين: الأولوية لليمين ولليسار، وليس لليمين فقط. إشارة STOP توجد أيضًا عند بعض المزلقانات."],"q|u16-darestop|0":["الإشارة المرسومة تلزم بإعطاء الأولوية للمركبات القادمة من اليمين ومن اليسار.","أعطِ الأولوية."],"q|u16-darestop|1":["الإشارة المرسومة تلزم بالتوقف دائمًا، حتى لو لم يأتِ أحد.","تتوقف فقط إذا لزم. التوقف دائمًا هو إشارة STOP."],"q|u16-darestop|2":["الإشارة المرسومة تلزم بإعطاء الأولوية للمركبات القادمة من اليمين فقط.","لليمين ولليسار."],"q|u16-darestop|3":["الإشارة المرسومة تلزم بالتوقف عند خط التوقف وإعطاء الأولوية.","قف (STOP)."],"q|u16-darestop|4":["عند الإشارة المرسومة يمكن عدم التوقف إذا كان الطريق خاليًا.","مع STOP نتوقف دائمًا."],"q|u16-darestop|5":["الإشارة المرسومة إشارة خطر.","هي إشارة أولوية (أعطِ الأولوية)."],"c|u16-preavvisi":["تنبيه مسبق لـ«أعطِ الأولوية» ولـ«قف»","قبل إشارة أعطِ الأولوية أو STOP قد توجد إشارة تنبيه مسبق مع المسافة (مثل 150 م).","تنبيه أعطِ الأولوية: مثلث مقلوب مع المسافة","تنبيه STOP: مثلث مقلوب مكتوب فيه STOP مع المسافة","تساعد على التخفيف في الوقت المناسب","نفس المثلث، لكن مع رقم: «ستأتي بعد X متر».","تنبيه STOP لا يلزمك بالتوقف عنده: ينبهك أن STOP أمامك."],"q|u16-preavvisi|0":["الإشارة المرسومة تنبه مسبقًا إلى إشارة قف وأعطِ الأولوية (STOP).","كلمة STOP + المسافة."],"q|u16-preavvisi|1":["الإشارة المرسومة تنبه مسبقًا إلى إشارة أعطِ الأولوية على بعد حوالي 150 م.","مثلث مقلوب مع المسافة."],"q|u16-preavvisi|2":["عند الإشارة المرسومة يجب التوقف.","هي تنبيه مسبق: التوقف يكون أمامك عند STOP."],"c|u16-incroci":["تقاطع: الأولوية لليمين مقابل حق الأولوية","تقاطع بأولوية اليمين","مثلث فيه X","تسري القاعدة العامة: الأولوية لمن يأتي من اليمين","عادةً على بعد 150 م من التقاطع","تقاطع بحق الأولوية لك","مثلث فيه طريق عمودي عريض","أنت صاحب الأولوية","الطرق الجانبية (الرفيعة) يجب أن تعطيك الأولوية","X = طرق متساوية، تسري قاعدة اليمين. خط عريض = طريقك هو الأهم.","الطريق المرسوم عريضًا هو طريقك: إذا كان عريضًا، أنت صاحب الكلمة.","حتى مع حق الأولوية، سِر بحذر: تأكد أن الآخرين يعطونك الأولوية فعلًا."],"q|u16-incroci|0":["الإشارة المرسومة تنبه إلى تقاطع تسري فيه قاعدة الأولوية لليمين.","X = تقاطع بأولوية اليمين."],"q|u16-incroci|1":["الإشارة المرسومة تدل على أن لك الأولوية عند التقاطع.","X تعني الأولوية لليمين: يجب أن تعطيها لمن يأتي من اليمين."],"q|u16-incroci|2":["الإشارة المرسومة تنبه إلى تقاطع لك فيه حق الأولوية.","طريق عريض = طريقك له الأولوية."],"q|u16-incroci|3":["الإشارة المرسومة تلزم بإعطاء الأولوية للمركبات القادمة من اليمين.","لك حق الأولوية."],"q|u16-incroci|4":["الإشارة المرسومة تدل على أن لك الأولوية على المركبات القادمة من الطريق الجانبي على اليمين.","تقاطع على شكل T بحق الأولوية: الطريق الجانبي على اليمين."],"q|u16-incroci|5":["الإشارة المرسومة تنبه إلى طريق جانبي على اليمين.","الطريق الجانبي على اليسار."],"q|u16-incroci|6":["الإشارة المرسومة تدل على أن لك الأولوية على المركبات التي تندمج من اليمين.","اندماج: من يدخل من اليمين يجب أن يعطي الأولوية."],"c|u16-dirprec":["حق الأولوية ونهايته","حق الأولوية (diritto di precedenza)","معين أصفر بإطار أبيض","بداية طريق له الأولوية","يتكرر (وأحيانًا أصغر) عند التقاطعات","نهاية حق الأولوية","نفس المعين، مشطوب بالأسود","من هنا لم تعد لك الأولوية","تعود قاعدة اليمين (إلا إذا وُجدت إشارات أخرى)","معين نظيف = الطريق لك. معين مشطوب = لم يعد.","المعين الأصفر هو «تاج» الطريق الرئيسي.","حتى على الطريق الذي له حق الأولوية يجب أن تفسح الطريق لمركبات الطوارئ ذات الضوء الأزرق والسرينة."],"q|u16-dirprec|0":["الإشارة المرسومة تدل على بداية طريق له حق الأولوية.","معين أصفر."],"q|u16-dirprec|1":["الإشارة المرسومة إشارة خطر.","هي إشارة أولوية."],"q|u16-dirprec|2":["الإشارة المرسومة تدل على نهاية حق الأولوية.","معين مشطوب."],"q|u16-dirprec|3":["على الطريق الذي له حق الأولوية لا يجب أبدًا إفساح الطريق لأحد.","لمركبات الطوارئ ذات السرينة نفسح الطريق دائمًا. كلمة «أبدًا» هي الفخ."],"c|u16-sensounico":["طريق باتجاه واحد متناوب: تعطي الأولوية أم تأخذها","أعطِ الأولوية في الاتجاه الواحد المتناوب","شكل دائري بإطار أحمر (مثل إشارة المنع)","يجب أن تترك من يأتي من الأمام يمر","حق الأولوية في الاتجاه الواحد المتناوب","شكل مستطيل أزرق","تمر أنت أولًا، بحذر","تُستخدم في التضيّقات التي يمر فيها صف واحد فقط. الأحمر الدائري = تنتظر. الأزرق = تمر.","إطار أحمر = يوقفك. أزرق = الطريق مفتوح لك.","إذا وُجدت إشارة ضوئية تعمل فالعبرة بها؛ وإذا وُجد شرطي فالعبرة بالشرطي."],"q|u16-sensounico|0":["في الاتجاه الواحد المتناوب، الإشارة الدائرية ذات الإطار الأحمر تلزم بإعطاء الأولوية للمركبات القادمة من الاتجاه المعاكس.","شكل المنع: أنت تنتظر."],"q|u16-sensounico|1":["في الاتجاه الواحد المتناوب، الإشارة المستطيلة الزرقاء تلزم بإعطاء الأولوية للمركبات التي أمامك.","الأزرق يدل على أنك أنت صاحب الأولوية."],"c|u16-gerarchia":["من يأمر: الشرطي > الإشارة الضوئية > اللافتات","إذا وُجدت تعليمات مختلفة في نفس المكان، فالعبرة بالأعلى في الترتيب.","1. شرطي المرور","2. الإشارة الضوئية العاملة","3. إشارات الطريق","مع الإشارة الضوئية الصفراء الوامضة تسري اللافتات","الإنسان يغلب الآلة، والآلة تغلب اللافتة.","إذا أشار لك الشرطي بالمرور والإشارة حمراء، تمر.","تقاطع فيه STOP وشرطي يشير لك بالمرور: أطِع الشرطي."],"q|u16-gerarchia|0":["تعليمات شرطي المرور لها الأسبقية على الإشارة الضوئية.","الشرطي في أعلى الترتيب."],"q|u16-gerarchia|1":["الإشارة الضوئية العاملة لها الأسبقية على إشارات الأولوية.","الإشارة الضوئية > اللافتات."],"q|u16-gerarchia|2":["إشارة STOP لها الأسبقية على تعليمات شرطي المرور.","الشرطي له الأسبقية على كل شيء."],"q|u16-gerarchia|3":["مع الإشارة الضوئية الصفراء الوامضة يجب احترام إشارات الأولوية.","الإشارة الوامضة لا تنظم المرور: تسري اللافتات."],"c|u17-contdisc":["خط متصل مقابل خط متقطع","متصل (continua)","لا يُعبر أبدًا","لا تجاوز يعبره","لا انعطاف يسارًا ولا دوران للخلف عبره","الخط المتصل المزدوج = نفس المعنى","متقطع (discontinua)","يمكن عبوره","للتجاوز أو الانعطاف أو الدوران للخلف (إذا كان مسموحًا)","ممنوع السير فوقه (بين الحارتين)","متصل = جدار. متقطع = باب.","خط ممتلئ = جدار ممتلئ. خط مقطّع = يمكنك المرور.","مع الخط المتصل يمكنك التجاوز إذا بقيت في نصفك (مثل تجاوز دراجة) دون لمسه. ومع المتقطع لا تسِر فوق الخط."],"q|u17-contdisc|0":["الخط الطولي المتصل لا يجوز عبوره.","لا يُعبر."],"q|u17-contdisc|1":["الخط الطولي المتقطع يمكن عبوره للتجاوز.","هذه وظيفته."],"q|u17-contdisc|2":["يمكن السير فوق الخط المتقطع في منتصف الطريق.","ممنوع: ابقَ في حارتك."],"q|u17-contdisc|3":["الخط المتصل المزدوج يسمح بالانعطاف يسارًا.","مثل المتصل: لا يُعبر."],"q|u17-contdisc|4":["مع الخط المتصل أي تجاوز ممنوع دائمًا.","يمكنك التجاوز إذا لم تعبر الخط (مثل دراجة). كلمة «دائمًا» هي الفخ."],"q|u17-contdisc|5":["الخط المتصل يوجد غالبًا على جزء الصعود من المرتفعات وبالقرب من معابر المشاة.","حيث تكون الرؤية أو السلامة أقل."],"c|u17-mista":["خط مزدوج مختلط (متصل + متقطع)","خطان متجاوران، واحد متصل وواحد متقطع. من يراهما من جهة يمكنه العبور، ومن الجهة الأخرى لا.","العبرة بالخط الأقرب إلى مركبتك","متقطع من جهتك: يمكنك العبور","متصل من جهتك: لا يمكنك","«الخط الذي تلمسه أولًا هو الذي يأمر».","نفس العلامة تقول أشياء مختلفة للاتجاهين.","في الصعود (رؤية قليلة) يكون المتصل قريبًا منك؛ ومن ينزل يكون المتقطع قريبًا منه ويمكنه التجاوز."],"q|u17-mista|0":["مع خط مزدوج متصل ومتقطع يجب احترام الخط الأقرب إلى مركبتك.","هذه هي القاعدة."],"q|u17-mista|1":["إذا كان الخط الأقرب إلى مركبتك متصلًا يمكنك عبوره لأن الآخر متقطع.","العبرة بالأقرب: متصل = لا عبور."],"q|u17-mista|2":["مع الخط المزدوج المختلط، العبرة دائمًا بالخط المتصل للاتجاهين.","العبرة بالخط الأقرب لكل مركبة."],"c|u17-margine":["خطوط الحافة وخط التوقف","الخطوط على الجانبين تحدد نهر الطريق. والخطوط العرضية تقول لك أين تتوقف.","خط الحافة المتصل: يُعبر فقط للضرورة (مثل التوقف الاضطراري)","خط الحافة المتقطع: عند مداخل المركبات وأماكن التوقف الجانبية وحارات التسارع","خط عرضي متصل: خط التوقف (STOP أو الإشارة الحمراء)","خط عرضي متقطع مع مثلثات: خط إعطاء الأولوية (تتوقف فقط إذا لزم)","عرضي متصل = توقف هنا. متقطع مع مثلثات = أعطِ الأولوية هنا.","مع STOP تتوقف دائمًا عند الخط المتصل، حتى لو كان الطريق خاليًا."],"q|u17-margine|0":["الخط العرضي المتصل يبيّن مكان التوقف للإشارة الحمراء أو لإشارة STOP.","هو خط التوقف."],"q|u17-margine|1":["خط الحافة المتصل يمكن عبوره في أي وقت.","فقط للضرورة، مثل التوقف الاضطراري."],"q|u17-margine|2":["الخط العرضي المتقطع مع مثلثات يبيّن مكان إعطاء الأولوية.","يرافق إشارة أعطِ الأولوية."],"q|u17-margine|3":["الخط العرضي المتصل يبيّن مكان إعطاء الأولوية دون توقف.","المتصل هو خط التوقف: يجب التوقف."],"c|u18-preselezione":["حارات الاختيار المسبق (corsie di preselezione)","قبل التقاطعات، أسهم على الأرض تقسم الحارات حسب المكان الذي تريد الذهاب إليه.","ادخل مبكرًا في حارة اتجاهك","بين حارات يفصلها خط متصل لا تغيّر الحارة","إذا أخطأت الحارة: اتبع اتجاه الحارة التي أنت فيها","لا تتوقف فجأة ولا تقطع الطريق لتصلح الخطأ","حارة خاطئة؟ لف لفة، لا تقم بمناورة.","في حارات الاختيار المسبق ممنوع التوقف والانتظار.","أنت في حارة «مستقيم فقط» وكنت تريد اليمين: اذهب مستقيمًا ثم ابحث عن طريق آخر."],"q|u18-preselezione|0":["إذا كنت في حارة الاختيار المسبق الخاطئة يجب أن تكمل في الاتجاه الذي تبينه الحارة.","لكي لا تسبب خطرًا."],"q|u18-preselezione|1":["إذا أخطأت حارة الاختيار المسبق يمكنك تغييرها حتى بعبور الخط المتصل.","الخط المتصل لا يُعبر."],"q|u18-preselezione|2":["الأسهم على الأرض تبيّن الاتجاه الإلزامي لتلك الحارة.","إذا كانت محددة بخطوط متصلة."],"q|u18-preselezione|3":["إذا أخطأت حارة الاختيار المسبق يمكنك التوقف والرجوع للخلف.","تكمل في اتجاه الحارة."],"c|u18-giallo":["العلامات الصفراء: أتوبيس، تاكسي، خط متعرج","اللون الأصفر على الأرض يدل على أماكن مخصصة أو ممنوعة.","خط أصفر متعرج (zig-zag): موقف الأتوبيس: الانتظار ممنوع","كتابات صفراء BUS وTAXI: أماكن مخصصة","خطوط صفراء وسوداء على حافة الرصيف: منع انتظار","خطوط صفراء محددة: أماكن لذوي الإعاقة","أصفر = «ليس لك» (مخصص).","على الخط المتعرج وعلى الحافة الصفراء والسوداء ممنوع الانتظار، وليس التوقف القصير."],"q|u18-giallo|0":["الخط الأصفر المتعرج يدل على موقف الأتوبيس والانتظار فيه ممنوع.","مكان مخصص للمواصلات العامة."],"q|u18-giallo|1":["الخطوط الصفراء والسوداء على حافة الرصيف تدل على منع التوقف.","تدل على منع الانتظار: التوقف القصير مسموح."],"q|u18-giallo|2":["كلمة TAXI على الأرض تدل على مكان مخصص للتاكسي أثناء العمل.","الآخرون لا يجوز لهم الانتظار."],"q|u18-giallo|3":["على الخط الأصفر المتعرج لموقف الأتوبيس يُسمح بالانتظار القصير.","الانتظار ممنوع؛ المسموح فقط التوقف القصير."],"c|u18-stalli":["ألوان أماكن الركن","لون خطوط أماكن الركن يقول من يمكنه الانتظار وكيف.","بيضاء: انتظار حر (مجاني)","زرقاء: انتظار بمقابل","صفراء: مخصصة (مثل ذوي الإعاقة، التحميل والتفريغ، الشرطة)","أزرق مثل عداد الركن: تدفع.","في الأماكن المدفوعة يجب وضع التذكرة بشكل واضح."],"q|u18-stalli|0":["أماكن الركن المحددة بخطوط زرقاء عادةً بمقابل.","أزرق = بمقابل."],"q|u18-stalli|1":["أماكن الركن المحددة بخطوط صفراء متاحة للجميع.","مخصصة لفئات معينة."],"q|u18-stalli|2":["أماكن الركن المحددة بخطوط بيضاء دائمًا بمقابل.","البيضاء عادةً مجانية؛ الزرقاء = بمقابل."],"c|u18-rallentatori":["مخفّضات السرعة البصرية والمطبات الصناعية","خطوط بيضاء عرضية تزداد عرضًا وتقاربًا: تجعلك تشعر بسرعة أكبر وتدعوك للتخفيف.","مخفّض بصري: 4 خطوط بيضاء عرضية على الأقل","مطب صناعي: ارتفاع يجبرك على التخفيف","خطوط تتقارب = خفف."],"q|u18-rallentatori|0":["مخفّضات السرعة البصرية تدعو إلى تقليل السرعة.","هذا غرضها."],"q|u18-rallentatori|1":["الخطوط العرضية لمخفّضات السرعة البصرية تدل على معبر مشاة.","خطوط المشاة موازية لاتجاه السير."],"c|u19-luci":["أحمر، أصفر، أخضر","إشارة المرور للمركبات فيها ثلاثة أضواء. لكل ضوء التزام محدد.","أحمر: توقف قبل خط التوقف","أخضر: يمكنك المرور، لكن فقط إذا كنت تستطيع إخلاء التقاطع قبل الأحمر","مع الأخضر عند الانعطاف: الأولوية للمشاة؛ ولليسار أيضًا للمركبات القادمة من الأمام","أصفر ثابت: توقف، إلا إذا لم تستطع التوقف بأمان (عندها أخلِ التقاطع)","الأخضر ليس «طريقًا مفتوحًا تمامًا»: بل «يمكنك، إذا وُجدت مساحة».","مع الأخضر، إذا كان بعد التقاطع زحام، لا تدخل.","أصفر وأنت على بعد متر من الخط، ولو فرملت قد يصطدم بك من خلفك: أكمل بحذر."],"q|u19-luci|0":["مع الضوء الأخضر يمكن دخول التقاطع فقط إذا كنت متأكدًا من إخلائه قبل الأحمر.","لكي لا تسد الطريق على الآخرين."],"q|u19-luci|1":["مع الضوء الأصفر الثابت يجب دائمًا زيادة السرعة للمرور.","يجب التوقف إذا أمكن ذلك بأمان."],"q|u19-luci|2":["مع الضوء الأحمر يجب التوقف قبل خط التوقف.","صحيح."],"q|u19-luci|3":["مع الأخضر، عند الانعطاف، يجب إعطاء الأولوية للمشاة الذين يعبرون.","قد يكون للمشاة ضوء أخضر في نفس الوقت."],"q|u19-luci|4":["مع الأخضر يمكن المرور حتى لو كان ما بعد التقاطع مسدودًا بالزحام.","لا تدخل التقاطع إذا لم تستطع إخلاءه."],"q|u19-luci|5":["مع الضوء الأحمر يمكن المتابعة إذا لم يأتِ أحد.","مع الأحمر نتوقف دائمًا."],"c|u19-giallo":["أصفر ثابت مقابل أصفر وامض","أصفر ثابت","الأحمر على وشك أن يأتي","توقف إذا أمكن بأمان","إذا كنت داخل التقاطع: أخلِه","أصفر وامض","الإشارة مطفأة أو معطلة","مُرّ بحذر","تسري اللافتات وقاعدة الأولوية لليمين","ثابت = «توقف». وامض = «تصرف بالقواعد العادية».","يومض = الإشارة «لا تعمل»: اللافتات هي التي تأمر.","مع الأصفر الوامض، إذا وُجدت إشارة STOP يجب أن تتوقف."],"q|u19-giallo|0":["الضوء الأصفر الوامض يدل على إشارة لا تعمل: نسير بحذر مع احترام قواعد الأولوية.","صحيح."],"q|u19-giallo|1":["الضوء الأصفر الوامض يلزم بالتوقف دائمًا.","نسير بحذر؛ نتوقف فقط إذا فرضت ذلك الإشارات أو الأولوية."],"q|u19-giallo|2":["الضوء الأصفر الثابت يلزم بالتوقف، إلا إذا كنت قريبًا جدًا بحيث لا يمكنك التوقف بأمان.","صحيح."],"q|u19-giallo|3":["الضوء الأصفر الوامض يدل على أن الأحمر على وشك أن يأتي.","يدل على إشارة لا تعمل؛ الأصفر الثابت هو الذي ينبه إلى الأحمر."],"c|u19-frecce":["إشارات الحارات والحارات القابلة للعكس","بعض الإشارات أضواؤها على شكل أسهم: تسري فقط على ذلك الاتجاه أو الحارة.","سهم أخضر: يمكنك الذهاب في هذا الاتجاه","سهم أحمر: ممنوع الذهاب في هذا الاتجاه","الحارات القابلة للعكس: سهم أخضر = الحارة مسموحة، X حمراء = الحارة ممنوعة","الحارات القابلة للعكس: سهم أصفر وامض = اترك الحارة وانتقل حيث يشير السهم","X حمراء = حارة مغلقة.","سهم أخضر مضاء لا يسمح بالاتجاهات الأخرى."],"q|u19-frecce|0":["في الحارات القابلة للعكس، الـ X الحمراء تمنع دخول تلك الحارة.","صحيح."],"q|u19-frecce|1":["في الحارات القابلة للعكس، السهم الأصفر الوامض يلزم بترك الحارة والانتقال في الاتجاه المبين.","صحيح."],"q|u19-frecce|2":["السهم الأحمر في إشارة الحارة يسمح بالمتابعة بحذر.","يمنع المتابعة في ذلك الاتجاه."],"q|u19-frecce|3":["في الحارات القابلة للعكس، السهم الأخضر يمنع استخدام الحارة.","السهم الأخضر يسمح بها؛ الـ X الحمراء تمنعها."],"c|u19-altri":["إشارات للمشاة والدراجات والترام، والأضواء الوامضة","توجد إشارات مخصصة وأضواء وامضة لها معانٍ محددة.","المشاة: الأصفر = من هو على الخطوط يجب أن يخليها","أضواء حمراء وامضة (مزلقانات، جسور متحركة، معديات): ممنوع المرور","ضوء أصفر وامض منفرد: خطر عام، خفف السرعة","إشارة المواصلات العامة: خطوط بيضاء ومثلث أصفر (تسري فقط على الأتوبيس والترام والتاكسي)","أحمر يومض = لا تمر أبدًا."],"q|u19-altri|0":["الأضواء الحمراء الوامضة عند المزلقان تمنع المرور.","القطار قادم."],"q|u19-altri|1":["يمكن زيادة السرعة لعبور المزلقان قبل أن تنزل نصف الحواجز.","خطير جدًا وممنوع."],"q|u19-altri|2":["الإشارة ذات الخطوط البيضاء تسري على السيارات الخاصة.","تسري على المواصلات العامة."],"c|u20-gesti":["إشارات الشرطي = إشارة مرور بشرية","ذراعان ممدودتان أفقيًا","إذا كنت أمام الشرطي أو خلفه = أحمر","إذا كانت ذراعاه موازيتين لاتجاهك (تراه من الجانب) = أخضر","ذراع مرفوعة عموديًا","= أصفر","توقف إذا أمكنك ذلك بأمان","إذا كنت داخل التقاطع، أخلِه","صدره أو ظهره نحوك = توقف. جنبه نحوك = مُرّ.","إذا رأيت صدره أو ظهره فهو «يوقفك»؛ وإذا رأيته من الجانب فهو «يتركك تمر».","صفارة طويلة تلزم بالتوقف (مثلًا لمرور سيارات الإسعاف)."],"q|u20-gesti|0":["الشرطي بذراعين ممدودتين أفقيًا، وأنت تراه من الأمام، يعادل الإشارة الحمراء.","صدره نحوك = توقف."],"q|u20-gesti|1":["الشرطي بذراعين ممدودتين أفقيًا، وأنت تراه من الجانب، يعادل الإشارة الخضراء.","الحركة الموازية لذراعيه تمر."],"q|u20-gesti|2":["الشرطي بذراع مرفوعة عموديًا يعادل الضوء الأصفر.","تنبيه بتغيير قادم."],"q|u20-gesti|3":["الشرطي الذي تراه من الخلف وذراعاه ممدودتان أفقيًا يسمح لك بالمرور.","من الخلف = مثل الأمام: أحمر."],"q|u20-gesti|4":["صفارة الشرطي الطويلة تلزم بالتوقف.","غالبًا لإفساح الطريق للإسعاف."],"q|u20-gesti|5":["الشرطي بذراع مرفوعة عموديًا يعادل الضوء الأخضر.","يعادل الأصفر."],"c|u20-prevale":["الشرطي يأمر فوق الجميع","تعليمات الشرطة لها الأسبقية على الإشارات الضوئية واللافتات.","الشرطي > الإشارة الضوئية > اللافتات","يُعرف الشرطي من الزي والعصا (paletta)","عند أمر «قف» (ALT) من الشرطي يجب التوقف","الإنسان يغلب الآلة."],"q|u20-prevale|0":["إذا أشار الشرطي بالمرور والإشارة حمراء، يجب إطاعة الشرطي.","الشرطي له الأسبقية."],"q|u20-prevale|1":["إشارات الشرطة لها الأسبقية على الإشارات الضوئية.","صحيح."],"q|u20-prevale|2":["إذا كانت الإشارة خضراء يمكن تجاهل الشرطي الذي يأمر بالتوقف.","الشرطي له الأسبقية دائمًا."],"c|u29-regola":["السرعة المناسبة (ليس الحد فقط)","احترام الحد لا يكفي: يجب أن تكون دائمًا قادرًا على التوقف داخل المسافة التي تراها خالية أمامك.","اضبط السرعة حسب: حالتك، حالة المركبة، الحمولة، الطريق، الزحام، الطقس","يجب أن تستطيع التوقف دائمًا داخل مجال رؤيتك","خفف: التقاطعات، المنعطفات، التضيّقات، المدارس، المشاة، الضباب، الطريق المبلل أو المتجمد، الليل","توقف إذا تردد أحد المشاة أو إذا انبهرت بالأضواء","«أرى 30 مترًا؟ يجب أن أستطيع التوقف في 30 مترًا».","حتى السير ببطء شديد بلا سبب ممنوع: تعرقل حركة المرور.","ضباب والرؤية 40 م: حتى لو كان الحد 90، يجب أن تسير أبطأ بكثير."],"q|u29-regola|0":["يجب على السائق ضبط سرعته بحيث يستطيع التوقف داخل مجال رؤيته.","هذه هي القاعدة الأساسية."],"q|u29-regola|1":["باحترام حد السرعة تكون دائمًا ملتزمًا بالقانون، مهما كانت الظروف.","السرعة يجب أن تناسب الظروف."],"q|u29-regola|2":["السير بسرعة منخفضة جدًا بلا سبب ممنوع.","يعرقل حركة المرور."],"q|u29-regola|3":["عند وجود ضباب يجب تخفيف السرعة.","الرؤية أقل."],"q|u29-regola|4":["السرعة الزائدة في المنعطف قد تسبب انقلاب المركبة.","تزيد القوة الطاردة المركزية."],"q|u29-regola|5":["مع ضباب كثيف يمكن الحفاظ على الحد الأقصى إذا كان الطريق مستقيمًا.","السرعة يجب أن تناسب الرؤية."],"c|u30-limiti":["الحدود العامة للسرعة (سيارات حتى 3.5 طن)","إذا لم توجد لافتات، تسري هذه الحدود القصوى.","داخل المدن: 50 كم/س (حتى 70 مع إشارة خاصة)","الطرق الثانوية خارج المدن: 90 كم/س","الطرق الرئيسية خارج المدن: 110 كم/س","الطرق السريعة: 130 كم/س (حتى 150 مع إشارة خاصة)","50 · 90 · 110 · 130: مدينة، ريف، طريق رئيسي، طريق سريع.","هي حدود قصوى. واللافتة المحلية لها الأسبقية (مثل 70 على مقطع خارج المدينة)."],"q|u30-limiti|0":["داخل المدن الحد العام للسرعة 50 كم/س.","إلا إذا رفعته إشارات حتى 70."],"q|u30-limiti|1":["في الطرق الثانوية خارج المدن الحد العام 110 كم/س.","90 كم/س. و110 للطرق الرئيسية خارج المدن."],"q|u30-limiti|2":["في الطريق السريع يمكن رفع الحد حتى 150 كم/س حيث توجد إشارة خاصة.","على مقاطع ذات مواصفات خاصة."],"q|u30-limiti|3":["في الطرق الرئيسية خارج المدن الحد العام 110 كم/س.","صحيح."],"q|u30-limiti|4":["داخل المدن يمكن رفع الحد حتى 90 كم/س.","حتى 70 كم/س، مع إشارة."],"q|u30-limiti|5":["في الطريق السريع الحد العام لسيارات الركاب 150 كم/س.","هو 130؛ و150 فقط حيث توجد إشارة خاصة."],"c|u30-meteo":["المطر والثلج والضباب","مع سوء الطقس تنخفض حدود الطرق السريعة والطرق الرئيسية خارج المدن تلقائيًا.","عند الهطول (مطر، ثلج): الطرق السريعة 110 كم/س، الطرق الرئيسية خارج المدن 90 كم/س","ضباب والرؤية أقل من 100 م: الحد 50 كم/س","تمطر؟ اطرح 20: 130←110، 110←90.","هي حدود قصوى: غالبًا يجب أن تسير أبطأ من ذلك."],"q|u30-meteo|0":["في الطريق السريع، عند هطول الأمطار أو الثلوج، ينخفض الحد إلى 110 كم/س.","من 130 إلى 110."],"q|u30-meteo|1":["في الطرق الرئيسية خارج المدن، عند المطر، ينخفض الحد إلى 90 كم/س.","من 110 إلى 90."],"q|u30-meteo|2":["مع الضباب والرؤية أقل من 100 م الحد 50 كم/س.","صحيح."],"q|u30-meteo|3":["عند المطر في الطريق السريع يبقى الحد 130 كم/س.","ينخفض إلى 110."],"q|u30-meteo|4":["مع الضباب والرؤية أقل من 100 م الحد في الطريق السريع 90 كم/س.","هو 50 كم/س."],"c|u30-neo":["السائقون الجدد والمركبات الثقيلة","السائقون الجدد (أول 3 سنوات)","الطرق السريعة: 100 كم/س","الطرق الرئيسية خارج المدن: 90 كم/س","الشاحنات فوق 3.5 طن، والسيارات مع مقطورة أو كرفان","الطرق السريعة: 80 كم/س","خارج المدن: 70 كم/س","داخل المدن: 50 كم/س","السائق الجديد: 100/90. الثقيلة والمقطورات: 80/70.","الجديد = «مئة وتسعون». الثقيل = «ثمانون وسبعون».","حدود السائقين الجدد تسري لأول 3 سنوات من الحصول على رخصة B."],"q|u30-neo|0":["في أول ثلاث سنوات من الحصول على رخصة B لا يجوز تجاوز 100 كم/س في الطريق السريع.","حد السائقين الجدد."],"q|u30-neo|1":["يمكن للسائق الجديد السير بسرعة 110 كم/س في الطرق الرئيسية خارج المدن.","الحد الأقصى 90 كم/س."],"q|u30-neo|2":["سيارة الركاب التي تسحب كرفانًا لا يجوز أن تتجاوز 80 كم/س في الطريق السريع.","المركبات مع مقطورة: 80 في الطريق السريع."],"q|u30-neo|3":["حدود السائقين الجدد تسري للسنة الأولى فقط.","تسري لأول 3 سنوات."],"q|u30-neo|4":["يمكن للسائق الجديد السير بسرعة 130 كم/س في الطريق السريع إذا كان خاليًا.","الحد الأقصى 100 كم/س في أول 3 سنوات."],"c|u31-spazi":["رد الفعل + الفرملة = التوقف","عندما ترى خطرًا، تمر أولًا حوالي ثانية واحدة (رد الفعل) ثم الفرملة. المجموع هو مسافة التوقف.","مسافة رد الفعل: من رؤية الخطر حتى بداية الفرملة (زمن رد الفعل حوالي 1 ث)","مسافة الفرملة: من بداية الفرملة حتى التوقف","مسافة التوقف = رد الفعل + الفرملة","مسافة الأمان: على الأقل المسافة المقطوعة خلال زمن رد الفعل","الأمتار في الثانية ≈ السرعة كم/س ÷ 10 × 3 (مثلًا 50 كم/س ≈ 14-15 م).","المسافة الدنيا عن المركبة التي أمامك لا تقل أبدًا عن مسافة رد الفعل.","بسرعة 100 كم/س تقطع في ثانية واحدة حوالي 28 مترًا قبل أن تلمس الفرامل."],"q|u31-spazi|0":["مسافة التوقف هي مجموع مسافة رد الفعل ومسافة الفرملة.","صحيح."],"q|u31-spazi|1":["متوسط زمن رد الفعل حوالي ثانية واحدة.","في الظروف العادية."],"q|u31-spazi|2":["مسافة رد الفعل هي المسافة المقطوعة أثناء الفرملة.","هي المسافة المقطوعة قبل بدء الفرملة."],"q|u31-spazi|3":["مسافة الأمان يجب أن تساوي على الأقل المسافة المقطوعة خلال زمن رد الفعل.","لكي لا تصطدم بمن يفرمل أمامك."],"q|u31-spazi|4":["بسرعة 100 كم/س تُقطع في ثانية واحدة حوالي 28 مترًا.","100 ÷ 3.6 ≈ 28 م/ث."],"q|u31-spazi|5":["زمن رد الفعل حوالي 5 ثوانٍ.","هو حوالي ثانية واحدة."],"q|u31-spazi|6":["مسافة الفرملة تشمل أيضًا مسافة رد الفعل.","مسافة التوقف هي التي تشمل الاثنتين."],"c|u31-quadrato":["السرعة ضعفين = الفرملة أربعة أضعاف","مسافة الفرملة تزيد بمربع السرعة.","السرعة ×2 ← الفرملة ×4","السرعة ×3 ← الفرملة ×9","تزيد الفرملة: الطريق المبلل/المثلج/المنحدر للأسفل، الإطارات البالية، السرعة، الحمولة","تقل: الطريق الصاعد","2←4، 3←9: اضرب الرقم في نفسه.","التعب والكحول والتشتت يطيلون زمن رد الفعل (مسافة رد الفعل)، لا الفرملة نفسها.","إذا توقفت عند 50 كم/س في 15 م، فعند 100 كم/س تحتاج حوالي 60 م."],"q|u31-quadrato|0":["إذا تضاعفت السرعة، تصبح مسافة الفرملة أربعة أضعاف.","تزيد بالمربع."],"q|u31-quadrato|1":["إذا تضاعفت السرعة، تتضاعف مسافة الفرملة.","تصبح أربعة أضعاف."],"q|u31-quadrato|2":["على الطريق المبلل تزيد مسافة الفرملة.","التماسك أقل."],"q|u31-quadrato|3":["في الصعود تزيد مسافة الفرملة.","في الصعود تقل؛ وفي النزول تزيد."],"q|u31-quadrato|4":["الإطارات البالية تزيد مسافة الفرملة.","تماسك أقل."],"q|u31-quadrato|5":["التعب يزيد زمن رد الفعل.","ردود الفعل أبطأ."],"c|u21-colori":["ألوان لافتات الإرشاد","اللافتات التي تعطي معلومات (اتجاهات، أماكن) يتغير لون خلفيتها حسب الطريق.","أخضر: الطرق السريعة","أزرق: الطرق خارج المدن","أبيض: طرق المدينة","أصفر: إشارات مؤقتة (مواقع أعمال)","بني: أماكن سياحية وتاريخية وثقافية","أسود: مناطق صناعية وتجارية","أخضر = طريق سريع، أزرق = خارج المدينة، أبيض = داخل المدينة، بني = آثار ومعالم.","الأصفر لا يدل على نوع طريق: يدل على أن الإشارة مؤقتة.","لافتة زرقاء «Udine 12»: أنت على طريق خارج المدن؛ لو كانت خضراء لكانت تقود إلى الطريق السريع."],"q|u21-colori|0":["لافتات الإرشاد ذات الخلفية الخضراء توجد على الطرق السريعة أو تقود إليها.","أخضر = طريق سريع."],"q|u21-colori|1":["لافتات الإرشاد ذات الخلفية الزرقاء تخص الطرق خارج المدن.","أزرق = خارج المدن."],"q|u21-colori|2":["لافتات الإرشاد ذات الخلفية البيضاء تخص الطرق السريعة.","أبيض = طرق المدينة."],"q|u21-colori|3":["الخلفية البنية تدل على أماكن ذات أهمية سياحية أو ثقافية.","صحيح."],"q|u21-colori|4":["الخلفية الصفراء تدل على الطرق الحكومية (statali).","أصفر = إشارة مؤقتة (مواقع أعمال)."],"q|u21-colori|5":["لافتات الإرشاد ذات الخلفية السوداء تدل على الطرق السريعة.","الأسود يدل على المناطق الصناعية والتجارية."],"c|u21-sensounico":["اتجاه واحد أمامي مقابل جانبي","أمامي (frontale)","تراها أمامك، في بداية الطريق","أنت تدخل طريقًا باتجاه واحد: سِر في اتجاه السهم","جانبي (parallelo)","موضوعة على الجانب، على طول الطريق الذي تقطعه","تقول إن الطريق الجانبي باتجاه واحد في اتجاه السهم","الأمامي = طريقك. الجانبي = الطريق الذي قد تنعطف إليه.","سهم للأعلى = أنت داخل بالفعل.","في طريق باتجاه واحد الدوران للخلف ممنوع."],"q|u21-sensounico|0":["إشارة الاتجاه الواحد الجانبي تدل على أن الطريق الجانبي يُسلك فقط في اتجاه السهم.","صحيح."],"q|u21-sensounico|1":["في طريق باتجاه واحد يُسمح بالدوران للخلف.","ممنوع."],"c|u21-preavvisi":["تنبيهات التقاطع والاختيار المسبق","لافتات تسبق التقاطع وتبين الوجهات، لكي تختار الحارة مبكرًا.","تنبيه التقاطع: يبين الاتجاهات والأماكن","الاختيار المسبق: يبين أي حارة تأخذ لكل وجهة","تعريف الطرق: SS طريق حكومي (أزرق)، SC طريق بلدي (أبيض)، A طريق سريع (أخضر)","التنبيه = «بعد قليل اختر إلى أين تذهب»."],"q|u21-preavvisi|0":["إشارة الاختيار المسبق تبين الحارات التي يجب أخذها حسب الوجهة.","صحيح."],"q|u21-preavvisi|1":["إشارة تنبيه التقاطع تلزم بالانعطاف.","تعطي معلومات عن الاتجاهات، لا تلزم."],"c|u22-centro":["بداية المدينة ونهايتها (centro abitato)","اللافتة التي فيها اسم المكان تحدد أين تبدأ المنطقة السكنية. وإذا كانت مشطوبة بالأحمر فهي النهاية.","بداية المدينة: من هنا تسري قواعد المدينة (مثل الحد 50 كم/س)","نهاية المدينة: الاسم مشطوب بالأحمر","تحت إشارة النهاية قد توجد مسافات الأماكن التالية","الاسم = تدخل المدينة. الاسم مشطوب = تخرج.","ليست مجرد لافتة سياحية: تغيّر الحدود والقواعد (مثل الأضواء والكلاكس والانتظار)."],"q|u22-centro|0":["إشارة بداية المدينة تدل على أنه من هذه النقطة تسري قواعد المدن.","مثل الحد 50 كم/س."],"q|u22-centro|1":["اسم المكان المشطوب بخط أحمر يدل على نهاية المدينة.","صحيح."],"q|u22-centro|2":["إشارة بداية المدينة إشارة خطر.","هي إشارة إرشاد."],"q|u22-centro|3":["إشارة نهاية المدينة تدل على نهاية كل إشارات المنع.","تدل فقط على نهاية المدينة (وقواعدها)."],"c|u22-limitigenerali":["إشارة الحدود العامة والحدود بين الدول","عند الحدود تجد لافتة تلخص حدود السرعة الإيطالية. بين دول الاتحاد الأوروبي لا يلزم التوقف.","الحدود العامة الإيطالية: 50 · 90 · 110 · 130","الحدود مع دول الاتحاد الأوروبي: التوقف للجمارك غير إلزامي","أما ALT-DOGANA فتلزم بالتوقف"],"q|u22-limitigenerali|0":["إشارة الحدود بين دول الاتحاد الأوروبي تلزم بالتوقف للتفتيش الجمركي.","التوقف غير إلزامي."],"q|u22-limitigenerali|1":["إشارة حدود السرعة العامة تبين 130 كم/س للطرق السريعة.","صحيح."],"c|u22-passo":["إمكانية المرور: الممر الجبلي مفتوح أو مغلق","في الطرق الجبلية لافتة تخبرك هل الممر مفتوح أو مغلق أو يحتاج سلاسل.","هي إشارة إرشاد: تعطي معلومة وتوصي","«الممر مغلق» ليست منعًا للمرور: يمكنك المتابعة حتى النقطة المبينة","تعطي معلومة، لا تمنع.","فخ في الامتحان: «الإشارة تمنع المرور» ← خطأ."],"q|u22-passo|0":["إشارة إمكانية المرور مع ممر مغلق تمنع المرور.","هي معلومة: يمكن المتابعة حتى النقطة المبينة."],"q|u22-passo|1":["إشارة إمكانية المرور قد تبين أن السلاسل أو الإطارات الشتوية مطلوبة.","صحيح."],"c|u22-ospedale":["المستشفى والطوارئ","تبين مدخل أو اتجاه المستشفى والطوارئ.","بالقرب من المستشفى: تجنب الضوضاء المزعجة (الكلاكس)"],"q|u22-ospedale|0":["إشارة المستشفى تدعو إلى تجنب الضوضاء المزعجة بالقرب منه.","صحيح."],"c|u23-consigliata":["السرعة الموصى بها مقابل الحد الأقصى","السرعة الموصى بها","مربع/مستطيل أزرق فيه الرقم","هي نصيحة، لا إلزام","يمكن السير أبطأ أو أسرع (ضمن الحدود)","الحد الأقصى","دائرة بإطار أحمر","هي منع: لا يجوز تجاوزها","مربع أزرق = يقترح. دائرة بإطار أحمر = تفرض.","المربع «ينصح»، والدائرة الحمراء «تأمر».","مشطوبة بالأحمر تدل على نهاية السرعة الموصى بها."],"q|u23-consigliata|0":["إشارة السرعة الموصى بها تلزم بعدم تجاوز السرعة المبينة.","هي مجرد نصيحة."],"q|u23-consigliata|1":["إشارة السرعة الموصى بها تبين السرعة التي يُنصح بعدم تجاوزها في ظروف مرور مثالية.","صحيح: هي نصيحة."],"c|u23-senzauscita":["طريق بلا مخرج","الطريق ليس له مخرج للمركبات: للعودة ستحتاج إلى مناورة.","تسري على كل المركبات، بما فيها الدراجات النارية","يمكن الدخول، لكن بعدها تحتاج رجوعًا للخلف أو دورانًا","توجد أيضًا إشارة تنبيه مسبق (مثل: الطريق الجانبي على اليمين بلا مخرج)","طريق مسدود للعجلات."],"q|u23-senzauscita|0":["إشارة الطريق بلا مخرج تسري أيضًا على الدراجات النارية.","على كل المركبات."],"q|u23-senzauscita|1":["إشارة الطريق بلا مخرج تمنع دخول الطريق.","يمكن الدخول: فقط لا يوجد مخرج."],"c|u23-riservata":["طريق مخصص للمركبات ذات المحرك","طريق يُسمح فيه فقط بسير المركبات ذات المحرك المناسبة.","ممنوع على الدراجات والمركبات التي تجرها الحيوانات","مشطوب بالأحمر: نهاية الطريق المخصص"],"q|u23-riservata|0":["في الطريق المخصص للمركبات ذات المحرك ممنوع مرور الدراجات.","ليست مركبات بمحرك."],"q|u23-riservata|1":["في الطريق المخصص للمركبات ذات المحرك يمكن للمركبات التي تجرها الحيوانات السير.","ممنوع."],"q|u23-riservata|2":["الطريق المخصص للمركبات ذات المحرك مفتوح للمشاة.","هو مخصص للمركبات ذات المحرك."],"c|u23-galleria":["نفق، جسر، مكان توقف، طوارئ SOS","إشارات تبين منشآت أو خدمات على طول الطريق.","النفق: الأضواء مشغلة، أطفئ المحرك في حالة توقف طويل، لا انتظار ولا توقف إلا إذا ذُكر","عند الخروج من الأنفاق وعلى الجسور: انتبه للرياح الجانبية","مكان توقف جانبي (خارج المدن): للتوقف القصير، على جانب نهر الطريق","SOS: أعمدة للاتصال بالمساعدة الميكانيكية أو الطبية","الانعطاف يسارًا غير المباشر: للانعطاف يسارًا اتبع المسار المبين (لا تنعطف مباشرة)","نفق = أضواء مشغلة ويدان ثابتتان عند الخروج."],"q|u23-galleria|0":["في النفق، عند توقف طويل بسبب الزحام، يُستحسن إطفاء المحرك.","لكي لا تتجمع غازات العادم."],"q|u23-galleria|1":["إشارة الانعطاف يسارًا غير المباشر تسمح بالانعطاف يسارًا مباشرة عند التقاطع.","يجب اتباع المسار المبين."],"q|u23-galleria|2":["إشارة SOS تدل على وجود جهاز لطلب المساعدة.","أعمدة على طول الطريق السريع."],"q|u23-galleria|3":["في النفق يُسمح بالانتظار على الحافة اليمنى.","التوقف والانتظار ممنوعان في النفق."],"q|u23-galleria|4":["في النفق لا حاجة لتشغيل الأضواء
