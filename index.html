عة والبقاء على بعد 20 م على الأقل."],"c|u28-rimozione":["منطقة السحب وتنظيف الطريق","لوحات تحت إشارة منع الانتظار.","منطقة السحب: قد تُسحب المركبة بالونش أو تُقفل عجلاتها","استثناء: مركبات ذوي الإعاقة (بالتصريح) لا تُسحب ولا تُقفل","التنظيف الآلي: الانتظار ممنوع في الأيام والساعات المبينة","مسار الطريق الرئيسي: تحت إشارة حق الأولوية، تُظهر بخط عريض الطريق الرئيسي"],"q|u28-rimozione|0":["في منطقة السحب لا يجوز سحب مركبات ذوي الإعاقة التي معها تصريح.","استثناء منصوص عليه."],"q|u28-rimozione|1":["لوحة التنظيف الآلي تبين الأيام والساعات التي يُمنع فيها الانتظار.","لإتاحة التنظيف."],"q|u28-rimozione|2":["لوحة «مسار الطريق الرئيسي» تبين بخط أعرض الطريق الرئيسي.","صحيح."],"q|u28-rimozione|3":["في منطقة السحب يمكن أيضًا سحب مركبات ذوي الإعاقة التي معها تصريح.","هي مستثناة من السحب."],"c|u3-ciclomotore":["الدراجة النارية الصغيرة (ciclomotore)","«الموتوسيكل الصغير»: مركبة بمحرك صغيرة وبطيئة، بعجلتين أو ثلاث.","عجلتان أو ثلاث","محرك بنزين حتى 50 سم³ (أو كهربائي حتى 4 كيلوواط)","السرعة القصوى 45 كم/س","الدراجة ذات الدوّاسة المساعدة الكهربائية ليست ciclomotore","50 و45: «خمسون للمحرك، خمسة وأربعون للسرعة».","لا تخلط بين 50 (سعة المحرك سم³) و45 (السرعة كم/س).","سكوتر «خمسيني» (50 سم³)."],"q|u3-ciclomotore|0":["الدراجة النارية الصغيرة (ciclomotore) سرعتها القصوى حسب التصنيع لا تتجاوز 45 كم/س.","45 كم/س."],"q|u3-ciclomotore|1":["الدراجة النارية الصغيرة ذات محرك البنزين سعة محركها لا تتجاوز 50 سم³.","50 سم³."],"q|u3-ciclomotore|2":["يمكن أن يكون للدراجة النارية الصغيرة أربع عجلات.","عجلتان أو ثلاث. (المركبة الرباعية الخفيفة quadriciclo leggero «تُعامل مثلها» لكنها فئة أخرى.)"],"q|u3-ciclomotore|3":["الدراجة ذات الدوّاسة المساعدة الكهربائية تُعتبر ciclomotore.","هي مستبعدة من فئة ciclomotore."],"q|u3-ciclomotore|4":["يمكن أن تصل الدراجة النارية الصغيرة حسب التصنيع إلى 60 كم/س.","الحد الأقصى 45 كم/س."],"c|u3-motociclo":["الدراجة النارية الصغيرة مقابل الدراجة النارية","الدراجة النارية الصغيرة (ciclomotore)","حتى 50 سم³","أقصى سرعة 45 كم/س","عجلتان أو ثلاث","الدراجة النارية (motociclo)","أكثر من 50 سم³","عجلتان","لا يوجد حد أقصى لسعة المحرك","الحد الفاصل هو 50 سم³: حتى 50 = ciclomotore، أكثر = motociclo.","50 هو الحد الفاصل.","«الدراجة النارية سعة محركها القصوى 125 سم³» ← خطأ: لا يوجد حد أقصى."],"q|u3-motociclo|0":["الدراجة النارية (motociclo) سعة محركها أكثر من 50 سم³.","أكثر من 50 سم³."],"q|u3-motociclo|1":["الدراجة النارية سعة محركها القصوى 125 سم³.","لا يوجد حد أقصى."],"c|u3-autovettura":["سيارة الركاب (autovettura)","السيارة العادية: 4 عجلات، تنقل أشخاصًا، حتى 9 مقاعد مع السائق.","لنقل الأشخاص","9 مقاعد كحد أقصى مع السائق","أكثر من 9 مقاعد = أتوبيس (autobus)","يمكنها سحب مقطورة (rimorchio)","الفحص الدوري (revisione): أول مرة بعد 4 سنوات، ثم كل سنتين","9 مقاعد = فريق كرة خماسية (5) + 4 أصدقاء. من المقعد العاشر تصبح أتوبيس.","«مع السائق»: السائق يُحسب!","ميني فان بـ 9 مقاعد ما زال سيارة ركاب."],"q|u3-autovettura|0":["سيارة الركاب مخصصة لنقل الأشخاص وفيها 9 مقاعد كحد أقصى مع السائق.","صحيح."],"q|u3-autovettura|1":["مركبة فيها 12 مقعدًا هي سيارة ركاب.","أكثر من 9 مقاعد تصبح أتوبيس."],"q|u3-autovettura|2":["يجب إجراء الفحص الدوري لسيارة الركاب أول مرة بعد 4 سنوات ثم كل سنتين.","4 سنوات من أول تسجيل، ثم كل سنتين."],"q|u3-autovettura|3":["يمكن لسيارة الركاب سحب مقطورة.","نعم، مقطورات وعربات صغيرة ملحقة (carrelli appendice)."],"q|u3-autovettura|4":["الحد الأقصى 9 مقاعد لسيارة الركاب لا يشمل السائق.","السائق محسوب ضمن الـ 9."],"q|u3-autovettura|5":["يجب فحص سيارة الركاب كل سنة.","أول مرة بعد 4 سنوات، ثم كل سنتين."],"c|u3-caravan":["الكرفان بمحرك مقابل الكرفان المقطور","الكرفان بمحرك (autocaravan / camper)","هو مركبة آلية (autoveicolo) لها محرك","مجهزة للسكن","ممنوع السفر وقوفًا","الكرفان المقطور (caravan / roulotte)","هو مقطورة (rimorchio) بدون محرك","يُسكن فقط وهو متوقف","ممنوع البقاء داخله أثناء السير","AUTOcaravan له محرك (AUTO). أما الـ caravan فيُسحب.","AUTO-caravan = يسير وحده.","الكرفان المقطور ليس فيه أحزمة أمان: لا يجوز لأحد البقاء فيه أثناء السفر."],"q|u3-caravan|0":["الكرفان (caravan) مقطورة.","يُسحب وليس له محرك."],"q|u3-caravan|1":["يُسمح بنقل أشخاص داخل الكرفان المقطور أثناء السير.","يُسكن فقط والمركبة متوقفة."],"q|u3-caravan|2":["الكرفان بمحرك (autocaravan) مركبة آلية.","له محرك: فهو مركبة آلية."],"q|u3-caravan|3":["الكرفان بمحرك (autocaravan) مقطورة.","هو مركبة آلية: له محرك."],"c|u3-rimorchi":["المقطورات (rimorchi)","مركبات بلا محرك تسحبها مركبة أخرى.","بلا محرك","مقطورة خفيفة: وزنها حتى 750 كجم","نصف مقطورة (semirimorchio): يقع جزء من وزنها على المركبة التي تسحبها","750 كجم = «خفيفة» (تقريبًا وزن قارب صغير مع عربته).","الكرفان المقطور مقطورة؛ أما الكرفان بمحرك والأتوبيس المفصلي (autosnodato) فلا.","عربة الأمتعة الصغيرة خلف السيارة مقطورة خفيفة."],"q|u3-rimorchi|0":["المقطورة الخفيفة وزنها الإجمالي حتى 750 كجم.","750 كجم."],"q|u3-rimorchi|1":["المقطورات مركبات لها محرك خاص بها.","هي بلا محرك."],"q|u3-rimorchi|2":["يمكن أن يصل وزن المقطورة الخفيفة إلى 3.5 طن.","حتى 750 كجم."],"c|u3-quadricicli":["المركبات الرباعية والآلات الزراعية","المركبة الرباعية الخفيفة (quadriciclo leggero، «الميني كار») تُعامل مثل الدراجة النارية الصغيرة. والآلات الزراعية بطيئة.","المركبة الرباعية الخفيفة: تُعامل مثل ciclomotore، ويمكن قيادتها برخصة AM من سن 14","الآلات الزراعية: أقصى سرعة 40 كم/س على عجلات، و15 كم/س إذا كانت بجنازير","الميني كار = «موتوسيكل صغير بأربع عجلات».","المركبة الرباعية غير الخفيفة تحتاج رخصة B1 (سن 16)."],"q|u3-quadricicli|0":["المركبة الرباعية الخفيفة تُعامل مثل الدراجة النارية الصغيرة.","صحيح."],"q|u3-quadricicli|1":["الآلات الزراعية ذات العجلات المطاطية لا يجوز أن تتجاوز 40 كم/س.","40 كم/س (و15 كم/س إذا كانت بجنازير)."],"c|u4-sporgente":["لوحة الحمولة البارزة","الحمولة تبرز من خلف المركبة.","مربعة، بخطوط مائلة بيضاء وحمراء، عاكسة للضوء","توضع في نهاية الحمولة","أقصى بروز من الخلف: 3/10 من طول المركبة","الحمولة البارزة = أبيض وأحمر مثل شريط أعمال الطريق.","هي بيضاء وحمراء. الأصفر والأحمر للمركبات الثقيلة."],"q|u4-sporgente|0":["اللوحة المرسومة توضع عندما تبرز الحمولة من الخلف.","هي لوحة الحمولة البارزة."],"q|u4-sporgente|1":["يمكن أن تبرز الحمولة من الخلف حتى 3/10 من طول المركبة.","3/10 = 30%."],"q|u4-sporgente|2":["لوحة الحمولة البارزة بخطوط صفراء وحمراء.","بيضاء وحمراء."],"q|u4-sporgente|3":["يمكن أن تبرز الحمولة من الخلف حتى نصف طول المركبة.","الحد الأقصى 3/10."],"c|u4-merci":["لوحة البضائع الخطرة","المركبة تنقل بضائع خطرة (مثل الصهاريج).","مستطيل برتقالي","الرقم في الأعلى: نوع الخطر","الرقم في الأسفل: المادة المنقولة (رقم الأمم المتحدة ONU)","برتقالي = انتبه. في الأعلى الخطر، وفي الأسفل المادة.","في حادث مع هذه المركبة: انتبه للتسريبات والأدخنة والحرائق."],"q|u4-merci|0":["اللوحة البرتقالية تدل على مركبة تنقل بضائع خطرة.","صحيح."],"q|u4-merci|1":["في لوحة البضائع الخطرة، الرقم العلوي يدل على نوع الخطر.","في الأعلى الخطر، وفي الأسفل المادة."],"q|u4-merci|2":["لوحة البضائع الخطرة صفراء بإطار أحمر.","هي برتقالية. الصفراء بإطار أحمر هي لوحة المقطورات الثقيلة."],"q|u4-merci|3":["في لوحة البضائع الخطرة، الرقم السفلي يدل على نوع الخطر.","في الأسفل المادة (رقم ONU). الخطر في الأعلى."],"c|u4-pesanti":["لوحات المركبات الثقيلة مقابل المقطورات الثقيلة","المركبات فوق 3.5 طن","خطوط مائلة صفراء وحمراء","على خلفية المركبة","ليست للمقطورات","المقطورات فوق 3.5 طن","صفراء بإطار أحمر","على خلفية المقطورات ونصف المقطورات","مركبة = خطوط. مقطورة = إطار.","«الشاحنة لها خطوط، والمقطورة لها إطار».","كلاهما لما يزيد عن 3.5 طن بالحمولة الكاملة."],"q|u4-pesanti|0":["اللوحات ذات الخطوط المائلة الصفراء والحمراء توضع على خلفية المركبات التي يزيد وزنها عن 3.5 طن.","صحيح (ليست على المقطورات)."],"q|u4-pesanti|1":["اللوحة الصفراء ذات الإطار الأحمر توضع على المقطورات التي يزيد وزنها عن 3.5 طن.","صحيح."],"q|u4-pesanti|2":["اللوحة الصفراء ذات الإطار الأحمر توضع على سيارات الركاب.","فقط على المقطورات ونصف المقطورات فوق 3.5 طن."],"q|u4-pesanti|3":["اللوحات ذات الخطوط الصفراء والحمراء توضع على المقطورات فوق 3.5 طن.","على المقطورات توضع اللوحة الصفراء بإطار أحمر. الخطوط للمركبات."],"c|u4-altri":["الخطوط العاكسة وأقراص السرعة","المركبات الثقيلة لها خطوط عاكسة حول حدودها، وأقراص على الخلف تبيّن حدود سرعتها.","الخطوط العاكسة: تُظهر شكل المركبة (من الخلف حمراء أو صفراء، ومن الجانب بيضاء أو صفراء)","أقراص حدود السرعة: على خلف المركبات فوق 3.5 طن والمركبات التي حدودها مختلفة عن الحدود العامة","القرص على الخلف يقول لك: «أنا أسير أبطأ منك».","شاحنة عليها قرصان «80» و«70» من الخلف."],"q|u4-altri|0":["الخطوط العاكسة تُستخدم لإظهار شكل المركبة.","خصوصًا في الليل."],"c|u5-segnaletica":["لا تلمس إشارات الطريق","لا يجوز لك تحريك أي إشارة أو إزالتها أو تلويثها، ولا حتى قمع مروري (cono).","ممنوع تلويث الإشارات أو تحريكها أو إزالتها","ينطبق أيضًا على الأقماع والحواجز المتنقلة","ينطبق حتى لو أبلغت الشرطة","الإشارات ملك للجميع: ليست لك لتحركها.","«يُسمح بتحريك قمع يعيق الطريق» ← خطأ.","قمع يمنعك من الركن: لا يجوز لك إزالته."],"q|u5-segnaletica|0":["ممنوع تحريك الأقماع الموضوعة على الطريق لتحديد موقع أعمال.","حتى الإشارات المتنقلة لا تُلمس."],"q|u5-segnaletica|1":["يُسمح بتحريك إشارة إذا أُبلغت الشرطة مسبقًا.","غير مسموح في كل الأحوال."],"c|u5-oggetti":["لا تلوّث الطريق","لا رمي أشياء، لا أعقاب سجائر، ولا طين تنقله إلى الطريق.","ممنوع رمي أي شيء من المركبة (حتى أعقاب السجائر)","تنظيف العجلات قبل الخروج من مواقع العمل أو الطرق الطينية","إذا سرّبت المركبة زيتًا أو وقودًا بكمية كبيرة: إبلاغ الجهة المالكة للطريق أو الشرطة","ما في سيارتك يبقى في سيارتك.","الطين على العجلات يُعتبر «تلويثًا للطريق».","تخرج من موقع عمل والإطارات مليئة بالتراب: نظّفها أولًا."],"q|u5-oggetti|0":["ممنوع رمي أعقاب السجائر من النافذة.","ممنوع رمي أي شيء."],"q|u5-oggetti|1":["قبل الدخول إلى الطريق من موقع عمل يجب تنظيف العجلات من الطين.","لكي لا يتسخ نهر الطريق."],"q|u5-oggetti|2":["يُسمح برمي أشياء قابلة للتحلل من النافذة.","ممنوع رمي أي شيء."],"c|u5-gare":["سباقات السرعة","السباقات غير المرخصة على الطريق جريمة. السباق فقط في الحلبات المرخصة.","السباقات غير المرخصة على الطرق العامة: جريمة","يُعاقب أيضًا من يراهن عليها","الطريق ليس حلبة سباق."],"q|u5-gare|0":["على الطرق العامة ممنوع سباقات السرعة غير المرخصة.","هي جريمة."],"q|u5-gare|1":["سباقات السرعة على الطريق مسموحة ليلًا عندما تكون الحركة قليلة.","غير مسموحة أبدًا بدون ترخيص."],"c|u5-colonna":["في الطابور وفي الزحام","عندما يوجد طابور، يجب أن تترك خالية الأماكن التي يحتاجها الآخرون للمرور.","حافظ على مسافة الأمان وانظر بعيدًا","اترك خاليًا: التقاطعات، معابر المشاة والدراجات، المزلقانات، قضبان الترام، مخارج الشوارع الجانبية","لا تشغّل أضواء الطوارئ (luci di emergenza) لمجرد أنك في طابور","لا تصنع «حارة جديدة» بالتحرك إلى اليسار","لا تتوقف أبدًا «فوق» مكان يحتاج أحد أن يعبره بالعرض.","ينطبق على كل التقاطعات، ليس فقط التي فيها إشارة ضوئية.","الإشارة خضراء لكن بعد التقاطع زحام: لا تدخل، انتظر قبله."],"q|u5-colonna|0":["في الزحام يجب ترك المزلقان خاليًا.","لا تتوقف أبدًا على القضبان."],"q|u5-colonna|1":["في الزحام يجب ترك معابر المشاة خالية.","ومعابر الدراجات أيضًا."],"q|u5-colonna|2":["عند السير في طابور يجب تشغيل أضواء الطوارئ.","أضواء الطوارئ لا تُستخدم لمجرد أنك في طابور."],"q|u5-colonna|3":["في الزحام يجب ترك التقاطعات التي فيها إشارة ضوئية فقط خالية.","كل التقاطعات. كلمة «فقط» هي الفخ."],"q|u5-colonna|4":["في الطابور يُسمح بالتحرك إلى اليسار لتكوين صف جديد.","لا تُصنع حارة جديدة."],"c|u5-centro":["القيادة داخل المدينة (centro abitato)","في المدينة تحدث أشياء أكثر: تحتاج انتباهًا وصبرًا أكثر.","حذر وتسامح أكثر","مركبات تتوقف وتتحرك وتنعطف فجأة","ببطء على الحصى الصغير والبرك: خطر فقدان التماسك","مدينة = توقّع غير المتوقع."],"q|u5-centro|0":["داخل المدن يجب توقّع أن المركبات المتوقفة قد تتحرك أو تغيّر اتجاهها فجأة.","هذا أمر معتاد في حركة المدن."],"c|u6-vulnerabili":["من هم مستخدمو الطريق الضعفاء","هم الأشخاص الأكثر تعرضًا للخطر: إذا حدث اصطدام فهم من يتأذى.","المشاة، راكبو الدراجات، سائقو الدراجات النارية الصغيرة والدراجات النارية","كبار السن، الأطفال، ذوو الإعاقة","النساء الحوامل أو اللواتي يدفعن عربة أطفال","من يقود بتردد أو يتحرك بصعوبة","من ليس حوله «صندوق معدني».","راكبو الدراجات النارية أيضًا من الفئات الضعيفة."],"q|u6-vulnerabili|0":["كبار السن يُعتبرون من مستخدمي الطريق الضعفاء.","صحيح."],"q|u6-vulnerabili|1":["سائقو الدراجات النارية من مستخدمي الطريق الضعفاء.","حمايتهم قليلة."],"q|u6-vulnerabili|2":["مستخدمو الطريق الضعفاء هم المشاة فقط.","أيضًا راكبو الدراجات والدراجات النارية وكبار السن والأطفال وذوو الإعاقة..."],"c|u6-bastone":["العصا البيضاء مقابل العصا البيضاء والحمراء","العصا البيضاء","شخص كفيف","العصا البيضاء والحمراء","شخص أصم وكفيف","في الحالتين: توقف وأعطه أولوية المرور، حتى خارج خطوط المشاة.","الأحمر يضيف حاسة ثانية مفقودة: لا يسمع ولا يرى.","لا تفرمل فجأة بالقرب منهم ولا تستخدم الكلاكس لتخيفهم."],"q|u6-bastone|0":["العصا البيضاء والحمراء تدل على شخص أصم وكفيف.","صحيح."],"q|u6-bastone|1":["يجب التوقف وإعطاء أولوية المرور للشخص الكفيف حتى لو عبر خارج خطوط المشاة.","دائمًا."],"q|u6-bastone|2":["يجب إعطاء أولوية المرور للشخص الكفيف فقط على خطوط المشاة.","حتى خارج خطوط المشاة."],"c|u6-pedoni":["المشاة وكبار السن والأطفال","المشاة، خصوصًا كبار السن والأطفال، قد يتصرفون بشكل غير متوقع. يجب أن تكون أنت مستعدًا للتوقف.","كبار السن: قد يتوقفون في منتصف الطريق، ويخطئون في تقدير سرعتك، ويرون ويسمعون أقل","الأطفال: قد يعبرون جريًا، أو مع الإشارة الحمراء، أو يدفعون بعضهم","مع الإشارة الخضراء، اترك المشاة ينهون العبور قبل دخول التقاطع","انتبه للمشاة المختبئين خلف السيارات المركونة","القاعدة مع المشاة: «هم يمكن أن يخطئوا، أنت لا».","قد يرجع أحد المشاة للخلف فجأة على خطوط العبور.","رجل مسن يتردد في منتصف الخطوط: خفف السرعة وانتظر دون أن تقترب كثيرًا."],"q|u6-pedoni|0":["المشاة كبار السن قد يخطئون في تقدير سرعة المركبات.","قدرتهم على الرؤية والسمع أقل."],"q|u6-pedoni|1":["قد يرجع أحد المشاة للخلف فجأة وهو على خطوط العبور.","يجب أن تكون مستعدًا للتوقف."],"q|u6-pedoni|2":["عندما تصبح الإشارة خضراء يمكن دخول التقاطع فورًا حتى لو كان المشاة ما زالوا يعبرون.","يجب أن تنتظر حتى ينتهوا من العبور."],"q|u6-pedoni|3":["الأطفال يعبرون دائمًا فقط مع الإشارة الخضراء.","قد يعبرون مع الأحمر أو فجأة."],"c|u6-scuolabus":["أتوبيس المدرسة ومواقف التلاميذ","بالقرب من أتوبيس المدرسة (scuolabus) ينزل الأطفال ويعبرون دون أن ينظروا.","خفف السرعة واستعد للفرملة","أتوبيس المدرسة متوقف: خفف أكثر (لأنه يحجب الرؤية)","قد يعبر الأطفال جريًا","أتوبيس مدرسة متوقف = أطفال غير مرئيين خلفه."],"q|u6-scuolabus|0":["عند وجود أتوبيس مدرسة متوقف يجب تخفيف السرعة، لأن الأطفال قد يعبرون فجأة.","تصرف الأطفال غير متوقع."],"q|u6-scuolabus|1":["بالقرب من أتوبيس مدرسة متوقف يمكن الاستمرار بسرعة عادية إذا لم يظهر أطفال.","الأتوبيس يحجب الرؤية: خفف السرعة."],"c|u6-ciclisti":["راكبو الدراجات وأبواب السيارة","الدراجات غير مستقرة وصعبة الرؤية. تجاوزها بمسافة واسعة وتأكد قبل فتح الباب.","قبل فتح الباب: انظر في المرآة (دراجات، دراجات نارية)","تجاوز راكب دراجة: مسافة جانبية مناسبة (المصدر يذكر 1.5 م على الأقل، حيث يمكن)","إذا لم تكفِ المسافة الجانبية: لا تتجاوز","خارج المدن يمكن التنبيه بالكلاكس قبل التجاوز","الباب: أولًا المرآة، ثم المقبض.","قريب جدًا = تيار الهواء قد يُسقط راكب الدراجة.","مركون في المدينة وستنزل: انظر في المرآة هل تأتي دراجة."],"q|u6-ciclisti|0":["قبل فتح باب السيارة يجب التأكد من عدم اقتراب راكبي دراجات.","بالنظر في المرآة."],"q|u6-ciclisti|1":["عند تجاوز راكب دراجة يجب الحفاظ على مسافة جانبية مناسبة.","الدراجة غير مستقرة."],"q|u6-ciclisti|2":["إذا لم تكن المسافة الجانبية كافية يمكن تجاوز راكب الدراجة مع استخدام الكلاكس.","بدون مسافة كافية لا يُسمح بالتجاوز."],"q|u6-ciclisti|3":["قبل فتح باب السيارة يكفي النظر إلى الأمام.","يجب النظر في المرآة لمن يأتي من الخلف."],"c|u6-scivoli":["منحدرات الرصيف ومواقف التاكسي","منحدرات الرصيف (scivoli) لعربات الأطفال وذوي الإعاقة؛ ومواقف التاكسي للتاكسي فقط.","ممنوع سد منحدرات الرصيف، دائمًا","مواقف التاكسي: ممنوع انتظار المركبات الأخرى، دائمًا","بالقرب من التاكسي: مشاة يعبرون دون أن ينظروا"],"q|u6-scivoli|0":["ممنوع الانتظار أمام منحدرات الرصيف.","هي لعربات الأطفال والأشخاص ذوي الإعاقة."],"c|u32-destra":["الزم اليمين واستخدم الحارات الصحيحة","نسير على الجزء الأيمن من نهر الطريق، قرب الحافة اليمنى. الحارات اليسرى للتجاوز.","طريق باتجاهين وحارتين: اليسرى للتجاوز فقط","طريق باتجاهين وثلاث حارات: الوسطى للتجاوز فقط (للاتجاهين)","حارتان أو أكثر لكل اتجاه: استخدم أكثر حارة خالية جهة اليمين","ممنوع استخدام الحارات المخصصة (أتوبيس، طوارئ، دراجات) حتى مع الزحام","اليمين للسير، اليسار للتجاوز.","على مرتفع (dosso) في طريق باتجاهين وحارتين: ابقَ في أقصى اليمين الممكن."],"q|u32-destra|0":["يجب أن تسير المركبات على الجزء الأيمن من نهر الطريق، قرب الحافة اليمنى.","قاعدة عامة."],"q|u32-destra|1":["في طريق باتجاهين وثلاث حارات، الحارة الوسطى مخصصة للتجاوز.","للاتجاهين."],"q|u32-destra|2":["في حالة الزحام يمكن استخدام الحارة المخصصة للأتوبيسات.","أبدًا."],"q|u32-destra|3":["في حالة الزحام يمكن السير في حارة الطوارئ.","هي مخصصة للطوارئ."],"q|u32-destra|4":["في طريق باتجاهين وحارتين يمكن السير بشكل دائم في الحارة اليسرى.","تُستخدم فقط للتجاوز."],"c|u32-file":["السير في صفوف متوازية","عادةً لا نسير في صفوف متجاورة، لكن في بعض الحالات يُسمح بذلك.","مسموح مع الزحام في طرق فيها حارتان على الأقل لكل اتجاه","مسموح عند الاقتراب من تقاطعات تنظمها إشارة ضوئية أو شرطي","في الصفوف المتوازية يمكن السير أسرع في اليمين (ضمن الحدود)","الدراجات النارية لا يجوز لها المرور بين المركبات المتجاورة"],"q|u32-file|0":["مع الزحام، في طرق فيها حارتان على الأقل لكل اتجاه، يُسمح بالسير في صفوف متوازية.","صحيح."],"q|u32-file|1":["عند السير في صفوف متوازية يمكن للدراجات النارية المرور بين صفوف المركبات.","ممنوع."],"c|u32-svolte":["الانعطاف يمينًا مقابل الانعطاف يسارًا","يمينًا","الإشارة الجانبية مسبقًا","ابقَ قريبًا من الحافة اليمنى","الأولوية للمشاة الذين يعبرون","يسارًا","المرآة: هل هناك من يتجاوزك؟","الإشارة الجانبية مسبقًا","طريق باتجاهين: اقترب من المنتصف. اتجاه واحد: من الحافة اليسرى","انعطف قرب مركز التقاطع","الأولوية لمن يأتي من اليمين، ومن الأمام، وللمشاة","يمينًا تبقى يمينًا؛ يسارًا تنتقل نحو اليسار وتعطي الأولوية أيضًا لمن يأتي من الأمام.","للانعطاف، اقترب من الجانب الذي ستنعطف إليه.","ممنوع أن تتجه إلى الحافة اليسرى ثم تنعطف يمينًا. الشاحنة الطويلة التي تنعطف يمينًا قد تتسع يسارًا: لا تقترب منها كثيرًا."],"q|u32-svolte|0":["للانعطاف يمينًا يجب البقاء أقرب ما يمكن إلى الحافة اليمنى لنهر الطريق.","صحيح."],"q|u32-svolte|1":["للانعطاف يسارًا في طريق باتجاه واحد يجب الاقتراب من الحافة اليسرى.","في الاتجاه الواحد نتحرك نحو اليسار."],"q|u32-svolte|2":["قبل الانعطاف يسارًا يجب التأكد في المرآة أن لا أحد بدأ التجاوز.","لتجنب الاصطدام."],"q|u32-svolte|3":["عند الانعطاف يسارًا لا يجب إعطاء الأولوية للمركبات القادمة من الأمام.","يجب إعطاؤها."],"q|u32-svolte|4":["للانعطاف يمينًا يمكن الاتجاه إلى الحافة اليسرى لتوسيع المنعطف.","ممنوع."],"c|u32-inversione":["الدوران للخلف (inversione di marcia)","العودة بلف المركبة. تتم فقط حيث ترى جيدًا ولا تزعج أحدًا.","الإشارة الجانبية مشغلة طوال المناورة","الأولوية لكل المركبات","ممنوع: في الطريق السريع (أبدًا)، في الاتجاه الواحد، مع الخط المتصل","ممنوع: بالقرب من المنعطفات والمرتفعات والتقاطعات، مع رؤية قليلة، مع زحام","حيث لا ترى، لا تلف.","في الطريق السريع الدوران للخلف غير مسموح أبدًا (ويؤدي إلى إلغاء الرخصة)."],"q|u32-inversione|0":["الدوران للخلف ممنوع بالقرب من المنعطفات والمرتفعات.","الرؤية قليلة."],"q|u32-inversione|1":["في الطريق السريع يُسمح بالدوران للخلف إذا كان نهر الطريق خاليًا.","غير مسموح أبدًا."],"q|u32-inversione|2":["أثناء الدوران للخلف يجب أن تبقى الإشارة الجانبية مشغلة طوال المناورة.","صحيح."],"q|u32-inversione|3":["يُسمح بالدوران للخلف بعبور الخط المتصل إذا لم يأتِ أحد.","الخط المتصل لا يُعبر."],"c|u32-corsia":["تغيير الحارة","قبل أن تتحرك يجب أن تتأكد أن الحارة خالية وأنه يمكنك ذلك.","خط متقطع بين الحارات","الحارة خالية أمامك وخلفك لمسافة كافية","لا أحد قادم من الخلف","الإشارة الجانبية مسبقًا","لا تسبب خطرًا أو عرقلة","مرآة ← إشارة ← نظرة ← مناورة."],"q|u32-corsia|0":["قبل تغيير الحارة يجب التنبيه بالإشارة الجانبية.","مسبقًا."],"q|u32-corsia|1":["يمكن تغيير الحارة حتى عبر خط متصل إذا وُجدت مساحة.","يجب أن يكون الخط متقطعًا."],"q|u32-corsia|2":["لتغيير الحارة يكفي تشغيل الإشارة الجانبية دون النظر في المرايا.","يجب التأكد أن الحارة خالية."],"c|u33-immissione":["الاندماج والخروج والرجوع للخلف","عندما تتحرك من وقوف، أو تخرج من مدخل مركبات، أو ترجع للخلف، أنت الذي يجب أن تعطي الأولوية للجميع.","الاندماج من وقوف: الأولوية للجميع، إشارة جانبية، مرايا","الخروج من مدخل مركبات أو منطقة خاصة: الأولوية للمشاة والمركبات","الرجوع للخلف: الأولوية للجميع، انتبه للمشاة خلفك","عند الرجوع للخلف لا تُستخدم أضواء الطوارئ الأربعة ولا الكلاكس المتكرر","إذا «دخلت» في حركة المرور، فحركة المرور لها الأولوية."],"q|u33-immissione|0":["من يخرج من مدخل مركبات يجب أن يعطي الأولوية للمركبات والمشاة.","صحيح."],"q|u33-immissione|1":["عند الرجوع للخلف يجب إعطاء الأولوية فقط للمركبات القادمة من اليمين.","للجميع، من اليمين ومن اليسار."],"q|u33-immissione|2":["للاندماج في حركة المرور يجب النظر أيضًا في المرايا.","صحيح."],"q|u33-immissione|3":["من يندمج في حركة المرور من وقوف له الأولوية على المركبات المتحركة.","هو الذي يجب أن يعطي الأولوية."],"c|u33-rotatoria":["الدوّارات","في الدوّار ندور حول المركز. من له الأولوية يعتمد على الإشارات.","عادةً عند المدخل توجد «أعطِ الأولوية»: من هو داخل الدوّار (يأتي من اليسار) له الأولوية","بدون إشارة: تسري القاعدة العامة للأولوية لليمين (أي للداخل)","في الدوّار: ممنوع الرجوع للخلف","انظر إلى المدخل: هل يوجد المثلث المقلوب؟ إذن أعطِ الأولوية لمن يدور.","لا تفترض أن من بالداخل له الأولوية دائمًا: يعتمد على الإشارة."],"q|u33-rotatoria|0":["إذا وُجدت إشارة أعطِ الأولوية عند مدخل الدوّار، يجب إعطاء الأولوية للمركبات التي تسير داخله.","تأتي من اليسار."],"q|u33-rotatoria|1":["بدون إشارات، في الدوّار تسري قاعدة الأولوية لليمين.","القاعدة العامة."],"q|u33-rotatoria|2":["في الدوّار يُسمح بالرجوع للخلف إذا أخطأت المخرج.","ممنوع: قم بلفة أخرى."],"c|u33-incroci":["التصرف عند التقاطعات","عند الوصول إلى تقاطع استعد لإعطاء الأولوية وادخل الحارة الصحيحة مبكرًا.","ادخل التقاطع فقط إذا كنت تستطيع إخلاءه","ممنوع: التعرج، الدوران للخلف، التغيير المفاجئ للاتجاه","إذا تأخر من أمامك في التحرك: انتظر، بلا كلاكس متكرر","خارج المدن: ممنوع التوقف والانتظار في مناطق التقاطع","التقاطع = منطقة «بلا مفاجآت»."],"q|u33-incroci|0":["عند التقاطعات ممنوع الدوران للخلف.","صحيح."],"q|u33-incroci|1":["إذا تأخرت المركبة التي أمامك في التحرك مع الأخضر، يجب استخدام الكلاكس مرارًا.","ننتظر بصبر."],"q|u33-incroci|2":["يجب دخول التقاطع فقط إذا كان بالإمكان متابعة السير وإخلاؤه.","صحيح."],"c|u33-specchi":["المرايا والنقطة العمياء","تُضبط المرايا بعد المقعد وتُستخدم قبل كل مناورة.","تُضبط بعد ضبط المقعد","تُستخدم قبل: الانعطاف، تغيير الحارة، الاندماج، التجاوز، العودة للحارة، الركن","المرآة الجانبية فيها نقطة عمياء: تأكد أيضًا بإدارة نظرك","في المرآة الجانبية تبدو المركبات أبعد مما هي فعلًا","مرآة + نظرة فوق الكتف = لا مفاجآت."],"q|u33-specchi|0":["تُضبط المرايا بعد ضبط المقعد.","موضع العينين يعتمد على المقعد."],"q|u33-specchi|1":["المرآة الجانبية ليس فيها نقاط عمياء.","فيها نقطة عمياء: تحتاج أيضًا نظرة مباشرة."],"q|u33-specchi|2":["في المرآة الجانبية قد تبدو المركبات أبعد مما هي فعلًا.","بسبب شكل المرآة."],"q|u33-specchi|3":["تُضبط المرايا قبل ضبط المقعد.","بعد المقعد."],"c|u33-abbagliamento":["الانبهار، المواكب، الشرطة","مواقف خاصة لها تصرفات محددة.","عند الانبهار: خفف، لا تحدق في الضوء، وتوقف إذا لزم","موكب في المدينة: توقف على اليمين وانتظر، بلا كلاكس","كتابة «ALT POLIZIA» أو «ACCOSTARE» على سيارة الشرطة: توقف","ممنوع تجاوز «سيارة الأمان» (safety car) التي تقود حركة المرور"],"q|u33-abbagliamento|0":["إذا انبهرت بالأضواء يجب تخفيف السرعة والتوقف إذا لزم.","لا ترى الطريق."],"q|u33-abbagliamento|1":["إذا انبهرت بالأضواء يجب الرد بالأضواء العالية.","يزيد الوضع سوءًا للطرفين."],"c|u34-regola":["قاعدة اليمين","في تقاطع بلا إشارات ولا إشارة ضوئية ولا شرطي، أعطِ الأولوية لمن يأتي من يمينك.","القاعدة العامة: الأولوية لليمين","استثناءات: المركبات على القضبان (ترام، قطار) ← دائمًا","استثناءات: مركبات الإسعاف أثناء الطوارئ ← دائمًا","مع أعطِ الأولوية أو STOP ← أعطِ لليمين ولليسار","«اليمين مقدس». ثم تحقق من الاستثناءات: قضبان، سرينات، لافتات.","مع إشارتي «تقاطع بأولوية اليمين» أو «حق الأولوية» لا يجب أن تعطي الأولوية لليسار."],"q|u34-regola|0":["بدون إشارات يجب إعطاء الأولوية للمركبات القادمة من اليمين.","قاعدة عامة."],"q|u34-regola|1":["يجب إعطاء الأولوية للترام حتى لو جاء من اليسار.","مركبات على القضبان: دائمًا."],"q|u34-regola|2":["تُعطى الأولوية لمركبات الإسعاف أثناء الطوارئ فقط إذا جاءت من اليمين.","دائمًا، من أي اتجاه."],"q|u34-regola|3":["بدون إشارات يجب إعطاء الأولوية لمن يأتي من اليسار.","لليمين."],"q|u34-regola|4":["مع إشارة أعطِ الأولوية تُعطى الأولوية فقط للمركبات القادمة من اليمين.","لليمين ولليسار."],"c|u34-metodo":["الطريقة لحل أي تقاطع","لا تخمّن: اتبع دائمًا نفس الخطوات الأربع.","1. من له أولوية مطلقة؟ (ترام، طوارئ) ← يمر أولًا","2. من عنده STOP أو أعطِ الأولوية؟ ← يمر بعد الذين بدونها","3. بين الباقين: ضع نفسك مكان كل مركبة. من يمينه خالٍ يمر","4. «احذف» من مر وكرر","تخيل أنك جالس خلف مقود كل مركبة، واحدة تلو الأخرى.","من ينعطف يسارًا يعطي الأولوية أيضًا لمن يأتي من الأمام. المركبات التي لا تتقاطع مساراتها يمكن أن تمر معًا.","A تأتي من الجنوب، وB من الشرق: بالنسبة لـ A، فإن B على اليمين ← يمر B أولًا."],"q|u34-metodo|0":["لحل تقاطع يجب إيجاد المركبة التي يمينها خالٍ.","تمر أولًا (إذا لم يوجد ترام أو إشارات أو إسعاف)."],"q|u34-metodo|1":["مركبتان قادمتان من اتجاهين متعاكسين وتسيران مستقيمًا يمكنهما المرور في نفس الوقت.","مساراهما لا يتقاطعان."],"q|u34-metodo|2":["لحل تقاطع تمر أولًا المركبة التي يسارها خالٍ.","التي يمينها خالٍ."],"q|u34-metodo|3":["مركبتان قادمتان من اتجاهين متعاكسين وتسيران مستقيمًا يجب أن تمرا واحدة تلو الأخرى.","يمكنهما المرور معًا: المساران لا يتقاطعان."],"c|u35-tram":["الترام مقابل الترولي باص","الترام (tram)","يسير على قضبان","له الأولوية دائمًا (من اليمين ومن اليسار)","الترولي باص (filobus)","أتوبيس كهربائي بأسلاك علوية وعجلات مطاطية","لا يسير على قضبان","يتبع قواعد الأولوية العادية","العبرة بالقضيب، لا بالسلك في الأعلى.","قضبان = امتياز. أسلاك = بلا امتياز.","ومع ذلك تسري على الترام أيضًا الإشارات الموضوعة له."],"q|u35-tram|0":["الترولي باص له الأولوية دائمًا مثل الترام.","لا يسير على قضبان: يتبع القواعد العادية."],"q|u35-tram|1":["يجب إعطاء الأولوية للترام حتى عندما يأتي من اليسار.","مركبة على قضبان."],"c|u35-segnali":["تقاطعات فيها STOP وأعطِ الأولوية","من عنده STOP أو أعطِ الأولوية يمر بعد كل القادمين من طرق بدون هذه الإشارات.","STOP / أعطِ الأولوية: أعطِ لليمين ولليسار","إذا كان لمركبتين معًا STOP، تسري بينهما قاعدة اليمين","المركبات على الطريق الرئيسي تمر أولًا، ثم أصحاب الإشارة","أولًا من ليس عنده لافتة، ثم من عنده؛ وبين المتساوين، اليمين."],"q|u35-segnali|0":["المركبة التي عندها STOP يجب أن تعطي الأولوية أيضًا للمركبات القادمة من اليسار.","لليمين ولليسار."],"q|u35-segnali|1":["إذا كان لمركبتين معًا إشارة أعطِ الأولوية، تسري بينهما قاعدة اليمين.","عند تساوي الإشارة."],"q|u35-segnali|2":["المركبة التي عندها أعطِ الأولوية تمر قبل التي تأتي من اليسار بلا إشارة.","من عنده أعطِ الأولوية يعطيها للجميع."],"q|u35-segnali|3":["من عنده STOP يجب أن يعطي الأولوية فقط للمركبات القادمة من اليمين.","لليمين ولليسار."],"c|u36-come":["كيف يكون التجاوز","نتجاوز من اليسار، بعد التأكد أن كل المناورة يمكن أن تتم بأمان.","عادةً من اليسار","قبله: لا منع، رؤية كافية، الطريق خالٍ طوال المناورة، لا أحد قادم من الأمام، لا أحد يتجاوزك الآن، ومن أمامك لم يشر أنه سيتجاوز","إشارة جانبية، مسافة جانبية مناسبة، العودة إلى اليمين بأسرع ما يمكن دون قطع الطريق","المسافة اللازمة للتجاوز تزيد إذا كان فرق السرعة صغيرًا أو المركبات طويلة","شاهد نهاية التجاوز قبل أن تبدأه."],"q|u36-come|0":["التجاوز يكون عادةً من اليسار.","صحيح."],"q|u36-come|1":["قبل التجاوز يجب التأكد أن المركبة التي أمامك لم تشر إلى رغبتها في التجاوز.","وإلا يحدث اصطدام."],"q|u36-come|2":["المسافة اللازمة للتجاوز تقل إذا كان فرق السرعة بين المركبات صغيرًا.","تزيد: تحتاج وقتًا أطول."],"q|u36-come|3":["بعد التجاوز يجب العودة إلى اليمين بأسرع ما يمكن دون إحداث خطر.","صحيح."],"q|u36-come|4":["التجاوز يكون عادةً من اليمين.","من اليسار."],"c|u36-destra":["متى نتجاوز من اليمين","التجاوز من اليمين استثناء، مسموح فقط في حالات محددة.","إذا أشار من أمامك أنه سينعطف يسارًا وتحرك إلى الوسط","في طريق باتجاه واحد، إذا تحرك من أمامك إلى اليسار","الترام المتحرك في وسط الطريق (ليس اتجاهًا واحدًا) يُتجاوز من اليمين","ترام متوقف في المحطة: من اليمين فقط إذا وُجدت جزيرة أمان","من اليمين فقط إذا «فتح» لك الآخر اليمين.","ترام متوقف بلا جزيرة أمان: لا تتجاوزه من اليمين (الركاب ينزلون)."],"q|u36-destra|0":["يمكن تجاوز مركبة من اليمين إذا أشارت أنها ستنعطف يسارًا وتحركت نحو الوسط.","استثناء منصوص عليه."],"q|u36-destra|1":["يمكن تجاوز ترام متوقف في محطة بلا جزيرة أمان من اليمين.","الركاب ينزلون هناك تمامًا."],"q|u36-destra|2":["التجاوز من اليمين مسموح دائمًا في الطريق السريع عندما تكون الحركة سلسة.","نتجاوز من اليسار."],"q|u36-destra|3":["في طريق باتجاه واحد يمكن تجاوز الترام من الجانبين.","حسب الدرس."],"c|u36-vietato":["متى يكون التجاوز ممنوعًا","قائمة يجب حفظها: كلها مواقف لا ترى فيها أو يكون فيها أحد في خطر.","إشارة منع أو خط متصل","المنعطفات والمرتفعات ذات الرؤية القليلة (إلا في الاتجاه الواحد أو حارتين لكل اتجاه)","مركبة متوقفة أو مبطئة ليعبر المشاة","مركبة تقوم هي نفسها بالتجاوز","مركبات متوقفة عند مزلقان أو تقاطع، مع الدخول في الحارة الأخرى","في حارات التسارع/التباطؤ","مركبات الشرطة أو سيارة الأمان التي تقود حركة المرور","لا ترى؟ لا تتجاوز. أحد توقف لماشٍ؟ لا تتجاوز."],"q|u36-vietato|0":["ممنوع تجاوز مركبة توقفت ليعبر المشاة.","قد يكون الماشي مختبئًا."],"q|u36-vietato|1":["ممنوع تجاوز مركبة تقوم هي نفسها بالتجاوز.","صحيح."],"q|u36-vietato|2":["بالقرب من منعطف رؤيته قليلة، في طريق باتجاهين وحارتين، التجاوز مسموح إذا كنت سريعًا.","ممنوع."],"q|u36-vietato|3":["ممنوع التجاوز في حارة التسارع.","صحيح."],"q|u36-vietato|4":["يُسمح بتجاوز مركبة متوقفة عند مزلقان بالدخول في الحارة المعاكسة.","ممنوع."],"c|u36-sorpassato":["إذا كان أحد يتجاوزك","من يُتجاوز عليه أيضًا واجبات: تسهيل المناورة.","لا تزد السرعة","ابقَ يمينًا","إذا جاء أحد من الأمام: تحرك يمينًا وخفف إذا لزم","إذا كنت تقود مركبة بطيئة: توقف إذا لزم لتترك من خلفك يمر","يتجاوزونك؟ افسح المجال، لا تتسابق."],"q|u36-sorpassato|0":["من يُتجاوز عليه لا يجب أن يزيد سرعته.","لأنه يجعل التجاوز خطيرًا."],"q|u36-sorpassato|1":["من يُتجاوز عليه يجب أن يتحرك إلى اليسار لتسهيل التجاوز.","يجب أن يبقى يمينًا."],"q|u36-sorpassato|2":["من يُتجاوز عليه يمكنه زيادة السرعة لمنع التجاوز.","لا يجب أن يزيد السرعة."],"c|u37-tre":["التوقف الاضطراري، التوقف القصير، الانتظار","التوقف الاضطراري والتوقف القصير","التوقف الاضطراري (arresto): تتوقف لأن حركة المرور تفرض ذلك (إشارة حمراء، زحام)","التوقف القصير (fermata): تتوقف لوقت قصير جدًا (لإنزال أو إركاب شخص، أو لتسأل) وتبقى مستعدًا للتحرك","الانتظار (sosta)","تتوقف لوقت طويل","يمكنك الابتعاد عن المركبة","الانتظار الاضطراري: بسبب عطل أو توعك صحي","الاضطراري = لا يعتمد عليك. القصير = قصير وأنت خلف المقود. الانتظار = طويل ويمكنك النزول.","إذا نزلت وذهبت، فهذا انتظار (sosta).","حيث يُمنع التوقف القصير يُمنع الانتظار أيضًا. والعكس غير صحيح."],"q|u37-tre|0":["التوقف القصير (fermata) هو إيقاف السير لوقت قصير جدًا، مثلًا لإركاب أو إنزال أشخاص.","صحيح."],"q|u37-tre|1":["أثناء التوقف القصير يمكن للسائق الابتعاد عن المركبة.","يجب أن يبقى مستعدًا للتحرك. الابتعاد = انتظار (sosta)."],"q|u37-tre|2":["التوقف الاضطراري (arresto) هو إيقاف السير بسبب متطلبات حركة المرور.","مثل الإشارة الحمراء."],"q|u37-tre|3":["حيث يُمنع الانتظار يُمنع دائمًا التوقف القصير أيضًا.","العكس: حيث يُمنع التوقف القصير يُمنع الانتظار أيضًا."],"q|u37-tre|4":["حيث يُمنع التوقف القصير يُمنع الانتظار أيضًا.","صحيح."],"c|u37-fermatavietata":["أين يُمنع التوقف القصير والانتظار معًا","في هذه الأماكن لا يجوز أن تتوقف ولو للحظة.","المنعطفات والمرتفعات (وخارج المدن بالقرب منها أيضًا)","الأنفاق، الممرات السفلية، الجسور العلوية، الأروقة","المزلقانات والقضبان","معابر المشاة ومسارات الدراجات","الأرصفة (إلا إذا ذُكر غير ذلك)","حارات الاختيار المسبق","التقاطعات: داخل المدن على بعد أقل من 5 م، وخارجها في منطقة التقاطع","الطرق السريعة (إلا للطوارئ)","بالقرب من الإشارات أو الإشارات الضوئية إذا حجبتها","حيث لا ترى أو حيث يجب أن يمر أحد: لا انتظار ولا توقف.","المنع يسري حتى بدون لافتات: القانون هو الذي يحدده."],"q|u37-fermatavietata|0":["داخل المدن يُمنع التوقف القصير والانتظار على بعد أقل من 5 أمتار من التقاطعات.","صحيح."],"q|u37-fermatavietata|1":["في النفق يُسمح بالتوقف القصير لإنزال راكب.","التوقف والانتظار ممنوعان."],"q|u37-fermatavietata|2":["على المزلقانات يُمنع التوقف القصير والانتظار.","صحيح."],"q|u37-fermatavietata|3":["إذا لم توجد لافتات يمكن دائمًا الانتظار في المنعطف.","المنع يسري حتى بدون لافتات."],"q|u37-fermatavietata|4":["على خطوط المشاة يُسمح بالتوقف القصير لإنزال راكب.","التوقف والانتظار ممنوعان."],"c|u37-sostavietata":["أين يُمنع الانتظار فقط","هنا يمكنك التوقف للحظة، لكن لا تترك المركبة.","أمام مداخل المركبات","في الصف الثاني (إلا المركبات ذات العجلتين)","على بعد أقل من 15 م من إشارة موقف الأتوبيس (إذا لم يكن المكان محددًا)","في الأماكن المخصصة للأتوبيس والتاكسي وذوي الإعاقة والتحميل والتفريغ","أمام صناديق القمامة","بالقرب من محطات الوقود: 5 م قبلها وبعدها، في ساعات العمل","على أكتاف الطريق (إلا إذا ذُكر غير ذلك)","أتوبيس 15، محطة وقود 5، تقاطع 5."],"q|u37-sostavietata|0":["يُمنع الانتظار على بعد أقل من 15 مترًا من إشارة موقف الأتوبيس، إذا لم يكن المكان محددًا.","صحيح."],"q|u37-sostavietata|1":["الانتظار في الصف الثاني مسموح لفترات قصيرة.","ممنوع (إلا المركبات ذات العجلتين)."],"q|u37-sostavietata|2":["أمام صناديق القمامة يُمنع الانتظار.","صحيح."],"q|u37-sostavietata|3":["يُسمح بالانتظار أمام صناديق القمامة لأقل من ساعة.","هو ممنوع."],"c|u37-come":["كيف تنتظر (تركن)","اركن بحيث لا تزعج أحدًا وتأكد أن المركبة لن تتحرك.","في المدينة: قرب الحافة اليمنى، موازيًا لها، في اتجاه السير","بدون رصيف: اترك مترًا واحدًا على الأقل للمشاة","في طريق باتجاه واحد يمكن الانتظار على اليسار إذا بقيت 3 أمتار على الأقل","خارج المدينة: خارج نهر الطريق (لا على مسارات الدراجات ولا على أكتاف الطريق)؛ وإذا لم يمكن، قرب الحافة اليمنى","قبل النزول: المحرك مطفأ، فرامل اليد مشدودة، غيار معشّق، العجلات موجهة نحو الرصيف (في المنحدر)","عداد الركن وقرص الوقت: يوضعان بشكل واضح","متر للمشاة، و3 أمتار لمن يمر."],"q|u37-come|0":["في طريق باتجاه واحد يمكن الانتظار على الجانب الأيسر إذا بقيت مسافة 3 أمتار على الأقل.","صحيح."],"q|u37-come|1":["عند الانتظار في طريق بلا رصيف يجب ترك متر واحد على الأقل لمرور المشاة.","صحيح."],"q|u37-come|2":["قبل ترك المركبة في الانتظار يكفي إطفاء المحرك.","أيضًا فرامل اليد والغيار المعشّق."],"q|u37-come|3":["يمكن الانتظار في عكس اتجاه السير إذا وُجدت مساحة.","ننتظر في اتجاه السير."],"c|u38-autostrada":["قواعد الطريق السريع","في الطريق السريع (وفي الطرق الرئيسية خارج المدن) توجد إشارات منع إضافية.","ممنوع: الدوران للخلف، الرجوع للخلف، عبور الفاصل","ممنوع: سحب المركبات المعطلة (إلا الإنقاذ)، طلب التوصيل أو إعطاؤه","الأضواء المنخفضة (أو أضواء النهار) مشغلة حتى نهارًا","الانتظار الاضطراري في حارة الطوارئ: الوقت اللازم فقط، بحد أقصى 3 ساعات","مناطق الخدمة/المواقف: الانتظار بحد أقصى 24 ساعة","من حارة التسارع: أعطِ الأولوية لمن هو على نهر الطريق","للخروج: الحارة اليمنى مبكرًا، ثم حارة التباطؤ من بدايتها","ممنوع على المشاة والحيوانات (إلا في مناطق الخدمة)","في الطريق السريع لا نسير إلا للأمام.","من يدخل من حارة التسارع ليس له الأولوية."],"q|u38-autostrada|0":["في الطريق السريع الرجوع للخلف ممنوع.","حتى على المنحدرات والتقاطعات."],"q|u38-autostrada|1":["في الطريق السريع لا يجوز أن يتجاوز الانتظار الاضطراري 3 ساعات.","صحيح."],"q|u38-autostrada|2":["من يسير في حارة التسارع له الأولوية على المركبات في نهر الطريق.","هو الذي يجب أن يعطي الأولوية."],"q|u38-autostrada|3":["في الطريق السريع يجب تشغيل الأضواء المنخفضة حتى نهارًا (أو أضواء النهار).","صحيح."],"q|u38-autostrada|4":["في الطريق السريع يُسمح بسحب مركبة معطلة بحبل.","فقط مركبات الإنقاذ المرخصة."],"q|u38-autostrada|5":["في الطريق السريع يُسمح بطلب التوصيل في أماكن التوقف.","ممنوع طلب التوصيل أو إعطاؤه."],"c|u38-triangolo":["العطل ومثلث التحذير","إذا توقفت بسبب عطل، أخرج المركبة من نهر الطريق؛ وإذا لم تستطع، نبّه بمثلث التحذير.","أولًا: ادفع المركبة خارج نهر الطريق أو إلى الحافة اليمنى","المثلث: على بعد 50 م على الأقل خلف المركبة","مرئي من 100 م على الأقل","في الحارة المشغولة، على بعد متر واحد على الأقل من الحافة","إلزامي ارتداء السترة (أو الحمالات) العاكسة","خارج المدن: إلزامي ليلًا إذا كانت الأضواء الخلفية غير كافية، ونهارًا إذا كانت المركبة غير مرئية من 100 م","50 خلفها، 100 رؤية.","بالقرب من التقاطعات يوضع المثلث في المكان الأنسب، حتى لو كان أقل من 50 م."],"q|u38-triangolo|0":["يوضع المثلث على بعد 50 مترًا على الأقل من المركبة المتوقفة.","صحيح."],"q|u38-triangolo|1":["يجب أن يكون المثلث مرئيًا من 100 متر على الأقل.","صحيح."],"q|u38-triangolo|2":["يوضع المثلث على بعد 100 متر على الأقل من المركبة.","50 م على الأقل؛ ويجب أن يكون مرئيًا من 100 م."],"q|u38-triangolo|3":["من ينزل لوضع المثلث خارج المدن يجب أن يرتدي السترة العاكسة.","إلزامي."],"q|u38-triangolo|4":["في حالة العطل يجب أولًا محاولة إخراج المركبة من نهر الطريق.","لإفساح الطريق."],"q|u38-triangolo|5":["يوضع المثلث مباشرة خلف المركبة، على بعد حوالي 5 أمتار.","50 م على الأقل، ومرئي من 100 م."],"c|u38-carico":["سقوط الحمولة والمواد الزلقة","إذا سقطت حمولتك أو كانت على الطريق مواد خطرة، يجب إزالتها أو التنبيه إليها.","أزل الحمولة الساقطة فورًا؛ وإذا لم تستطع، نبّه بالمثلث","المواد الزلقة أو الخطرة: نبّه إليها، ولو باليد، وانثر رملًا أو ترابًا أو نشارة خشب إن أمكن"],"q|u38-carico|0":["إذا سقط جزء من الحمولة على نهر الطريق يجب إزالته بأسرع وقت أو التنبيه إليه مسبقًا.","صحيح."],"c|u39-persone":["نقل الأشخاص والحيوانات","لا يجوز نقل أشخاص أكثر من المذكور في رخصة المركبة (carta di circolazione).","سيارات الركاب: 9 أشخاص كحد أقصى مع السائق (وفي كل الأحوال عدد المقاعد في الرخصة)","الدراجات النارية: شخصان إذا كان الراكب مسموحًا به","على الدراجات النارية الكبيرة والصغيرة: ممنوع نقل أطفال أقل من 5 سنوات","الحيوانات: مسموحة إذا لم تعرقل؛ وعدة حيوانات في قفص أو في مكان مفصول بشبكة","مقاعد الرخصة هي الحد، لا الخيال."],"q|u39-persone|0":["على الدراجات النارية يُمنع نقل أطفال أعمارهم أقل من 5 سنوات.","صحيح."],"q|u39-persone|1":["يمكن نقل راكب إضافي عن المقاعد المذكورة في رخصة المركبة إذا كان طفلًا.","العبرة بالعدد المذكور."],"q|u39-persone|2":["يُسمح بنقل الحيوانات الأليفة إذا لم تشكل عائقًا أو خطرًا على القيادة.","صحيح."],"q|u39-persone|3":["في سيارة الركاب يمكن نقل أشخاص فوق العدد المذكور في الرخصة إذا كانوا أطفالًا.","العبرة بالعدد المذكور."],"c|u39-carico":["ترتيب الحمولة","يجب ألا تسقط الحمولة، ولا تغطي الأضواء واللوحات، ولا تحجب الرؤية.","لا يجوز أن تبرز من الأمام","من الخلف: حتى 3/10 من طول المركبة، مع اللوحة","من الجانب: ليس أكثر من 30 سم بعد أضواء الموقع","يجب ألا تقلل الرؤية أو الثبات أو تغطي الأضواء ولوحة الأرقام","ممنوع لصق أفلام على الزجاج الأمامي والنوافذ الأمامية","3/10 خلفًا، 30 سم جانبًا، 0 أمامًا."],"q|u39-carico|0":["لا يجوز أن تبرز الحمولة من الجزء الأمامي للمركبة.","صحيح."],"q|u39-carico|1":["يمكن أن تبرز الحمولة من الجانب حتى متر واحد.","ليس أكثر من 30 سم بعد أضواء الموقع."],"q|u39-carico|2":["يجب ترتيب الحمولة بحيث لا تغطي الأضواء ولوحة الأرقام.","صحيح."],"q|u39-carico|3":["يمكن أن تبرز الحمولة من الأمام حتى 3/10 من الطول.","من الأمام لا يجوز. الـ 3/10 من الخلف."],"c|u39-traino":["سحب مركبة معطلة","خارج الطريق السريع يمكن سحب مركبة معطلة بوصلة مناسبة.","تُسحب مركبة واحدة فقط","الوصلة: حبل، جنزير، كابل أو قضيب صلب","مقطورة بفرامل: وزنها حتى وزن المركبة الساحبة؛ بدون فرامل: حتى النصف","خطاف السحب غير المستخدم يُفك أو يُسحب أو يُطوى إذا كان بارزًا"],"q|u39-traino|0":["يمكن لمركبة أن تسحب مركبة معطلة واحدة فقط.","صحيح."],"q|u39-traino|1":["المقطورة بدون فرامل يمكن أن يكون وزنها ضعف وزن المركبة الساحبة.","بحد أقصى النصف."],"c|u40-quando":["متى تشغّل الأضواء","الأضواء تُستخدم لترى ولكي يراك الآخرون.","خارج المدن (وفي الطريق السريع): الأضواء المنخفضة مشغلة حتى نهارًا، أو أضواء النهار","في الأنفاق: الأضواء المنخفضة","في المدينة: من نصف ساعة بعد الغروب حتى نصف ساعة قبل الشروق","مع الضباب أو المطر الشديد أو الثلج: الأضواء المنخفضة حتى نهارًا","ضوء لوحة الأرقام: مقروءة من 20 م على الأقل","خارج المدينة = دائمًا مشغلة."],"q|u40-quando|0":["خارج المدن يجب تشغيل الأضواء المنخفضة حتى نهارًا، أو أضواء النهار.","صحيح."],"q|u40-quando|1":["داخل المدن تُشغل الأضواء من نصف ساعة بعد الغروب حتى نصف ساعة قبل شروق الشمس.","صحيح."],"q|u40-quando|2":["في النهار لا حاجة للأضواء أبدًا.","تلزم خارج المدن وفي الأنفاق ومع الرؤية القليلة."],"q|u40-quando|3":["خارج المدن نهارًا يمكن السير والأضواء مطفأة.","الأضواء المنخفضة أو أضواء النهار مشغلة."],"c|u40-abbaglianti":["الأضواء المنخفضة مقابل الأضواء العالية","المنخفضة (anabbaglianti)","تضيء دون أن تبهر","تُستخدم عند مقابلة مركبات أو السير خلفها","مؤشر أخضر","العالية (abbaglianti)","تضيء بعيدًا","فقط خارج المدن، حيث لا إنارة عامة","ممنوعة عند مقابلة أحد أو السير خلفه عن قرب، أو إذا أبهرت المشاة","الوميض مسموح للتنبيه بالتجاوز","مؤشر أزرق","المنخفضة = مهذبة. العالية = فقط إذا لم يكن أمامك أحد.","المؤشر الأزرق = الأضواء العالية."],"q|u40-abbaglianti|0":["يجب تبديل الأضواء العالية بالمنخفضة عند مقابلة مركبة أخرى.","لكي لا تبهرها."],"q|u40-abbaglianti|1":["يمكن استخدام الأضواء العالية داخل المدن المضاءة.","تُستخدم خارج المدن حيث لا إنارة."],"q|u40-abbaglianti|2":["يمكن استخدام الأضواء العالية بشكل متقطع للتنبيه إلى نية التجاوز.","صحيح."],"q|u40-abbaglianti|3":["المؤشر الأزرق يدل على أن الأضواء العالية مشغلة.","صحيح."],"c|u40-nebbia":["ضوء الضباب الخلفي والأمامي","ضوء الضباب الخلفي قوي جدًا: يُستخدم فقط مع رؤية قليلة جدًا.","الضباب الخلفي: رؤية أقل من 50 م، مطر شديد، ثلج كثيف","يُطفأ بمجرد أن تتحسن الرؤية (يبهر من خلفك)","أضواء الانتظار: في المدينة، من جهة الحركة، ونهر الطريق قليل الإنارة","أقل من 50 مترًا ← ضوء الضباب الخلفي."],"q|u40-nebbia|0":["ضوء الضباب الخلفي يُستخدم عندما تكون الرؤية أقل من 50 مترًا.","صحيح."],"q|u40-nebbia|1":["يمكن استخدام ضوء الضباب الخلفي دائمًا في الليل.","فقط مع رؤية قليلة جدًا."],"q|u40-nebbia|2":["يجب ترك ضوء الضباب الخلفي مشغلًا حتى عندما ينقشع الضباب.","يجب إطفاؤه: يبهر من خلفك."],"c|u40-spie":["مؤشرات لوحة القيادة","لون المؤشر يقول مدى الخطورة.","أحمر: خطر/عطل خطير (ضغط الزيت، الحرارة، الفرامل، البطارية، الأحزمة) ← توقف وافحص","مؤشر الزيت الأحمر أثناء السير: توقف وأطفئ المحرك فورًا","أخضر: وظيفة مشغلة (الأضواء المنخفضة، الإشارات الجانبية)","أزرق: الأضواء العالية","أحمر = قف. أخضر = تمام. أزرق = أضواء عالية."],"q|u40-spie|0":["مؤشر ضغط الزيت الأحمر المضاء أثناء السير يلزم بالتوقف وإطفاء المحرك.","خطر تلف كبير في المحرك."],"q|u40-spie|1":["مؤشر البطارية المضاء يدل على أن المولد لا يشحن البطارية.","صحيح."],"q|u40-spie|2":["المؤشر الأخضر الوامض يدل على عطل خطير.","يدل على أن الإشارة الجانبية مشغلة."],"q|u40-spie|3":["يمكن تجاهل مؤشر الزيت الأحمر المضاء حتى الصيانة القادمة.","يجب التوقف وإطفاء المحرك."],"c|u40-frecce":["الإشارات الجانبية وأضواء الطوارئ","الإشارات الجانبية تعلن عن مناوراتك.","الإشارة إلزامية: الانعطاف، التجاوز، تغيير الحارة، الخروج من نهر الطريق، الاندماج، التوقف على الحافة","أضواء الطوارئ (الأربعة): مركبة متوقفة تشكل خطرًا أو عائقًا","لا تُشغل الأضواء الأربعة لمجرد أنك في طابور"],"q|u40-frecce|0":["الإشارة الجانبية تُستخدم أيضًا لتغيير الحارة.","صحيح."],"q|u40-frecce|1":["تُشغل أضواء الطوارئ أثناء السير في طابور للتنبيه إلى الزحام.","لا تُستخدم لمجرد أنك في طابور."],"c|u41-cinture":["أحزمة الأمان والوسائد الهوائية","الحزام يجب أن يكون مربوطًا دائمًا، من الجميع، في الأمام والخلف.","إلزامي للسائق والركاب، في الأمام والخلف","حتى لو وُجدت وسادة هوائية (airbag)","المعفون: الحامل مع خطر مثبت بشهادة، الأمراض المثبتة بشهادة، مدربو القيادة أثناء الدروس","الوسادة الهوائية بدون حزام قد تكون خطيرة","مسند الرأس المضبوط: يمنع إصابة «ضربة السوط» في الرقبة","وسادة + حزام = فريق. الوسادة وحدها = خطر."],"q|u41-cinture|0":["يجب أن يربط الركاب في المقاعد الخلفية أيضًا أحزمة الأمان.","الجميع."],"q|u41-cinture|1":["إذا كانت المركبة فيها وسادة هوائية فربط الحزام غير إلزامي.","إلزامي في كل الأحوال."],"q|u41-cinture|2":["مسند الرأس، إذا كان مضبوطًا جيدًا، يحمي من «ضربة السوط».","صحيح."],"q|u41-cinture|3":["مدرب القيادة أثناء التدريب معفى من استخدام الحزام.","إعفاء منصوص عليه."],"q|u41-cinture|4":["الركاب في الخلف غير ملزمين بربط الأحزمة.","إلزامية للجميع."],"c|u41-bambini":["الأطفال في السيارة","يسافر الأطفال بأنظمة تثبيت مناسبة لطولهم ووزنهم.","أقل من 1.50 م: نظام تثبيت معتمد مناسب للطول (والوزن)","كرسي الطفل الموجه للخلف على المقعد الأمامي: فقط إذا كانت الوسادة الهوائية معطلة","أقل من 4 سنوات: إلزامية جهاز منع نسيان الطفل (antiabbandono)","1.50 م و4 سنوات: رقما الأطفال."],"q|u41-bambini|0":["الأطفال الذين طولهم أقل من 1.50 م يجب أن يستخدموا نظام تثبيت معتمدًا مناسبًا للطول والوزن.","صحيح."],"q|u41-bambini|1":["يمكن تركيب كرسي الطفل الموجه للخلف في الأمام والوسادة الهوائية مفعلة.","يجب تعطيل الوسادة الهوائية."],"q|u41-bambini|2":["للأطفال أقل من 4 سنوات جهاز منع النسيان إلزامي.","صحيح."],"q|u41-bambini|3":["طفل طوله 1.40 م يمكنه استخدام الحزام فقط بدون نظام تثبيت.","أقل من 1.50 م يحتاج نظام تثبيت."],"c|u41-casco":["الخوذة","على الدراجات النارية الكبيرة والصغيرة الخوذة إلزامية للجميع.","السائق والراكب، حتى البالغين، حتى للمسافات القصيرة","معتمدة، بالمقاس الصحيح، مربوطة","بعد صدمة قوية يجب تغييرها حتى لو بدت سليمة","التنظيف: منظفات غير أكّالة، أبدًا مذيبات أو بنزين","الواقي (الزجاج) المخدوش أو التالف: يُغيّر"],"q|u41-casco|0":["الخوذة إلزامية حتى للبالغين الذين يقودون دراجة نارية صغيرة.","للجميع."],"q|u41-casco|1":["الخوذة كثر من 0.8: جريمة؛ أكثر من 1.5: عقوبات أشد ومصادرة المركبة","رفض اختبار الكحول = نفس عقوبات الفئة الأشد","المُدان بأكثر من 0.8: إلزام بجهاز alcolock لعدة سنوات","0 · 0.5 · 0.8 · 1.5: صفر للجدد، نصف للجميع، ثم جريمة.","لا يوجد «علاج» (قهوة، دش): يحتاج الجسم ساعات للتخلص من الكحول."],"q|u44-alcol|0":["السائق الجديد في أول ثلاث سنوات يجب أن تكون نسبة الكحول في دمه صفرًا.","صحيح."],"q|u44-alcol|1":["الحد العام لنسبة الكحول في الدم 0.8 جم/لتر.","هو 0.5 جم/لتر. وأكثر من 0.8 جريمة."],"q|u44-alcol|2":["السائقون الذين أعمارهم أقل من 21 سنة يجب أن تكون نسبة الكحول لديهم صفرًا.","صحيح."],"q|u44-alcol|3":["فنجان قهوة قوي يزيل آثار الكحول بسرعة.","يحتاج ساعات."],"q|u44-alcol|4":["رفض الخضوع لاختبار الكحول يؤدي إلى عقوبات.","أشد العقوبات."],"q|u44-alcol|5":["مع نسبة كحول أكثر من 0.8 جم/لتر ترتكب جريمة.","صحيح."],"q|u44-alcol|6":["النسبة صفر تسري فقط على السائقين المحترفين.","أيضًا على السائقين الجدد ومن هم أقل من 21 سنة."],"c|u44-effetti":["الكحول والمخدرات والأدوية والتعب","كل ما يغيّر الانتباه وردود الفعل يجعل القيادة خطيرة.","الكحول: نشوة، استهانة بالخطر، ردود فعل أبطأ، نعاس","المخدرات (حتى الحشيش): لا قيادة","الأدوية المهدئة ومضادات الاكتئاب وبعض مضادات الحساسية: اقرأ النشرة، قد تقلل الأهلية للقيادة","التعب: خفف السرعة، توقف في أول مكان توقف واسترح","الوجبات الثقيلة: تزيد النعاس وزمن رد الفعل","إذا لم تكن بنسبة 100%، لا تقُد."],"q|u44-effetti|0":["الكحول يسبب النشوة ويؤدي إلى الاستهانة بالأخطار.","صحيح."],"q|u44-effetti|1":["إذا شعرت بالتعب يجب التوقف بأسرع وقت والاستراحة.","صحيح."],"q|u44-effetti|2":["بعض الأدوية قد تقلل الأهلية للقيادة.","مثل المهدئات."],"q|u44-effetti|3":["الكحول يحسّن ردود الفعل إذا تم تناوله بكميات صغيرة.","يجعلها أسوأ دائمًا."],"q|u44-effetti|4":["الكحول يزيد سرعة ردود الفعل.","يبطئها."],"c|u44-soccorso":["الإسعافات الأولية","الهدف هو إبقاء المصاب على قيد الحياة حتى يصل الإسعاف، دون إلحاق ضرر به.","أولًا: أمّن المكان واتصل بـ 112","فاقد الوعي ويتنفس ولا يُشك في إصابة العمود الفقري: وضعية الإفاقة الجانبية","الصدمة: مستلقٍ، الساقان مرفوعتان 20–30 سم، مغطى","النزيف: اضغط بمادة نظيفة؛ لا تنزع الأجسام المغروسة","الكسور: ثبّت العضو","الحروق: ماء بارد؛ لا تنزع الملابس الملتصقة","لا تعطه شيئًا يشربه (خصوصًا الكحول) ولا تحرك المصاب إذا لم يكن هناك خطر","راكب الدراجة النارية: لا تنزع الخوذة، إلا للضرورة","احمِ · أبلغ · أسعف."],"q|u44-soccorso|0":["المصاب في حالة صدمة تُرفع ساقاه حوالي 20-30 سم.","صحيح."],"q|u44-soccorso|1":["يجب إعطاء المصاب مشروبًا كحوليًا لإنعاشه.","لا مشروبات أبدًا، ولا سيما الكحولية."],"q|u44-soccorso|2":["الجسم الغريب المغروس في جرح يجب نزعه فورًا.","لا يُنزع."],"q|u44-soccorso|3":["يمكن صب الماء البارد على الحروق.","صحيح."],"q|u44-soccorso|4":["لا تُستخدم وضعية الإفاقة الجانبية إذا شُك في إصابة العمود الفقري.","صحيح."],"q|u44-soccorso|5":["المصاب فاقد الوعي مع الشك في إصابة العمود الفقري يوضع فورًا في وضعية الإفاقة الجانبية.","مع الشك في إصابة العمود الفقري لا تُستخدم."],"c|u42-categorie":["فئات رخص القيادة","كل رخصة تسمح بمركبات معينة وتتطلب عمرًا أدنى.","AM (14 سنة): دراجات نارية صغيرة ومركبات رباعية خفيفة","A1 (16): دراجات نارية حتى 125 سم³ و11 كيلوواط","A2 (18): دراجات نارية حتى 35 كيلوواط","A (24، أو 20 مع A2 منذ سنتين): كل الدراجات النارية","B1 (16): مركبات رباعية غير خفيفة","B (18): مركبات حتى 3.5 طن و8 مقاعد غير السائق؛ مقطورة حتى 750 كجم، أو أثقل إذا لم يتجاوز المجموع 3.5 طن","B96: المجموع حتى 4,250 كجم · BE: مقطورة حتى 3,500 كجم","مع رخصة B: 3.5 طن ومقطورة 750 كجم."],"q|u42-categorie|0":["برخصة B يمكن قيادة مركبات لا يتجاوز وزنها الأقصى المسموح 3.5 طن.","صحيح."],"q|u42-categorie|1":["برخصة B يمكن سحب مقطورة خفيفة حتى 750 كجم.","صحيح."],"q|u42-categorie|2":["يمكن الحصول على رخصة B في سن 16.","في سن 18. في سن 16 تؤخذ B1 أو A1."],"q|u42-categorie|3":["برخصة B يمكن قيادة أتوبيس.","يلزم فئة D."],"q|u42-categorie|4":["برخصة B يمكن سحب أي مقطورة بلا حدود للوزن.","مقطورة حتى 750 كجم، أو مجموع حتى 3.5 طن (4,250 كجم مع B96)."],"c|u42-validita":["صلاحية الرخصة","رخصة B تُجدد بتكرار يعتمد على العمر.","أقل من 50 سنة: 10 سنوات","من 50 إلى 70: 5 سنوات","من 70 إلى 80: 3 سنوات","أكثر من 80: سنتان","تاريخ الا كبة (carta di circolazione)","شهادة التأمين","النظارة: إذا كانت مطلوبة يجب استخدامها (رمز على الرخصة)","foglio rosa: مع مرافق مؤهل بجانبك؛ وعلى المركبة لوحة «P»","ثلاث أوراق: الرخصة، ورخصة المركبة، والتأمين."],"q|u42-documenti|0":["أثناء القيادة يجب أن تحمل رخصة المركبة (carta di circolazione).","صحيح."],"q|u42-documenti|1":["إذا كانت الرخصة تشترط النظارة، فالقيادة بدونها تؤدي إلى خصم نقاط.","صحيح."],"q|u42-documenti|2":["يجب الاحتفاظ ببوليصة التأمين دائمًا في المركبة.","في المركبة توضع الشهادة، لا البوليصة."],"c|u45-responsabilita":["المسؤولية المدنية مقابل الجنائية","المدنية (civile)","الالتزام بتعويض الأضرار للأشخاص والأشياء والحيوانات","يسأل السائق والمالك معًا (إلا إذا استُخدمت المركبة ضد إرادته، مثل السرقة)","يدفعها تأمين RCA","الجنائية (penale)","تنشأ من جريمة (مثل إصابات خطيرة، القتل على الطريق)","يسأل السائق فقط","لا توجد إذا كان الضرر للأشياء فقط وغير متعمد","المدنية = تدفع الأضرار. الجنائية = تُحاسب على جريمة.","المدنية = فلوس. الجنائية = محكمة.","المسؤولية الإدارية تخص مخالفات قانون المرور (غرامات، نقاط)."],"q|u45-responsabilita|0":["عن المسؤولية المدنية يسأل السائق ومالك المركبة معًا.","إلا إذا استُخدمت ضد إرادة المالك."],"q|u45-responsabilita|1":["المسؤولية الجنائية قد تقع على المالك الذي لم يكن يقود.","على السائق فقط."],"q|u45-responsabilita|2":["المالك لا يسأل عن الأضرار إذا كانت المركبة مسروقة.","استُخدمت ضد إرادته."],"q|u45-responsabilita|3":["المسؤولية المدنية تخص الجرائم فقط.","تخص تعويض الأضرار. الجرائم مسؤولية جنائية."],"c|u45-rca":["تأمين المسؤولية المدنية للسيارات (RCA)","إلزامي ويغطي الأضرار التي تسببها للآخرين.","إلزامي للسير، وحتى للانتظار في مكان خاص إذا كانت المركبة صالحة للسير","يغطي الأضرار للغير (أشخاص، أشياء، حيوانات)، وأيضًا في الاتحاد الأوروبي","الحد الأقصى للتغطية (massimale): أقصى مبلغ تدفعه شركة التأمين","نظام المكافأة والعقوبة (bonus-malus): 18 درجة؛ تبدأ في الدرجة 14؛ مع الحوادث التي تتسبب فيها يرتفع القسط","التعويض المباشر: مركبتان كحد أقصى","صندوق ضمان الضحايا: يدفع إذا كان المسؤول غير مؤمن أو غير معروف","RCA = تعويض من ألحقت به ضررًا.","الأضرار لمركبتك أنت لا يغطيها RCA (تحتاج تأمين kasko)."],"q|u45-rca|0":["تأمين RCA إلزامي.","صحيح."],"q|u45-rca|1":["تأمين RCA يغطي الأضرار لمركبتك التي تسببت فيها بخطئك.","يغطي أضرار الآخرين. لمركبتك تحتاج kasko."],"q|u45-rca|2":["في نظام bonus-malus، مع أول عقد تبدأ في الدرجة 14.","صحيح."],"q|u45-rca|3":["صندوق ضمان ضحايا الطريق يعوّض الأضرار التي تسببها مركبات غير مؤمنة أو غير معروفة.","صحيح."],"q|u45-rca|4":["التعويض المباشر يسري أيضًا على الحوادث بأكثر من مركبتين.","مركبتان كحد أقصى."],"q|u45-rca|5":["تأمين RCA غير ضروري إذا بقيت المركبة منتظرة على الطريق.","يلزم حتى في الانتظار، إذا كانت المركبة صالحة للسير."],"c|u45-altre":["وثائق تأمين اختيارية","بالإضافة إلى RCA يمكن إضافة تغطيات أخرى.","كاسكو (kasko): الأضرار لمركبتك","السرقة والحريق: تعويض حتى قيمة المركبة؛ الحريق المتعمد عادةً مستبعد","في حالة السرقة: بلاغ للشرطة (وأيضًا في إيطاليا إذا حدثت السرقة في الخارج)"],"q|u45-altre|0":["وثيقة kasko تغطي الأضرار لمركبتك.","صحيح."],"q|u45-altre|1":["للحصول على تعويض السرقة يجب تقديم بلاغ.","صحيح."],"c|u46-consumi":["استهلاك وتلوث أقل","طريقة القيادة والصيانة تغيّر الاستهلاك والتلوث.","سرعة معتدلة وثابتة، بلا تسارع أو فرملة مفاجئة","ضغط الإطارات الصحيح","حمولة أقل، بلا حامل سقف غير ضروري، النوافذ مغلقة في السرعة","المكيف والأجهزة الكهربائية فقط عند الحاجة","فلتر هواء نظيف، شكمان حفاز (catalitica) فعال","دخان أسود من العادم: افحص المحرك","الضوضاء: شكمان معتمد، بلا كلاكس بلا داعٍ","قيادة «ناعمة» = استهلاك قليل."],"q|u46-consumi|0":["ضغط الإطارات المنخفض جدًا يزيد الاستهلاك.","احتكاك أكثر."],"q|u46-consumi|1":["حامل السقف المركب وهو فارغ لا يؤثر على الاستهلاك.","يزيد مقاومة الهواء."],"q|u46-consumi|2":["الحفاظ على سرعة ثابتة يقلل الاستهلاك.","صحيح."],"q|u46-consumi|3":["فلتر الهواء المتسخ قد يزيد الاستهلاك والتلوث.","صحيح."],"q|u46-consumi|4":["التسارع والفرملة المتكرران يقللان الاستهلاك.","يزيدانه."],"c|u47-gomme":["الإطارات","هي نقطة الاتصال الوحيدة بين المركبة والطريق.","أقل عمق للمداس: 1.6 مم (سيارة)، 1 مم (دراجة نارية)","الضغط: حسب الشركة المصنعة، يُقاس والإطارات باردة، ومناسب للحمولة","ضغط منخفض: تآكل على الحواف واستهلاك أكثر؛ ضغط عالٍ: تآكل في الوسط","تآكل غير منتظم: ضغوط مختلفة على نفس المحور، حمولة غير متوازنة، ممتصات صدمات ضعيفة","الإطارات الشتوية: على كل العجلات؛ لا يُنصح بها صيفًا","السلاسل: على عجلات الجر","1.6 = الحد الأدنى لتبقى «ملتصقًا» بالطريق."],"q|u47-gomme|0":["أقل عمق لمداس الإطار في سيارات الركاب 1.6 مم.","صحيح."],"q|u47-gomme|1":["ضغط الإطارات يُفحص والإطارات باردة.","وهي ساخنة يكون أعلى."],"q|u47-gomme|2":["الضغط المنخفض جدًا يسبب تآكلًا في وسط المداس.","تآكل على الحواف. الوسط سببه الضغط العالي جدًا."],"q|u47-gomme|3":["سلاسل الثلج تُركب على عجلات الجر.","صحيح."],"q|u47-gomme|4":["الإطارات الشتوية يمكن تركيبها على العجلات الأمامية فقط.","على كل العجلات."],"q|u47-gomme|5":["أقل عمق لمداس الإطار في سيارات الركاب 3 مم.","1.6 مم."],"c|u47-freni":["الفرامل، ABS، معزز الفرامل، التوجيه","الفرملة تحوّل الحركة إلى حرارة عن طريق الاحتكاك.","فرامل القدم (الدواسة) وفرامل اليد (للانتظار)","افحص سائل الفرامل بشكل دوري","فرملة ضعيفة: هواء في الدائرة، بطانات تالفة أو ساخنة","ABS: يمنع قفل العجلات ويسمح بالتوجيه أثناء الفرملة الطارئة","معزز الفرامل والتوجيه الهيدروليكي لا يعملان والمحرك مطفأ","ممتصات صدمات ضعيفة: تماسك أسوأ وتآكل غير منتظم","ABS = تفرمل وتوجّه معًا."],"q|u47-freni|0":["نظام ABS يسمح بالتحكم في الاتجاه أثناء الفرملة الطارئة.","يمنع قفل العجلات."],"q|u47-freni|1":["معزز الفرامل يعمل حتى والمحرك مطفأ.","المعزز الذي يعمل بالتفريغ لا."],"q|u47-freni|2":["ممتصات الصدمات الضعيفة تجعل التماسك على الطريق أسوأ.","صحيح."],"q|u47-freni|3":["الهواء في دائرة الفرامل يجعل الفرملة أقل فعالية.","صحيح."],"q|u47-freni|4":["نظام ABS يقلل دائمًا مسافة الفرملة على أي سطح.","فائدته الأساسية عدم قفل العجلات وإمكانية التوجيه. كلمة «دائمًا» هي الفخ."],"c|u48-aderenza":["التماسك والقوة الطاردة المركزية","التماسك يبقي الإطارات «ملتصقة» بالأسفلت. وفي المنعطف تحاول القوة الطاردة المركزية دفعك للخارج.","أعلى تماسك: أسفلت جاف ونظيف وخشن","أقل تماسك: مبلل، زيت، طين، جليد، أوراق شجر","القوة الطاردة المركزية تزيد مع السرعة ومع المنعطفات الأضيق","الانقلاب أسهل: حمولة مرتفعة أو غير مثبتة، منعطف ضيق، مركبة ضيقة","الدراجات النارية: القضبان والخطوط المرسومة زلقة مع المطر","انزلاق على الماء (aquaplaning): خفف، بلا فرملة أو توجيه مفاجئ؛ الإطارات البالية تزيد الخطر","منعطف + سرعة = دفع نحو الخارج."],"q|u48-aderenza|0":["القوة الطاردة المركزية في المنعطف تزيد بزيادة السرعة.","صحيح."],"q|u48-aderenza|1":["الحمولة الموضوعة في الأعلى تزيد خطر الانقلاب.","ترفع مركز الثقل."],"q|u48-aderenza|2":["التماسك أكبر على الأسفلت المبلل.","أكبر على الأسفلت الجاف."],"q|u48-aderenza|3":["بالنسبة للدراجات النارية قد تكون الخطوط الأرضية زلقة مع المطر.","صحيح."],"q|u48-aderenza|4":["الإطارات البالية تزيد خطر الانزلاق على الماء (aquaplaning).","تصرف الماء بشكل أقل."],"q|u48-aderenza|5":["القوة الطاردة المركزية تقل بزيادة السرعة.","تزيد."],"c|u7-famiglia":["عائلة إشارات الخطر","كل إشارات الخطر تُعرف فورًا: مثلث رأسه للأعلى وإطاره أحمر. تنبهك قبل الخطر.","مثلث رأسه للأعلى، إطار أحمر","خلفية بيضاء = دائمة","خلفية صفراء = مؤقتة (موقع أعمال)","عادةً على بعد حوالي 150 م قبل الخطر","يمكن أن تبيّن لوحة إضافية المسافة الدقيقة","مثلث = «انتبه، هناك شيء أمامك».","المثلث الذي رأسه للأسفل ليس إشارة خطر: هو «أعطِ الأولوية» (dare precedenza).","ترى مثلث المرتفع (dosso): المرتفع على بعد حوالي 150 م أمامك، وليس تحت اللافتة."],"q|u7-famiglia|0":["إشارات الخطر شكلها مثلث رأسه للأعلى.","صحيح."],"q|u7-famiglia|1":["إشارات الخطر شكلها دائري.","الدائرية هي إشارات المنع والإلزام."],"q|u7-famiglia|2":["الخلفية الصفراء في إشارات الخطر تدل على خطر مؤقت، مثل أعمال في الطريق.","أصفر = موقع أعمال / مؤقت."],"q|u7-famiglia|3":["توضع إشارات الخطر عادةً على بعد حوالي 150 مترًا من الخطر.","حوالي 150 م."],"q|u7-famiglia|4":["توضع إشارات الخطر بالضبط في مكان الخطر.","هي تنبّه مسبقًا، على بعد حوالي 150 م."],"q|u7-famiglia|5":["الخلفية الصفراء في إشارات الخطر تدل على خطر دائم.","أصفر = مؤقت (موقع أعمال)."],"c|u7-pannelli":["لوحة المسافة مقابل لوحة الامتداد","المسافة (distanza)","تقول كم بقي حتى الخطر","مثال: «300 م»","الامتداد (estesa)","تقول كم طول المقطع الخطر","فيها أسهم","المسافة = بعد كم يبدأ. الامتداد = كم يستمر.","ESTesa = ESTensione (امتداد المقطع)."],"q|u7-pannelli|0":["لوحة الامتداد (estesa) تبيّن طول مقطع الطريق الخطر.","صحيح."],"q|u7-pannelli|1":["لوحة المسافة (distanza) تبيّن طول المقطع الخطر.","تبيّن كم بقي حتى الخطر. الطول هو لوحة الامتداد."],"c|u7-deformata":["طريق متموج / متضرر (strada deformata)","طريق في حالة سيئة، سطحه غير مستوٍ أو متضرر.","خفف السرعة، خصوصًا إذا كنت تسحب مقطورة","امسك المقود بثبات","خطر الانزلاق، حتى لمن يأتي من الاتجاه المقابل","حدبتان = طريق «متموج» ومتضرر.","يشبه المرتفع (dosso) والانخفاض (cunetta): هنا التموجات اثنتان (سطح غير مستوٍ)."],"q|u7-deformata|0":["الإشارة المرسومة تنبه إلى طريق في حالة سيئة، متموج أو متضرر.","طريق متضرر (strada deformata)."],"q|u7-deformata|1":["الإشارة المرسومة تنبه إلى مرتفع (dosso).","المرتفع له حدبة واحدة فقط. هنا حدبتان: طريق متضرر."],"q|u7-deformata|2":["عند هذه الإشارة يجب الإمساك بالمقود بثبات.","السطح غير المستوي قد يسبب الانزلاق."],"q|u7-deformata|3":["الإشارة المرسومة تدل على مقطع طريق زلق.","هي طريق متضرر: سطح غير مستوٍ، لا زلق."],"c|u7-dossocunetta":["المرتفع مقابل الانخفاض","المرتفع (dosso)","حدبة: صعود ثم نزول","يخفي من يأتي من الجهة الأخرى","ممنوع: التجاوز، الانتظار، التوقف القصير، الدوران للخلف، الرجوع للخلف","الانخفاض (cunetta)","حفرة: نزول ثم صعود","قد يتجمع فيه الماء والطين","خفف السرعة","الرسم يتجه للأعلى (مرتفع) أو للأسفل (انخفاض).","DOSSO = ظهر الجمل ∩. CUNETTA = المهد ∪.","على المرتفع ممنوع التجاوز، إلا في الطرق ذات الاتجاه الواحد أو التي فيها حارتان على الأقل لكل اتجاه."],"q|u7-dossocunetta|0":["الإشارة المرسومة تنبه إلى مرتفع (dosso)، أي صعود يليه نزول.","الرسم «على شكل حدبة»."],"q|u7-dossocunetta|1":["الإشارة المرسومة تنبه إلى انخفاض (cunetta).","هي مرتفع: الرسم يتجه للأعلى."],"q|u7-dossocunetta|2":["الإشارة المرسومة تنبه إلى انخفاض (cunetta)، أي نزول يليه صعود.","الرسم «على شكل مهد»."],"q|u7-dossocunetta|3":["بالقرب من المرتفع (dosso) ممنوع الانتظار.","وأيضًا التوقف القصير والتجاوز والدوران للخلف والرجوع للخلف."],"q|u7-dossocunetta|4":["عند الانخفاض (cunetta) يجب توقع تجمع الماء أو الطين عند المطر.","الانخفاض حفرة في الطريق."],"q|u7-dossocunetta|5":["على المرتفع التجاوز مسموح دائمًا.","ممنوع، إلا في الطرق ذات الاتجاه الواحد أو التي فيها حارتان على الأقل لكل اتجاه."],"c|u7-curve":["منعطف خطر (curva pericolosa)","منعطف رؤيته محدودة، في الاتجاه الذي يبينه السهم (يمين أو يسار).","خفف السرعة لتتمكن من التوقف","ابقَ قريبًا من الحافة اليمنى","ممنوع: التجاوز (إلا في طريق باتجاه واحد أو بحارتين لكل اتجاه)، الانتظار، الدوران للخلف، الرجوع للخلف","السهم ينحني حيث ينحني الطريق.","قد تكون معه لوحة «TORNANTE» (منعطف حاد قريب من 180°، في الجبال)."],"q|u7-curve|0":["الإشارة المرسومة تنبه إلى منعطف خطر إلى اليمين.","السهم ينحني إلى اليمين."],"q|u7-curve|1":["الإشارة المرسومة تنبه إلى منعطف خطر إلى اليمين.","السهم ينحني إلى اليسار."],"q|u7-curve|2":["عند منعطف خطر يجب السير بالقرب من الحافة اليمنى لنهر الطريق.","لكي لا تدخل في الاتجاه الآخر."],"q|u7-curve|3":["في منعطف رؤيته محدودة يُسمح بالدوران للخلف.","ممنوع."],"q|u7-curve|4":["في المنعطفات الخطرة يُسمح بالانتظار على الحافة اليمنى.","ممنوع."],"c|u7-doppiacurva":["منعطف مزدوج: الأول يمينًا أم يسارًا؟","الأول يمينًا","السهم ينحني أولًا إلى اليمين","ثم إلى اليسار","الأول يسارًا","السهم ينحني أولًا إلى اليسار","ثم إلى اليمين","اقرأ السهم من الأسفل إلى الأعلى: المنعطف الأول هو القريب من القاعدة.","ابدأ من قاعدة السهم، كأنك تقود عليه.","خطأ شائع: قراءته من الأعلى. يُقرأ من الأسفل."],"q|u7-doppiacurva|0":["الإشارة المرسومة تنبه إلى منعطف مزدوج، الأول إلى اليمين.","من الأسفل، السهم ينحني أولًا إلى اليمين."],"q|u7-doppiacurva|1":["الإشارة المرسومة تنبه إلى منعطف مزدوج، الأول إلى اليمين.","من الأسفل ينحني أولًا إلى اليسار."],"c|u7-plbarriere":["مزلقان بحواجز مقابل مزلقان بدون حواجز","بحواجز","الرسم: سياج","حواجز كاملة أو نصف حواجز","أضواء حمراء وصوت ينبهان إلى الإغلاق","بدون حواجز","الرسم: قاطرة","لا حواجز!","بعدها: صليب سانت أندريا بالقرب من القضبان","سياج = توجد حواجز. قطار = لا حواجز، عليك أنت أن تنظر.","ترى قطارًا مرسومًا؟ القطار قد يأتي عليك: لا توجد حواجز.","توقف دائمًا إذا ومضت الأضواء الحمراء أو رنّ الجرس. لا تدخل إذا كان الزحام سيمنعك من الخروج من القضبان."],"q|u7-plbarriere|0":["الإشارة المرسومة تنبه إلى مزلقان بحواجز كاملة أو نصف حواجز.","السياج يدل على الحواجز."],"q|u7-plbarriere|1":["الإشارة المرسومة تنبه إلى مزلقان بحواجز.","القاطرة تدل على مزلقان بدون حواجز."],"q|u7-plbarriere|2":["عند المزلقان يجب التوقف عندما تومض الأضواء الحمراء.","حتى لو لم تنزل الحواجز بعد."],"q|u7-plbarriere|3":["يمكن دخول المزلقان حتى لو كان الزحام يمنع إخلاءه.","لا تبقَ أبدًا على القضبان."],"c|u7-croce":["صليب سانت أندريا المفرد مقابل المزدوج","مفرد","قضيب (خط سكة) واحد فقط","بالقرب من المزلقان بدون حواجز","مزدوج","أكثر من خط سكة","قد يمر أكثر من قطار","صليب واحد = خط واحد. مزدوج = عدة خطوط.","عُدّ الصلبان = عُدّ الخطوط (1 أو أكثر).","الصليب ليس مثلثًا: هو علامة X بيضاء بإطار أحمر، موضوعة بجانب القضبان مباشرة (ليس قبلها بـ 150 م). قد يكون أفقيًا أو عموديًا؛ وتحته قد توجد أضواء حمراء وامضة."],"q|u7-croce|0":["صليب سانت أندريا المفرد يدل على أن السكة الحديد فيها خط واحد فقط.","صحيح."],"q|u7-croce|1":["الإشارة المرسومة تدل على مزلقان بخط سكة واحد.","هو الصليب المزدوج: أكثر من خط."],"q|u7-croce|2":["صليب سانت أندريا يوضع مباشرة بالقرب من المزلقان بدون حواجز.","يكون بجانب القضبان، لا قبلها بـ 150 م."],"q|u7-croce|3":["مع صليب سانت أندريا المزدوج، بعد مرور قطار قد يأتي قطار آخر.","الخطوط أكثر من واحد."],"q|u7-croce|4":["صليب سانت أندريا يوضع على بعد 150 مترًا من المزلقان.","هو بجانب القضبان مباشرة. على بعد 150 م توجد اللوحة ذات الخطوط الثلاثة."],"c|u7-distanziometrici":["لوحات المسافة (pannelli distanziometrici)","تقرّبك من المزلقان بعدّ المسافة.","3 خطوط حمراء = 150 م","خطان = 100 م","خط واحد = 50 م","توجد قبل أي مزلقان","كل خط = 50 مترًا.","الخطوط تقل كلما اقتربت."],"q|u7-distanziometrici|0":["اللوحة ذات الخطوط الحمراء الثلاثة تدل على أن المزلقان على بعد حوالي 150 م.","3 × 50 = 150 م."],"q|u7-distanziometrici|1":["اللوحة ذات الخط الأحمر الواحد تدل على أن المزلقان على بعد حوالي 100 م.","خط واحد = 50 م. و100 م خطان."],"q|u7-distanziometrici|2":["اللوحة ذات الخطين الأحمرين تدل على أن المزلقان على بعد حوالي 100 م.","2 × 50 = 100 م."],"q|u7-distanziometrici|3":["اللوحة ذات الخطوط الحمراء الثلاثة تدل على أن المزلقان على بعد 50 م.","3 خطوط = 150 م. خط واحد = 50 م."],"c|u8-tram":["عبور الترام (attraversamento tranviario)","خط ترام يعبر الطريق، غير منظم بإشارة ضوئية.","خفف السرعة","الترام يحتاج مسافة أطول من السيارة للتوقف","انتبه للقضبان: تفقد التماسك إذا فرملت فوقها","الترام = ثقيل وعلى قضبان: لا يستطيع تفاديك.","الترام المتوقف في محطة بلا جزيرة أمان: انتبه للركاب الذين يصعدون أو ينزلون."],"q|u8-tram|0":["الإشارة المرسومة تنبه إلى عبور ترام غير منظم بإشارة ضوئية.","صحيح."],"q|u8-tram|1":["الترام يحتاج مسافة فرملة أطول من سيارة الركاب.","هو أثقل بكثير ويسير على قضبان."],"q|u8-tram|2":["الإشارة المرسومة تنبه إلى مزلقان.","هي عبور ترام: رسم الترام."],"c|u8-pedonale":["معبر المشاة: المثلث مقابل المربع الأزرق","المثلث (خطر)","تنبيه مسبق: خطوط المشاة قادمة","عادةً قبلها بحوالي 150 م","المربع الأزرق (إرشاد)","أنت عند خطوط المشاة تمامًا","يوضع عند المعبر نفسه","مثلث = «ستأتي قريبًا». مربع أزرق = «هي هنا».","المثلث = بعد قليل. المربع = هنا.","ممنوع تجاوز مركبة تبطئ أو تتوقف لترك المشاة يعبرون. ممنوع الانتظار والتوقف القصير على الخطوط."],"q|u8-pedonale|0":["الإشارة المرسومة تنبه إلى معبر مشاة.","مثلث خطر فيه شخص يمشي."],"q|u8-pedonale|1":["الإشارة المرسومة موضوعة عند معبر المشاة نفسه.","المثلث تنبيه مسبق (قبل حوالي 150 م). عند الخطوط يوجد المربع الأزرق."],"q|u8-pedonale|2":["ممنوع تجاوز مركبة توقفت لترك المشاة يعبرون.","قد تصدم أحد المشاة المختبئين."],"q|u8-pedonale|3":["الإشارة المرسومة تدل على المكان الدقيق لمعبر المشاة.","المربع الأزرق يكون عند الخطوط نفسها."],"c|u8-ciclabile":["عبور الدراجات (attraversamento ciclabile)","أمامك معبر للدراجات (عادةً على بعد حوالي 150 م).","خفف السرعة","كن مستعدًا للتوقف","أعطِ أولوية المرور للدراجات التي تعبر","نفس قواعد خطوط المشاة، لكن مع الدراجات.","ممنوع تجاوز من يتوقف لترك الدراجات تمر."],"q|u8-ciclabile|0":["الإشارة المرسومة تنبه إلى معبر دراجات.","مثلث فيه دراجة."],"q|u8-ciclabile|1":["عند الإشارة المرسومة يجب إعطاء أولوية المرور للدراجات التي تعبر.","صحيح."],"q|u8-ciclabile|2":["الإشارة المرسومة تدل على مسار مخصص للدراجات.","المثلث إشارة خطر: معبر دراجات، لا مسار."],"q|u8-ciclabile|3":["عند الإشارة المرسومة يمكن تجاوز مركبة متوقفة لترك الدراجات تعبر.","ممنوع."],"c|u8-pendenze":["نزول خطر مقابل صعود حاد","نزول خطر (discesa pericolosa)","ميل للأسفل (مثلًا 10%)","غيارات منخفضة + فرملة المحرك","لا تستخدم الفرامل لفترة طويلة (تسخن)","مسافة الفرملة تزيد","صعود حاد (salita ripida)","ميل للأعلى","ضع غيارًا منخفضًا مناسبًا","اقرأ من اليسار إلى اليمين: المنحدر ينزل أم يصعد؟","في النزول المحرك هو الذي يفرمل، لا الدواسة.","الـ 10% ليست حدًا للسرعة: هي نسبة الميل (10 م ارتفاع كل 100 م)."],"q|u8-pendenze|0":["الإشارة المرسومة تنبه إلى نزول خطر بميل 10%.","المنحدر ينزل من اليسار إلى اليمين."],"q|u8-pendenze|1":["في النزول الخطر يجب استخدام غيار منخفض للاستفادة من فرملة المحرك.","يمنع تسخين الفرامل."],"q|u8-pendenze|2":["في النزول يجب استخدام الفرامل لفترة طويلة وبشكل مستمر.","تسخن وتفقد فعاليتها."],"q|u8-pendenze|3":["الإشارة المرسومة تنبه إلى نزول خطر.","هي صعود حاد: المنحدر يصعد من اليسار إلى اليمين."],"q|u8-pendenze|4":["الرقم على إشارة النزول الخطر يدل على السرعة القصوى المسموحة.","يدل على نسبة الميل."],"c|u8-strettoie":["تضيّق متماثل مقابل غير متماثل","متماثل","الطريق يضيق من الجانبين","غير متماثل","يضيق من جانب واحد فقط","يسارًا أو يمينًا (انظر أي حافة تدخل للداخل)","انظر أي الحواف تنحني إلى الداخل.","الجانب الذي «يدخل» هو جانب التضيّق.","قد تتبعه إشارات أولوية في طريق باتجاه واحد متناوب. مع خلفية صفراء: موقع أعمال."],"q|u8-strettoie|0":["الإشارة المرسومة تنبه إلى تضيّق نهر الطريق من الجانبين.","تضيّق متماثل."],"q|u8-strettoie|1":["الإشارة المرسومة تنبه إلى تضيّق غير متماثل من اليسار.","الحافة اليسرى فقط تدخل للداخل."],"q|u8-strettoie|2":["الإشارة المرسومة تنبه إلى تضيّق غير متماثل من اليسار.","الحافة اليمنى هي التي تدخل: تضيّق من اليمين."],"q|u8-strettoie|3":["عند التضيّق يجب تخفيف السرعة والاستعداد للتوقف.","قد يصعب عليك المرور بجانب مركبات أخرى."],"c|u8-ponte":["جسر متحرك (ponte mobile)","جسر يرتفع لتمر السفن.","راقب مواعيد الفتح (لوحات)","توقف إذا ومضت الأضواء الحمراء"],"q|u8-ponte|0":["الإشارة المرسومة تنبه إلى جسر متحرك.","صحيح."],"q|u8-ponte|1":["عند الجسر المتحرك يجب التوقف إذا ومضت الأضواء الحمراء.","الجسر على وشك الارتفاع."],"q|u8-ponte|2":["الإشارة المرسومة تنبه إلى طريق زلق.","هي جسر متحرك."],"c|u8-banchina":["كتف طريق خطر (banchina pericolosa)","كتف الطريق هش: خطر السقوط في الحفرة الجانبية.","لا تقترب كثيرًا من الحافة اليمنى","الرسم يُظهر السيارة «تنزلق» من الحافة.","لا تعني «ممنوع التوقف»: تعني أن حافة الطريق قد تنهار."],"q|u8-banchina|0":["الإشارة المرسومة تدل على كتف طريق هش.","كتف طريق خطر."],"q|u8-banchina|1":["عند الإشارة المرسومة يجب تجنب الاقتراب كثيرًا من الحافة اليمنى.","الحافة قد تنهار."],"q|u8-banchina|2":["الإشارة المرسومة تدل على طريق زلق.","هي كتف طريق خطر: السيارة مائلة نحو الحافة، لا تنزلق."],"c|u8-sdrucciolevole":["طريق زلق (strada sdrucciolevole)","سطح زلق أو أملس: يُفقد التماسك بسهولة.","سرعة معتدلة","لا مناورات مفاجئة","قد تكون معه لوحة «بسبب المطر» أو «بسبب الجليد»","الخطان المتعرجان خلف السيارة = الإطارات تنزلق.","مختلف عن «مواد غير ثابتة» (التي تتحدث عن الحصى)."],"q|u8-sdrucciolevole|0":["الإشارة المرسومة تنبه إلى مقطع طريق سطحه زلق.","سيارة عليها آثار انزلاق."],"q|u8-sdrucciolevole|1":["عند الإشارة المرسومة يجب تجنب المناورات المفاجئة.","التماسك قليل."],"q|u8-sdrucciolevole|2":["الإشارة المرسومة تدل على حصى قد يُقذف.","هي طريق زلق (سيارة تنزلق). الحصى هو «مواد غير ثابتة»."],"c|u8-materiale":["مواد غير ثابتة على الطريق (materiale instabile)","حصى على الطريق قد تقذفه العجلات.","خفف السرعة، خصوصًا عند مقابلة مركبات أخرى أو بالقرب من المشاة","زد المسافة عن المركبة التي أمامك","التماسك أقل","حصى يطير = ابتعد عن التي أمامك.","مع خلفية صفراء: موقع أعمال."],"q|u8-materiale|0":["الإشارة المرسومة تنبه إلى وجود حصى قد يُقذف بعيدًا.","مواد غير ثابتة."],"q|u8-materiale|1":["عند الإشارة المرسومة يُستحسن زيادة المسافة عن المركبة التي أمامك.","لتتجنب الحصى الذي تقذفه عجلاته const ROT = { S: 0, W: 90, N: 180, E: 270 };
const VCOL = { A: '#2463c9', B: '#d3272b', C: '#1e9a58', D: '#8a4bd1', T: '#e2a40c' };
function rotPt(x, y, deg) { const r = deg * Math.PI / 180, dx = x - 150, dy = y - 150; return [150 + dx * Math.cos(r) - dy * Math.sin(r), 150 + dx * Math.sin(r) + dy * Math.cos(r)]; }
const PATH = { d: 'M165 228 L165 40', dx: 'M165 228 L165 188 Q165 165 188 165 L262 165', sx: 'M165 228 L165 150 Q165 135 150 135 L40 135' };
function crossSVG(sc, done) {
  let s = `<svg viewBox="0 0 300 300" class="crosssvg" role="img" aria-label="Incrocio">
  <rect width="300" height="300" fill="var(--green-soft)"/><rect x="118" y="0" width="64" height="300" fill="#6b7370"/><rect x="0" y="118" width="300" height="64" fill="#6b7370"/>
  <path d="M150 0 V112 M150 188 V300 M0 150 H112 M188 150 H300" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>`;
  for (const v of sc.v) {
    const deg = ROT[v.from], col = VCOL[v.id];
    const gone = done.includes(v.id);
    s += `<g transform="rotate(${deg} 150 150)" opacity="${gone ? .25 : 1}">`;
    if (v.tram) s += `<path d="M160 300 V0 M170 300 V0" stroke="#3b4240" stroke-width="2"/>`;
    s += `<path d="${PATH[v.dir]}" stroke="${col}" stroke-width="4" fill="none" stroke-dasharray="7 5" marker-end="url(#ah${v.id})"/>`;
    s += `<defs><marker id="ah${v.id}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="${col}"/></marker></defs>`;
    s += `<rect x="${v.tram ? 153 : 154}" y="${v.tram ? 232 : 236}" width="${v.tram ? 24 : 22}" height="${v.tram ? 56 : 36}" rx="5" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    if (v.sign === 'stop') s += `<path d="M197 212 h8 l6 6 v8 l-6 6 h-8 l-6 -6 v-8Z" fill="#d3272b" stroke="#fff" stroke-width="1.5"/>`;
    if (v.sign === 'dare') s += `<path d="M190 212 H214 L202 232Z" fill="#fff" stroke="#d3272b" stroke-width="3"/>`;
    s += `</g>`;
    const [lx, ly] = rotPt(165, v.tram ? 260 : 254, deg);
    s += `<g data-veh="${v.id}" style="cursor:pointer" opacity="${gone ? .35 : 1}"><circle cx="${lx}" cy="${ly}" r="17" fill="transparent"/><text x="${lx}" y="${ly + 6}" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Arial,sans-serif">${v.id}</text></g>`;
  }
  return s + '</svg>';
}
function crossCheck(sc, seq) {
  // sequenza valida se rispetta l'ordine dei gruppi (dentro un gruppo, ordine libero)
  let i = 0;
  for (const g of sc.order) { const part = seq.slice(i, i + g.length); if (part.length < g.length) return null; if (!g.every(x => part.includes(x))) return false; i += g.length; }
  return true;
}
function pickScenarios(n) {
  const c = S.cross || {};
  return weightedPick(SCEN, n, s => { const r = c[s.id]; return !r ? 3 : r.ok >= 2 ? 0.5 : 2 + (r.ko || 0); });
}

  if (!cs.res) h += `<button class="btn line" data-act="crossreset">↺ Ricomincia</button>`;

// ───── Probabilità di promozione ─────
const P_STAGE = [0.5, 0.72, 0.85, 0.92, 0.97];
function passProbability() {
  const answered = Object.values(S.days).reduce((t, x) => t + x.q, 0);
  if (answered < 30) return null;
  let p = ATOMS.reduce((t, a) => { const s = peek(a.id); return t + (s?.red ? 0.45 : P_STAGE[s?.seen ? s.st : 0]); }, 0) / ATOMS.length;
  const sims = (S.sims || []).slice(-3);
  if (sims.length) { const acc = sims.reduce((t, x) => t + (30 - x.err) / 30, 0) / sims.length; p = 0.5 * p + 0.5 * acc; }
  const q = 1 - p; let P = 0, c = 1;
  for (let k = 0; k <= 3; k++) { if (k > 0) c = c * (30 - k + 1) / k; P += c * Math.pow(q, k) * Math.pow(p, 30 - k); }
  return P;

  const cross = crossN ? pickScenarios(crossN) : [];
  const lines = [];
  if (brake) lines.push({ i: '🧯', t: `Freno attivo: ${due.length} ripassi arretrati. Oggi niente argomenti nuovi, prima recuperiamo.` });
  if (rev.length) lines.push({ i: '🔁', t: `Ripassa ${rev.length} ${rev.length === 1 ? 'concetto che stai' : 'concetti che stai'} dimenticando` });
  if (neu.length) {
    const us = [...new Set(neu.map(a => a.u))].map(u => UNIT[u].title);
    const partial = newAtoms().filter(a => a.u === neu[neu.length - 1].u).length > neu.filter(a => a.u === neu[neu.length - 1].u).length;
    lines.push({ i: '🆕', t: `Nuovo: ${us.join(' + ')}${partial ? ' (parte)' : ''}` });
  }
  if (quiz.length) { const wu = weakestUnit(); lines.push({ i: '🎯', t: `${quiz.length} domande mirate${wu ? ` (focus: ${wu.title})` : ''}` }); }
  if (cross.length) lines.push({ i: '🚦', t: `${cross.length === 1 ? '1 incrocio' : cross.length + ' incroci'} da risolvere` });
  if (boss) lines.push({ i: '⚔️', t: `Boss Battle: Mondo ${boss.n} (20 domande, serve il 90%)` });

  if (!lines.length || (!rev.length && !neu.length && !quiz.length && !sfida.length)) lines.push({ i: '🎉', t: 'Tutto in pari! Fai qualche domanda di rinforzo.' });

}
function stepsFromMission(M) {
  const steps = [];
  M.rev.forEach(a => steps.push({ k: 'q', a: a.id, mode: 'rev', ph: '🔁 Ripasso' }));
  M.neu.forEach(a => { steps.push({ k: 'card', a: a.id, ph: '🆕 ' + UNIT[a.u].title }); steps.push({ k: 'q', a: a.id, mode: 'learn', ph: '🆕 Verifica' }); });
  M.quiz.forEach(a => steps.push({ k: 'q', a: a.id, mode: 'quiz', ph: '🎯 Domande mirate' }));
  (M.cross || []).forEach(sc => steps.push({ k: 'cross', sc: sc.id, ph: '🚦 Incrocio' }));
  if (M.boss) { steps.push({ k: 'intro', boss: M.boss.id }); bossSteps(M.boss.id).forEach(s => steps.push(s)); }
  else if (M.sfida.length) { steps.push({ k: 'intro', sfida: 1 }); M.sfida.forEach(a => steps.push({ k: 'q', a: a.id, mode: 'sfida', ph: '⚡ Mini-sfida' })); }
  if (!steps.length) weightedPick(ATOMS, 6, weakness).forEach(a => steps.push({ k: 'q', a: a.id, mode: 'quiz', ph: '🎯 Rinforzo' }));
  return steps;
}
function bossSteps(mid) {
  const m = MONDI.find(x => x.id === mid);
  const pool = ATOMS.filter(a => m.units.includes(a.u));
  const qs = [];
  for (const a of shuffle(pool)) qs.push({ k: 'q', a: a.id, qi: pickQ(a), mode: 'boss', ph: `⚔️ Boss · Mondo ${m.n}`, boss: mid });
  while (qs.length < 20) { const a = pool[Math.random() * pool.length | 0]; qs.push({ k: 'q', a: a.id, mode: 'boss', ph: `⚔️ Boss · Mondo ${m.n}`, boss: mid }); }
  return qs.slice(0, 20);
}

function next() {

function finish() {
  clearInterval(TIMER);

  for (const [mid, sc] of Object.entries(SES.bossScore)) {
    const b = S.boss[mid] || (S.boss[mid] = { best: 0, passed: false });
    b.best = Math.max(b.best, sc.ok); if (sc.ok >= 18) b.passed = true;
  }

}
function answer(val) {
  const step = SES.steps[SES.i], a = ATOM[step.a], qs = SES.qstate;
  if (!qs || qs.phase !== 'ask') return;
  clearInterval(TIMER);
  qs.ans = val; qs.correct = (val === a.q[qs.qi].v);
  if (val === null) { commit(false); return; }
  if (step.mode === 'sfida' || step.mode === 'boss') { commit(true); return; }
  qs.phase = 'conf'; render();
}
function commit(sure) {
  const step = SES.steps[SES.i], a = ATOM[step.a], qs = SES.qstate;
  qs.sure = sure; qs.phase = 'done';
  if (step.mode === 'trap' && !peek(a.id)?.seen) { const t = today(), d = S.days[t] || (S.days[t] = { q: 0, ok: 0 }); d.q++; if (qs.correct) d.ok++; save(); }
  else record(a, qs.qi, qs.correct, sure, step.mode);
  SES.res.push({ a: a.id, qi: qs.qi, ok: qs.correct, sure, mode: step.mode });
  if (step.boss) { const b = SES.bossScore[step.boss] || (SES.bossScore[step.boss] = { ok: 0, n: 0 }); b.n++; if (qs.correct) b.ok++; }
  if (!qs.correct && !['sfida', 'boss', 'browse'].includes(step.mode) && !SES.requeued.has(a.id)) {
    SES.requeued.add(a.id);
    let pos = Math.min(SES.i + 4, SES.steps.length);
    const firstTimed = SES.steps.findIndex((s, j) => j > SES.i && (s.k === 'intro'));
    if (firstTimed > -1 && pos > firstTimed) pos = firstTimed;
