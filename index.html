<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Via Libera">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface2:#f5f7f5; --ink:#141b18; --muted:#5b6862; --line:#d9dfdb;
  --accent:#0b7a4f; --accent-ink:#ffffff; --accent-soft:#dff1e8;
  --blue:#2463c9; --orange:#e2780c; --yellow:#d9a400; --green:#1e9a58; --red:#d3272b;
  --blue-soft:#e3ecfb; --orange-soft:#fdeede; --yellow-soft:#fbf2cf; --green-soft:#def3e7; --red-soft:#fbe3e3;
  --shadow:0 1px 2px rgba(20,27,24,.06),0 4px 14px rgba(20,27,24,.06);
  --r:16px;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1513; --surface:#18201d; --surface2:#1f2925; --ink:#e7eeea; --muted:#9aa9a2; --line:#2c3833;
  --accent:#33b27a; --accent-ink:#06140e; --accent-soft:#16392a;
  --blue:#6d9df0; --orange:#f39a45; --yellow:#e8c547; --green:#4cc585; --red:#f06a6a;
  --blue-soft:#1b2a44; --orange-soft:#3a2714; --yellow-soft:#393013; --green-soft:#16392a; --red-soft:#3f1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1513; --surface:#18201d; --surface2:#1f2925; --ink:#e7eeea; --muted:#9aa9a2; --line:#2c3833;
  --accent:#33b27a; --accent-ink:#06140e; --accent-soft:#16392a;
  --blue:#6d9df0; --orange:#f39a45; --yellow:#e8c547; --green:#4cc585; --red:#f06a6a;
  --blue-soft:#1b2a44; --orange-soft:#3a2714; --yellow-soft:#393013; --green-soft:#16392a; --red-soft:#3f1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:23px} h3{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;font-weight:600;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px}

/* mastery */
.meter{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.stagebar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.stagebar i{display:block;height:100%}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}

/* time chips */
.timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tchip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-weight:700}
.tchip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* mission */
.mission{counter-reset:m;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mission li{display:flex;gap:12px;align-items:flex-start}
.mission .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.cta{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.5px}
.cta:disabled{opacity:.5}
.btn{border-radius:12px;padding:12px 14px;background:var(--surface2);font-weight:700;text-align:center}
.btn.line{background:transparent;border:2px solid var(--line)}
.btn.red{background:var(--red-soft);color:var(--red)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:9px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px;line-height:1}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* session */
.shead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:3;display:flex;gap:10px;align-items:center}
.shead .meter{flex:1;height:8px}
.shead .meter i{background:var(--accent)}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.phase{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface2)}
.tag.fond{background:var(--accent-soft);color:var(--accent)}
.tag.gem{background:var(--blue-soft);color:var(--blue)}
.tag.num{background:var(--yellow-soft);color:var(--ink)}
.tag.ecc{background:var(--orange-soft);color:var(--orange)}
.tag.conc{background:var(--blue-soft);color:var(--blue)}
.box{border-radius:12px;padding:12px 14px}
.box h4{margin:0 0 4px;font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:1px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.b-ricorda{background:var(--accent-soft)}
.b-trucco{background:var(--yellow-soft)}
.b-att{background:var(--red-soft)}
.b-es{background:var(--surface2)}
.signwrap{display:grid;place-items:center;background:var(--surface2);border-radius:14px;padding:14px}
.sign{width:132px;height:132px}
.sign.sm{width:72px;height:72px}
.twins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twin{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.twin h3{font-size:17px}
.twin ul{margin:0;padding-left:16px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.twin .sign{width:78px;height:78px;align-self:center}

/* question */
.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;transition:transform .15s}
.qtext{font-size:20px;line-height:1.35;font-weight:700}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf button{padding:18px 8px;border-radius:14px;font-family:var(--display);font-size:22px;font-weight:700;border:2px solid var(--line);background:var(--surface)}
.vf .f{color:var(--red)} .vf .v{color:var(--green)}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf button{padding:14px 8px;border-radius:14px;background:var(--surface2);font-weight:700}
.result{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.result.ok{background:var(--green-soft)}
.result.ko{background:var(--red-soft)}
.result h3{font-size:22px}
.result.ok h3{color:var(--green)} .result.ko h3{color:var(--red)}
.why{display:flex;flex-direction:column;gap:2px}
.why b{font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:13px}
.timer{font-family:var(--display);font-weight:700;font-size:18px}
.timer.low{color:var(--red)}
.hint{text-align:center;font-size:13px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px;font:inherit}
input[type=date]{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}

/* lists */
.unit{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.unit:first-of-type{border-top:0}
.mondo.locked{opacity:.55}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.err{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.err:first-child{border-top:0}
.ans{font-weight:700}
.ans.v{color:var(--green)} .ans.f{color:var(--red)}
.center{text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.train{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.train button{background:var(--surface2);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.train small{font-size:12px;color:var(--muted)}
.crosswrap{display:grid;place-items:center}
.crosssvg{width:100%;max-width:340px;height:auto;border-radius:14px}
.exgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.exdot{aspect-ratio:1;border-radius:8px;background:var(--surface);font-size:12px;font-weight:700;border:2px solid var(--line)}
.exdot.on{background:var(--accent-soft);border-color:var(--accent)}
.exdot.cur{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.vf button[aria-pressed="true"].v{background:var(--green-soft);border-color:var(--green)}
.vf button[aria-pressed="true"].f{background:var(--red-soft);border-color:var(--red)}
mark.trap{background:var(--yellow-soft);color:inherit;padding:0 3px;border-radius:4px;box-shadow:0 0 0 2px var(--yellow)}
.chips .pill{white-space:nowrap}

.trbtn{align-self:flex-start;padding:7px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px}
.trbtn[aria-pressed="true"]{background:var(--surface2);color:var(--muted)}
.trbox{background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-family:"Noto Sans Arabic",Tahoma,system-ui,sans-serif;font-size:18px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
.trbox ul{margin:0;padding-right:20px;padding-left:0;display:flex;flex-direction:column;gap:4px}
.trq{font-weight:700}
.trwhy{font-size:16px}

:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Sezioni"><div>
<button data-v="home"><span>🏠</span>Oggi</button>
<button data-v="path"><span>🗺️</span>Percorso</button>
<button data-v="stats"><span>📈</span>Progressi</button>
<button data-v="errors"><span>📓</span>Errori</button>
</div></nav>
<script>const IS_PWA = true;</script>
<script>
// VIA LIBERA — contenuti v1 (lezioni 1–9 di quizpatenteonline.it)
// tag: fond = fondamentale, sec = secondaria, gem = gemelli, num = da memorizzare, ecc = eccezione, conc = da capire
const SRC = 'https://www.quizpatenteonline.it/teoria-patente/';

const MONDI = [
  { id: 'm1', n: 1, name: 'Fondamenta', icon: '🏗️', units: ['u1','u2','u3','u4','u5','u6'], ready: true },
  { id: 'm2', n: 2, name: 'Segnali verticali', icon: '🔺', units: ['u7','u8','u9'], ready: true, partial: 'Per ora: segnali di pericolo. In arrivo divieto, obbligo, precedenza, indicazione.' },
  { id: 'm3', n: 3, name: 'A terra, semafori, agenti', icon: '🚦', units: [], ready: false },
  { id: 'm4', n: 4, name: 'Regole di marcia', icon: '🧭', units: [], ready: false },
  { id: 'm5', n: 5, name: 'Soste, luci, norme varie', icon: '🅿️', units: [], ready: false },
  { id: 'm6', n: 6, name: 'Sicurezza e persona', icon: '🛡️', units: [], ready: false },
  { id: 'm7', n: 7, name: 'Documenti, veicolo, ambiente', icon: '📄', units: [], ready: false },
];

const UNITS = [
  { id: 'u1', m: 'm1', lez: 1, title: 'La strada e le sue parti', src: SRC + 'strada' },
  { id: 'u2', m: 'm1', lez: 2, title: 'Tipi di strade e zone', src: SRC + 'classificazione-strade' },
  { id: 'u3', m: 'm1', lez: 3, title: 'I veicoli', src: SRC + 'definizione-e-classificazione-dei-veicoli' },
  { id: 'u4', m: 'm1', lez: 4, title: 'Pannelli sui veicoli', src: SRC + 'pannelli-retroriflettenti-sui-veicoli' },
  { id: 'u5', m: 'm1', lez: 5, title: 'Doveri del conducente', src: SRC + 'doveri-del-conducente' },
  { id: 'u6', m: 'm1', lez: 6, title: 'Pedoni e utenti vulnerabili', src: SRC + 'comportamenti-da-tenere-verso-gli-utenti-della-strada' },
  { id: 'u7', m: 'm2', lez: 7, title: 'Pericolo 1: forme, curve, dossi, treni', src: SRC + 'segnali-di-pericolo-1' },
  { id: 'u8', m: 'm2', lez: 8, title: 'Pericolo 2: attraversamenti, pendenze, strettoie', src: SRC + 'segnali-di-pericolo-2' },
  { id: 'u9', m: 'm2', lez: 9, title: 'Pericolo 3: animali, rotatorie, vento', src: SRC + 'segnali-di-pericolo-3' },
];

const ATOMS = [
// ───────────── U1 LA STRADA ─────────────
{ id:'u1-strada', u:'u1', tag:'fond', type:'concept', title:'Strada',
  cos:'È tutto lo spazio pubblico dove ci si muove: auto, pedoni, bici, animali. Include anche marciapiedi, banchine e piste ciclabili.',
  ricorda:['Area ad uso pubblico per pedoni, veicoli e animali','Comprende marciapiedi, banchine, piste ciclabili','Può avere una o più carreggiate'],
  trucco:'STRADA = il contenitore più grande. Tutto il resto sta dentro.',
  attenzione:'"Strada" e "carreggiata" NON sono sinonimi. Il quiz gioca proprio su questo.',
  esempio:'Una via di città: il marciapiede dove cammini fa parte della strada, ma non della carreggiata.',
  alt:{semplice:'La strada è tutto: dove camminano le persone e dove passano le auto.', esempio:'Guarda una via dall\'alto: da un muro di casa al muro di fronte, tutto quello che vedi è "strada".'},
  q:[
    {s:'La strada è l\'area ad uso pubblico destinata alla circolazione dei pedoni, dei veicoli e degli animali.', v:true, why:'È la definizione del Codice: pedoni, veicoli e animali.'},
    {s:'La strada comprende anche i marciapiedi e le banchine.', v:true, why:'Marciapiedi, banchine e piste ciclabili fanno parte della strada (ma non della carreggiata).'},
    {s:'La strada è destinata esclusivamente alla circolazione dei veicoli.', v:false, why:'Anche pedoni e animali. "Esclusivamente" è la parola trappola.'},
  ]},
{ id:'u1-carreggiata', u:'u1', tag:'fond', type:'concept', title:'Carreggiata',
  cos:'È la parte della strada dove circolano i veicoli. È "l\'asfalto per le auto".',
  ricorda:['Parte della strada destinata ai veicoli','Comprende corsie e attraversamenti pedonali/ciclabili','NON comprende marciapiedi, banchine, piste ciclabili','Può essere a senso unico o a doppio senso'],
  trucco:'CARREggiata → per i CARRI (veicoli).',
  attenzione:'Le strisce pedonali fanno parte della carreggiata (sono disegnate sull\'asfalto dei veicoli). Il marciapiede no.',
  esempio:'Una strada con spartitraffico in mezzo ha DUE carreggiate, una per senso.',
  alt:{semplice:'La carreggiata è solo il pezzo di asfalto dove vanno le macchine.', esempio:'Se togli dalla strada marciapiedi e banchine, quello che resta è la carreggiata.'},
  q:[
    {s:'La carreggiata è la parte della strada destinata alla circolazione dei veicoli.', v:true, why:'Definizione esatta.'},
    {s:'La carreggiata comprende i marciapiedi.', v:false, why:'Il marciapiede è fuori dalla carreggiata (è per i pedoni).'},
    {s:'La carreggiata può essere a doppio senso di circolazione.', v:true, why:'Sì: a senso unico o a doppio senso.'},
    {s:'La carreggiata comprende le banchine.', v:false, why:'La banchina è oltre la striscia di margine: fuori dalla carreggiata.'},
    {s:'Una strada può avere più carreggiate separate da uno spartitraffico.', v:true, why:'Tipico di autostrade e strade extraurbane principali.'},
  ]},
{ id:'u1-corsia', u:'u1', tag:'fond', type:'concept', title:'Corsia',
  cos:'È una "fetta" della carreggiata, larga abbastanza per UNA fila di veicoli, delimitata da strisce.',
  ricorda:['Parte della carreggiata','Per una sola fila di veicoli','Delimitata da strisce continue o discontinue','Una corsia NON è mai a doppio senso'],
  trucco:'Una corsia = una fila = un senso.',
  attenzione:'Se il quiz dice "corsia a doppio senso" è falso. La CARREGGIATA può essere a doppio senso, la corsia no.',
  esempio:'In autostrada vedi 3 corsie per senso: sono 3 file di auto affiancate.',
  alt:{semplice:'La corsia è la "fila" dove sta la tua auto, tra due strisce.', esempio:'Pensa alle corsie di una piscina: ognuna ha un solo nuotatore in fila.'},
  q:[
    {s:'La corsia è una parte della carreggiata che consente il transito di una sola fila di veicoli.', v:true, why:'Definizione esatta.'},
    {s:'La corsia può essere a doppio senso di circolazione.', v:false, why:'Una corsia ha sempre un solo senso. È la carreggiata che può avere due sensi.'},
    {s:'La corsia è delimitata da strisce longitudinali.', v:true, why:'Strisce continue o discontinue.'},
  ]},
{ id:'u1-matrioska', u:'u1', tag:'gem', type:'twins', title:'Strada ⊃ Carreggiata ⊃ Corsia',
  twins:{a:{title:'Strada', lines:['Tutto lo spazio pubblico','Pedoni, veicoli, animali','Con marciapiedi e banchine']}, b:{title:'Carreggiata', lines:['Solo la parte per i veicoli','Contiene le corsie','Senza marciapiedi e banchine']}, diff:'Come una matrioska: la STRADA contiene la CARREGGIATA, che contiene le CORSIE.'},
  trucco:'Matrioska: Strada (grande) → Carreggiata (media) → Corsia (piccola).',
  attenzione:'Il quiz scambia spesso i termini: leggi con attenzione quale parola usa.',
  alt:{semplice:'Casa → stanza → letto. Strada → carreggiata → corsia.', esempio:'La tua auto sta in una corsia, dentro la carreggiata, dentro la strada.'},
  q:[
    {s:'La corsia fa parte della carreggiata.', v:true, why:'La carreggiata è divisa in corsie.'},
    {s:'La carreggiata fa parte della strada.', v:true, why:'La strada contiene la carreggiata.'},

const mir = s => `<g transform="translate(100 0) scale(-1 1)">${s}</g>`;
const emo = (e, y=76, size=30) => `<text x="50" y="${y}" font-size="${size}" text-anchor="middle" style="filter:grayscale(1) brightness(.18) contrast(3)">${e}</text>`;
const stick = (x, y, s=1) => `<g transform="translate(${x} ${y}) scale(${s})" stroke="${K}" stroke-width="4.5" stroke-linecap="round" fill="none"><circle cx="1" cy="-22" r="4.5" fill="${K}" stroke="none"/><path d="M0 -16 L-3 0 M-3 0 L-9 12 M-3 0 L5 12 M-1 -12 L-8 -5 M-1 -12 L7 -6"/></g>`;
const car = (x, y, rot=0) => `<g transform="translate(${x} ${y}) rotate(${rot})" fill="${K}"><rect x="-12" y="-4" width="24" height="9" rx="2"/><path d="M-8 -4 L-5 -10 H5 L8 -4Z"/><circle cx="-7" cy="6" r="3"/><circle cx="7" cy="6" r="3"/></g>`;
const carRear = (x, y) => `<g transform="translate(${x} ${y})" fill="${K}"><rect x="-11" y="-6" width="22" height="10" rx="3"/><path d="M-8 -6 L-6 -12 H6 L8 -6Z"/><rect x="-11" y="4" width="5" height="5" rx="1"/><rect x="6" y="4" width="5" height="5" rx="1"/></g>`;
const arrowHead = (x, y, ang) => `<path d="M0 -7 L8 0 L0 7Z" fill="${K}" transform="translate(${x} ${y}) rotate(${ang})"/>`;

function rotatoria() {
  let s = `<circle cx="50" cy="62" r="13" fill="none" stroke="${K}" stroke-width="5"/>`;
  for (const a of [90, 210, 330]) { // antiorario
    const rad = a * Math.PI / 180, x = 50 + 13 * Math.cos(rad), y = 62 - 13 * Math.sin(rad);
    s += arrowHead(x.toFixed(1), y.toFixed(1), (-a - 90).toFixed(0));
  }
  return s;
}
function massi() {
  return `<path d="M24 80 L27 58 L33 48 L38 42 L41 80Z" fill="${K}"/><path d="M47 52 l6 -2 l3 5 l-5 4 l-5 -2Z M56 64 l7 -1 l2 6 l-6 3 l-4 -4Z M47 71 l5 0 l2 5 l-5 2 l-3 -3Z" fill="${K}"/><path d="M41 80 H76" stroke="${K}" stroke-width="3"/>`;
}
function barre(n) {
  let s = `<rect x="30" y="4" width="40" height="92" rx="3" fill="${W}" stroke="#9aa3a0" stroke-width="2"/>`;
  const ys = n === 3 ? [26, 52, 78] : n === 2 ? [38, 66] : [52];
  for (const y of ys) s += `<path d="M31 ${y+6} L69 ${y-10} L69 ${y+2} L31 ${y+18}Z" fill="${R}"/>`;
  return s;
}
function croce(double) {
  const arm = (a, cy, len=84) => `<rect x="${50-len/2}" y="${cy-8}" width="${len}" height="16" rx="1" fill="${W}" stroke="${R}" stroke-width="4" transform="rotate(${a} 50 ${cy})"/>`;
  if (!double) return arm(35, 50) + arm(-35, 50);
  return arm(35, 36, 70) + arm(-35, 36, 70) +
    `<rect x="16" y="58" width="42" height="14" fill="${W}" stroke="${R}" stroke-width="4" transform="rotate(35 37 65)"/><rect x="42" y="58" width="42" height="14" fill="${W}" stroke="${R}" stroke-width="4" transform="rotate(-35 63 65)"/>`;
}

{ id:'u31-spazi', u:'u31', tag:'fond', type:'concept', title:'Reazione + frenatura = arresto',
